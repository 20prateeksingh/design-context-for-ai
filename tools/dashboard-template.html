<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design Context Dashboard</title>
<style>
  /* Design system: dark canvas (Prateek 2026-07, v2.4 — palette locked from the Figma mock, node 44-208).
     Dark-only, no toggle. ALL chrome color flows through these :root tokens — nothing below may carry a
     raw color that duplicates one (§1). The whitelabel accent (observed from the captured product,
     tokens.json.brand) overrides --accent/--accent-strong/--accent-text at boot; the values here are the
     brand-less fallbacks. Captured artifacts (screenshots, thumbnails, snapshots) are NEVER themed —
     they are the light in this design. Elevation = surface (--panel → --panel-2) + 1px --line borders,
     not shadows; --elev is the one popover shadow kept for separation. System font stacks (no CDN). */
  :root { color-scheme:dark;
          --bg:#08090A; --bg-deep:#050506; --panel:#131316; --panel-2:#1C1C1F; --card:var(--panel);
          --line:#26262B; --txt:#F5F6F7; --dim:#8A8F98; --rail:var(--panel-2); --link:var(--accent-strong);
          /* (v2.5 §2.1) THE LUMINOUS CANVAS. The map is not a void in dark chrome — it is a lit surface
             INSET in dark chrome (Figma's own dark-mode relationship). --canvas is that surface's base:
             lighter than --bg (so the pane reads as an inset canvas, Δ≥8/channel) and darker than
             --panel-2 (so a floating legend/card still reads as chrome ON it). --canvas-lit is the same
             surface where the lamp is — the base the accent is mixed into around home. Two tokens, not
             one, so the lighting gradient carries no raw hex outside :root (§1). */
          --canvas:#171A20; --canvas-lit:#1B1F26;
          --accent:#4F46E5; --accent-strong:#918BEE; --accent-text:#FFFFFF;
          --ok:#33B074; --bad:#E85D5D; --tpl:#9D7BF5; --warn:#D99A3D;
          /* (v2.4.2 F3) the brighter hairline the mock's top-bar pills wear — measured off
             mock-topbar.png at ≈#3D3D3E, expressed as a mix of the frozen palette, not a new colour. */
          --line-2:color-mix(in srgb, var(--txt) 22%, var(--bg));
          --elev:0 12px 34px rgba(0,0,0,.55);
          --mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
          --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
          --pad:clamp(16px,4vw,44px); /* the one horizontal page gutter — header band and body share it */
          /* (v2.4.2 F4) THE stacking breakpoint: below it the Home rail wraps under the content, so a
             rail swap would change something off-screen — selections navigate to the full page doc
             instead. This declaration is the token; JS reads it from here. CSS cannot resolve a custom
             property inside a media query, so every `@media (max-width:1080px)` block below is slaved
             to this value — change them together. */
          --stack-bp:1080px;
          --fb-h:0px; /* F7: file:// banner height — 0 unless mounted, so server mode never shifts layout */ }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; }
  body { background:var(--bg); color:var(--txt); font:14px/1.55 var(--sans); overflow:hidden; }
  button { font:inherit; cursor:pointer; }
  a { color:var(--link); text-decoration:none; }
  a:hover { text-decoration:underline; }
  :focus-visible { outline:2px solid var(--accent-strong); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce){ *,*::before,*::after{ transition:none!important; animation:none!important; } }

  /* ── file:// banner (F7) — mounted only when detected; --fb-h stays 0px in server mode so this
     block changes nothing there (no reflow, no reserved space). ── */
  .filebanner { position:fixed; top:0; left:0; right:0; z-index:30; display:flex; align-items:flex-start; gap:12px;
                background:color-mix(in srgb, var(--warn) 9%, var(--bg)); border-bottom:1px solid color-mix(in srgb, var(--warn) 35%, var(--bg)); color:var(--warn); font-size:13px;
                padding:10px 16px; line-height:1.5; }
  .filebanner b { font-weight:650; }
  .filebanner code { font-family:var(--mono); background:color-mix(in srgb, var(--warn) 15%, transparent); border-radius:4px; padding:0 4px; }
  .filebanner .fb-body { flex:1; }
  .filebanner .fb-close { flex:none; background:none; border:0; color:var(--warn); font-size:18px; line-height:1;
                           padding:2px 6px; border-radius:6px; }
  .filebanner .fb-close:hover { background:color-mix(in srgb, var(--warn) 15%, transparent); }

  /* ── shell (v2.4: bar sits on --bg, brand = "AI Design context", accent-filled capture CTA) ── */
  /* the bar shares the page gutter, so the brand hangs off the same left edge as the header tile and
     the first atlas card — the alignment the mock reads on (v2.4.1). */
  #shell { position:fixed; top:var(--fb-h); left:0; right:0; height:52px; display:flex; align-items:center; gap:10px;
           padding:0 var(--pad); background:var(--bg); border-bottom:1px solid var(--line); z-index:20; }
  #shell h1 { font-size:14px; font-weight:700; margin-right:8px; white-space:nowrap; }
  #shell h1 .mono { font-family:var(--mono); color:var(--dim); font-weight:400; font-size:12px; }
  .tabs { display:flex; gap:2px; background:var(--panel); border:1px solid var(--line); border-radius:9px; padding:3px; }
  .tab { display:flex; align-items:center; gap:7px; border:0; background:none; color:var(--dim); font-size:13px;
         font-weight:550; padding:5px 13px; border-radius:6px; transition:background .2s,color .2s; }
  .tab svg { width:14px; height:14px; }
  .tab.active { background:var(--panel-2); color:var(--txt); }
  .tab:hover:not(.active) { color:var(--txt); }
  .spacer { flex:1; }
  /* ── the right cluster, matched to mock-topbar.png (v2.4.2 F3) ──
     Measured off the mock at 1600px: every item in the cluster is a 28px-tall FULL pill; the two chips
     carry NO fill (the bar's own --bg shows through) and are drawn by a hairline brighter than the
     body's --line (≈#3D3D3E → --line-2); inside padding ~10-11px; the leading dot is 13px and WHITE.
     The previous build filled both chips with --panel and dimmed the Journal dot/label — that filled
     grey chip is the difference Prateek flagged. Buttons keep display:block (JS toggles it) and centre
     their label with line-height, so no flex/display conflict can hide them. */
  .pill { font-size:12px; color:var(--txt); background:transparent; border:1px solid var(--line-2);
          border-radius:999px; height:28px; padding:0 11px; display:inline-flex; align-items:center; white-space:nowrap; }
  .pill b { color:var(--txt); }
  .jpill { gap:8px; padding-left:10px; }
  .jpill::before { content:""; width:13px; height:13px; border-radius:50%; background:var(--txt); flex:none; }
  #server-pill.on { color:var(--ok); border-color:color-mix(in srgb, var(--ok) 40%, var(--bg)); }
  #capbtn { font-size:12px; font-weight:600; background:var(--accent); color:var(--accent-text); border:0;
            border-radius:999px; height:28px; line-height:28px; padding:0 13px; display:none; transition:filter .2s; }
  #capbtn:hover { filter:brightness(1.12); }
  #capbtn:disabled { opacity:.5; cursor:wait; }
  /* (v2.4.1 §4) the one GLOBAL action is neutral-white, not accent: per the mock, accent is reserved for
     contextual ledger/content CTAs, and a white button stops the top bar double-accenting next to the
     readiness ring. Dark text on a --txt fill is ~19:1 by construction. (v2.4.2 F3: pill radius + the
     cluster's shared 28px box — the mock's button is the same capsule as the chips beside it.) */
  #recapbtn { font-size:12px; font-weight:600; background:var(--txt); color:var(--bg); border:0;
              border-radius:999px; height:28px; line-height:28px; padding:0 13px; display:none; transition:background .2s; }
  #recapbtn:hover { background:color-mix(in srgb, var(--txt) 88%, var(--bg)); }
  /* onboarding: the tabs and their chrome don't exist yet — hide until the library does */
  #shell.onboarding .tabs, #shell.onboarding .pill, #shell.onboarding .rchip, #shell.onboarding #capbtn, #shell.onboarding #recapbtn { display:none; }
  #shell.onboarding #readypop { display:none; }

  /* ── tab panes ── */
  .pane { position:fixed; inset:calc(52px + var(--fb-h)) 0 0 0; display:none; }
  .pane.active { display:block; }
  .scrollpane { overflow-y:auto; padding:22px var(--pad) 60px; }

  /* ── map pane: M22 orbital on the luminous canvas (v2.5 F1; rail from v2.4 F4) ──
     The SHELL stays --bg: #pane-map, the rail, the top bar. #maparea is the canvas — one radially lit
     --canvas surface, painted as this element's own background so it sits UNDER everything in the world
     (v2.4.1's separate .mappool + .mapfog + .mapgrain overlay stack is retired: an overlay that darkens
     discs is the "wall" Prateek rejected; a lit ground is atmosphere). applyMapView() writes the
     gradient in screen space, centred on home. */
  #pane-map { background:var(--bg); overflow:hidden; }
  #maparea { position:absolute; inset:0 340px 0 0; overflow:hidden; background:var(--canvas); }
  #maprail { position:absolute; right:0; top:0; bottom:0; width:340px; border-left:1px solid var(--line);
             overflow-y:auto; padding:24px 20px 40px; z-index:8; }
  @media (max-width:1080px){ /* = --stack-bp */ #maparea { inset:0 300px 0 0; } #maprail { width:300px; } }
  #mapworld { position:absolute; inset:0; }
  #maplines { position:absolute; inset:0; z-index:1; pointer-events:none; }
  #maplines .eout { stroke:color-mix(in srgb, var(--accent-strong) 60%, transparent); stroke-width:1.4; }
  #maplines .ein { stroke:color-mix(in srgb, var(--dim) 45%, transparent); stroke-width:1.4; }
  .mapring { position:absolute; border:1.5px dashed color-mix(in srgb, var(--txt) 11%, transparent); border-radius:50%; transform:translate(-50%,-50%); pointer-events:none; z-index:1; }
  /* ── labels are PILLS (v2.5 §2.4, the reference's signature) ──
     Every label carries its own surface + hairline, so it is readable on the lit centre, on the mid
     canvas and on the vignette alike — which is what lets the text-halo hack go (a halo is a fake
     surface, and on a lit ground it smears). One shared recipe; only radius and type size differ:
     multi-line node/home labels take the reference's rounded-rect, single-line ring/arc/ghost labels
     take the full capsule the reference gives `DEEP FOG …`. */
  /* The surface is OPAQUE and one step brighter than --panel-2, and the hairline is --line-2 (the
     brighter one :root already keeps for the top-bar pills). Both follow from the ground being a
     GRADIENT: a translucent pill inherits whatever is under it, so it reads as a raised chip at the rim
     and as a hole punched in the lamp at the centre — and plain --line vanishes against a lit canvas
     (Δ≈4/channel). One fixed surface + a hairline that always reads = one pill, everywhere.
     The mix is 96/4 and not brighter for a measured reason: the sub-line inside every pill is --dim, and
     --dim needs 4.5:1. --panel-2 lifted 4% toward --txt measures 4.70:1 on the render; at 10% it drops to
     3.93:1 and the pill would ship a failing caption. So the pill stays a NEUTRAL chip — which is what the
     reference does too: measured on mock-map-luminous.png, its pills are darker than its own lit centre
     (244 vs 254) and are read by their hairline, not by out-shining the lamp. */
  .mapnlbl, .maphomelbl, .maprlbl, .maparclbl, .mapghostlbl {
             background:color-mix(in srgb, var(--panel-2) 96%, var(--txt)); border:1px solid var(--line-2); }
  .maprlbl { position:absolute; transform:translate(-50%,-50%); font-size:9.5px; color:var(--dim); text-transform:uppercase; letter-spacing:.6px; border-radius:999px; padding:2px 9px; pointer-events:none; z-index:2; }
  .maphomelbl { position:absolute; transform:translate(-50%,0); text-align:center; font-size:12px; font-weight:650; color:var(--txt); z-index:3; pointer-events:none; white-space:nowrap;
                border-radius:9px; padding:3px 9px 4px; }
  .maphomelbl small { display:block; font-weight:400; font-size:9.5px; color:var(--dim); }
  /* discs SIT ON the canvas instead of glaring against it (v2.5 §2.3): a soft --canvas-tinted rim
     feathers the jump from a bright thumbnail to the ground, and a real drop shadow finally works now
     that the ground is lighter than the shadow. Hover swaps the rim to accent, keeps the shadow. */
  .mapnode { position:absolute; transform:translate(-50%,-50%); border-radius:50%; border:2.5px solid var(--accent);
             background:var(--panel-2) center/cover no-repeat; z-index:3; padding:0; cursor:pointer;
             box-shadow:0 0 0 3px color-mix(in srgb, var(--canvas) 82%, transparent), 0 5px 16px color-mix(in srgb, var(--bg-deep) 62%, transparent); }
  /* (v2.5.1 F5·2) the rim swaps to accent AND the drop shadow deepens — the disc lifts off the canvas
     rather than just changing colour. The 1.04 scale that goes with it lives in the motion block. */
  .mapnode:hover { box-shadow:0 0 0 4px color-mix(in srgb, var(--accent) 30%, transparent), 0 8px 22px color-mix(in srgb, var(--bg-deep) 80%, transparent); }
  .mapnode.tpl { border-color:var(--tpl); }
  .mapnode.dorm { border-color:var(--dim); }
  .mapnode .st { position:absolute; top:-2px; right:-2px; width:10px; height:10px; border-radius:50%; background:var(--ok); border:2px solid var(--canvas); }
  /* (v2.5.1 F3) node pills are SINGLE-LINE. The `from N` sub-line duplicated the size encoding the legend
     already states (`size = how linked-to`) as text, ×29 pills — the map's own busiest ingredient restating
     what the discs were already saying. The exact numbers keep three homes: the hover peek, the rail
     panel's links section, and the disc's own title. Being single-line, the pill takes the reference's
     full capsule (v2.5 Deviation 1's own rule: rounded-rect for multi-line, capsule for one line). */
  .mapnlbl { position:absolute; transform:translate(-50%,0); text-align:center; font-size:10px; color:var(--txt); z-index:3; pointer-events:none;
             border-radius:999px; padding:3px 9px; white-space:nowrap; }
  .mapghost { position:absolute; transform:translate(-50%,-50%); z-index:5; text-align:center; cursor:pointer; background:none; border:0; padding:0; }
  /* ghosts read against the LOCAL canvas value (they orbit between the play field and the vignette), so
     the dashed stroke is mixed into --canvas rather than faded to transparent — a transparent dash
     disappears the moment the ground lightens. */
  .mapghost .gc { display:block; margin:0 auto; border:2px dashed color-mix(in srgb, var(--dim) 80%, var(--canvas)); border-radius:50%; background:color-mix(in srgb, var(--canvas) 55%, transparent); }
  .mapghost b { font-size:9.5px; color:var(--dim); display:block; margin-top:3px; font-weight:600; }
  .mapghost small { font-size:8px; color:var(--dim); display:block; }
  .mapdistrict { position:absolute; transform:translate(-50%,-50%); z-index:6; background:var(--panel-2); border:1px solid var(--line);
                 border-radius:10px; padding:8px 12px; min-width:150px; pointer-events:none; box-shadow:0 6px 20px color-mix(in srgb, var(--bg-deep) 55%, transparent); }
  .mapdistrict h4 { font-size:10px; text-transform:uppercase; letter-spacing:.6px; color:var(--dim); margin-bottom:2px; }
  .mapdistrict p { font-size:9.5px; color:var(--dim); }
  /* (v2.5.1 F4) the bar Prateek saw as "empty" was empty — and not for the reason anyone assumed.
     ROOT CAUSE: v2.6 introduced a GENERIC `.bar` utility for the Proportions readout (`display:flex;
     align-items:center; padding:4px 0`, further down this sheet). `.mapdistrict .bar` outranks it only on
     the properties it actually declares, so `display:flex` and `padding:4px 0` leaked in — and with the
     global `box-sizing:border-box`, 8px of vertical padding on a 4px-high box leaves a content box of
     ZERO height. The fill is `height:100%` of that: 0px. Nothing has painted since v2.6, at any share.
     So the district bar gets a name a utility class cannot reach, and declares its own box outright.
     On top of that it now renders so 3% can be SEEN: track = --line (Δ≈10 against the card, so the trough
     itself reads, where --bg read Δ≈5), fill = --accent, and a 2px minimum sliver whenever anything is
     explored at all. 5px tall, which keeps the weight the old 4px+2×1px-border box had.
     The card's text line above it remains the exact record; the bar is its shape, not its substitute. */
  .mapdistrict .dbar { display:block; height:5px; padding:0; background:var(--line); border-radius:3px; margin-top:6px; overflow:hidden; }
  .mapdistrict .dbar i { display:block; height:100%; background:var(--accent-strong); border-radius:3px; }
  /* #mapnote is the one bare line on the canvas (the reference keeps it bare too) — its halo goes with
     the rest of the hack; --dim on --canvas clears 4.5:1 unaided. */
  #mapnote { position:absolute; top:14px; left:16px; font-size:10.5px; color:var(--dim); font-style:italic; z-index:7; max-width:44%; }
  /* the floating chrome on the canvas: OPAQUE --panel-2 + --line, the same surface as the district card
     — a 94%-of--panel wash let the lit canvas bleed through and muddied them (v2.5 §2.6). */
  #mapstats { position:absolute; left:16px; bottom:14px; background:var(--panel-2); border:1px solid var(--line); border-radius:10px;
              padding:9px 14px; font-size:11px; color:var(--dim); z-index:7; max-width:62%; }
  #mapstats b { color:var(--txt); }
  #maplegend { position:absolute; top:14px; right:16px; background:var(--panel-2); border:1px solid var(--line); border-radius:10px;
               padding:10px 12px; font-size:10.5px; color:var(--dim); display:flex; flex-direction:column; gap:6px; z-index:7; }
  .lg { display:flex; gap:7px; align-items:center; }
  .lg i { flex:none; display:inline-block; }

  /* ── page-detail content (renders inside the unified rail, F4 — the floating map panel is retired) ── */
  .railpanel { position:relative; }
  .railpanel .rclose { position:absolute; top:-4px; right:-2px; background:none; border:0; color:var(--dim); font-size:18px; }
  .railpanel img { width:100%; border-radius:8px; border:1px solid var(--line); margin:10px 0; }
  .railpanel h2 { font-size:16px; margin:2px 24px 2px 0; }
  .railpanel .route { font-family:var(--mono); font-size:12px; color:var(--dim); word-break:break-all; }
  .railpanel .desc { font-size:13px; margin:10px 0; }
  .railpanel .meta { font-size:12px; color:var(--dim); }
  .railpanel h3, .scrollpane h3 { font-size:11.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--dim); margin:18px 0 8px; font-weight:650; }
  .state { display:flex; justify-content:space-between; align-items:center; font-size:13px; padding:5px 8px;
           background:var(--panel-2); border:1px solid var(--line); border-radius:6px; margin-bottom:5px; }
  .state .tag { font-size:11px; color:var(--ok); font-family:var(--mono); }
  .state .tag.pending { color:var(--warn); }
  .state .stateacts { display:flex; align-items:center; gap:8px; }
  .state .stateacts .figbtn.mini { margin:0; }
  .urlrow { display:flex; gap:8px; align-items:flex-start; font-size:12px; padding:4px 0; border-bottom:1px solid var(--line); cursor:pointer; }
  .urlrow input { margin-top:3px; }
  .urlrow .u { word-break:break-all; font-family:var(--mono); font-size:11.5px; }
  .urlrow .u small { color:var(--dim); display:block; font-family:var(--sans); }
  .btn { font-size:12px; font-weight:600; background:var(--panel-2); color:var(--txt); border:1px solid var(--line);
         border-radius:6px; padding:5px 10px; transition:border-color .2s; }
  .btn:hover { border-color:color-mix(in srgb, var(--accent) 45%, var(--line)); }
  .btn.primary { background:var(--accent); color:var(--accent-text); border:0; }
  .btn.primary:hover { filter:brightness(1.12); }
  /* representative-first offer (bug 8): one big primary CTA, a demoted --dim secondary below it */
  .repcta .btn.primary { width:100%; padding:10px; font-size:14px; }
  .dlall-wrap { margin-top:12px; }
  .btn.dlall { font-size:11px; font-weight:600; padding:5px 9px; color:var(--dim); background:transparent; border:1px solid var(--line); }
  .btn.dlall:hover { border-color:color-mix(in srgb, var(--dim) 60%, var(--line)); color:var(--txt); }
  .dlall-wrap .warn { font-size:11.5px; color:var(--dim); margin-top:5px; line-height:1.4; max-width:340px; }
  #stateform input { width:100%; margin-bottom:6px; background:var(--panel-2); border:1px solid var(--line); color:var(--txt);
                     border-radius:6px; padding:6px 8px; font-size:13px; }
  #toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--panel-2); color:var(--txt); border:1px solid var(--line);
           border-radius:8px; padding:9px 16px; font-size:13px; display:none; z-index:30; max-width:80vw; box-shadow:var(--elev); }

  /* ── overview + tokens ── */
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
  .kpi { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  .kpi .n { font-family:var(--mono); font-size:26px; font-weight:650; line-height:1.15; }
  .kpi .l { font-size:11.5px; color:var(--dim); margin-top:2px; }
  .kpi.blue .n { color:var(--link); } .kpi.amber .n { color:var(--warn); }
  .kpi.purple .n { color:var(--tpl); } .kpi.green .n { color:var(--ok); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
  table.digest { width:100%; border-collapse:collapse; font-size:13px; }
  table.digest td { padding:7px 8px; border-top:1px solid var(--line); vertical-align:top; }
  table.digest tr:hover td { background:color-mix(in srgb, var(--accent) 6%, transparent); }
  td.r { font-family:var(--mono); font-size:11.5px; color:var(--dim); white-space:nowrap; }
  .ai { font-size:9.5px; font-family:var(--mono); color:var(--dim); border:1px dashed var(--line); border-radius:4px; padding:0 4px; vertical-align:1px; }
  .tplcards { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:12px; }
  .tplcard { background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; transition:border-color .2s; }
  .tplcard:hover { border-color:color-mix(in srgb, var(--accent) 45%, var(--line)); }
  .tplcard img { width:100%; height:110px; object-fit:cover; object-position:top; display:block; border-bottom:1px solid var(--line); }
  .tplcard .b { padding:9px 11px; }
  .tplcard .p { font-family:var(--mono); font-size:11px; color:var(--dim); word-break:break-all; }
  .tplcard .sf { font-size:11.5px; color:var(--tpl); font-family:var(--mono); margin-top:3px; }
  .hrow { display:flex; gap:8px; align-items:baseline; font-size:13px; padding:5px 0; border-top:1px solid var(--line); }
  .chip { font-size:10.5px; font-family:var(--mono); border-radius:20px; padding:1px 8px; white-space:nowrap; }
  .chip.warn { background:color-mix(in srgb, var(--warn) 14%, transparent); color:var(--warn); }
  .chip.bad { background:color-mix(in srgb, var(--bad) 14%, transparent); color:var(--bad); }
  .chip.ok { background:color-mix(in srgb, var(--ok) 14%, transparent); color:var(--ok); }
  .provenance { border:1px dashed var(--line); border-radius:8px; padding:8px 12px; font-size:12px; color:var(--dim); margin:6px 0 14px; }
  .provenance code { font-family:var(--mono); color:var(--warn); }
  .swatches { display:grid; grid-template-columns:repeat(auto-fill,minmax(118px,1fr)); gap:8px; }
  /* F6: color cards are live — hover lifts to --panel-2 + accent whisper, click copies the hex,
     Enter/Space copies from the keyboard. The .c block renders an OBSERVED product color (data, never themed). */
  .sw { background:var(--card); border:1px solid var(--line); border-radius:8px; overflow:hidden; position:relative; cursor:pointer;
        transition:transform .14s ease-out, background .14s ease-out, border-color .14s ease-out; }
  .sw:hover, .sw:focus-visible { transform:translateY(-3px); background:var(--panel-2); border-color:color-mix(in srgb, var(--accent) 45%, var(--line)); }
  .sw:focus-visible { outline:2px solid var(--accent-strong); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce){ .sw:hover, .sw:focus-visible { transform:none; } }
  .sw .swcpy { position:absolute; top:4px; right:6px; font-size:11px; color:var(--txt); background:color-mix(in srgb, var(--bg) 70%, transparent);
               border-radius:4px; padding:0 4px; opacity:0; transition:opacity .14s ease-out; pointer-events:none; }
  .sw:hover .swcpy, .sw:focus-visible .swcpy { opacity:1; }
  .sw .c { height:44px; }
  .sw .i { padding:6px 8px; font-family:var(--mono); font-size:10.5px; color:var(--dim); }
  .sw .i b { color:var(--txt); display:block; font-weight:550; }

  /* (v2.6 F3) COLOR — Palette ⇄ Proportions. One dataset (tokens.colors.top), two readings: the
     palette grid answers "which values", the treemap answers "how much". The switcher wears the
     existing .filt pill so it reads as a filter, not a new control species. State is per-session
     (a JS variable) — no persistence machinery for a two-way view toggle. */
  .cviews { margin-bottom:10px; }
  .tmapwrap { position:relative; }
  .tmap { position:relative; width:100%; height:clamp(280px,36vh,420px); border:1px solid var(--line);
          border-radius:10px; overflow:hidden; background:var(--card); }
  /* Tiles butt against each other — the area IS the datum, so no gap may eat it. The rest seam and the
     hover outline are both `inset` box-shadows, which paint inside the box without changing its
     geometry, so a measured tile area stays exactly proportional to its count. The .c fill renders an
     OBSERVED product color (data, never themed) — same rule as the .sw swatch block. */
  .tmt { position:absolute; cursor:pointer; overflow:hidden; border:0; padding:0; display:block;
         box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--bg) 45%, transparent); }
  .tmt:hover, .tmt:focus-visible { box-shadow:inset 0 0 0 1px var(--accent-strong); }
  .tmt:focus-visible { outline:2px solid var(--accent-strong); outline-offset:-3px; }
  /* `display:block` is not decoration — a tile is a <button>, and Chromium lays a button's children
     out through an anonymous flex box, which swallows the <br> and puts the share back on the hex's
     line. Declaring the display takes the box out of that machinery. */
  .tmt .l { display:block; position:absolute; left:6px; top:4px; right:4px; font-family:var(--mono);
            font-size:10.5px; line-height:1.35; text-align:left; pointer-events:none; white-space:nowrap; }
  .tmt .l i { font-style:normal; opacity:.82; }
  /* fallback for the ~4% of observed swatches where NEITHER --txt nor --bg reaches 4.5:1 (the mid-grey
     band): the label takes the product's own established pill treatment (v2.5 map labels) so contrast
     is guaranteed by construction rather than by luck of the swatch. */
  /* the pill must hug its text, so it releases `right` — an abspos box with BOTH left and right set
     fills the gap between them (that is the spec, not shrink-to-fit), which on a wide tile drew a
     bar instead of a chip. With right:auto it shrink-to-fits its longest line, capped to the tile. */
  .tmt .l.pill { background:color-mix(in srgb, var(--bg) 90%, transparent); border-radius:5px;
                 padding:1px 5px; left:4px; right:auto; max-width:calc(100% - 8px); }
  .tmfoot { font-size:11.5px; color:var(--dim); font-family:var(--mono); margin-top:8px; }

  /* type/spacing/radius/shadow cards share the hover elevation (no copy action — nothing obvious to copy) */
  #pane-design .card { transition:transform .14s ease-out, background .14s ease-out; }
  #pane-design .card:hover { transform:translateY(-3px); background:var(--panel-2); }
  @media (prefers-reduced-motion: reduce){ #pane-design .card:hover { transform:none; } }
  .typerow { display:flex; align-items:baseline; gap:14px; padding:8px 0; border-top:1px solid var(--line); overflow:hidden; }
  .typerow .sample { white-space:nowrap; }
  .typerow .m { font-family:var(--mono); font-size:11px; color:var(--dim); white-space:nowrap; }
  .bar { display:flex; align-items:center; gap:10px; padding:4px 0; }
  .bar .rect { height:14px; background:var(--accent); border-radius:3px; opacity:.85; }
  .bar .m { font-family:var(--mono); font-size:11px; color:var(--dim); white-space:nowrap; }

  /* (v2.6 F2) THE BENTO. Type ramp left (allowed to be tall); right column stacks spacing → radius →
     shadows → components. Both columns stretch to the taller one, and each column's last tenant takes
     the slack (`margin-top:auto` on the ramp's footnote, `flex:1` on the dormant Components slot), so
     neither a long ramp nor a sparse product leaves a void. Min-heights keep the right column's shape
     when a product has almost no radii or shadows (wikipedia, kit-dashboard). */
  .bento { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:12px; align-items:stretch; }
  .bento > * { min-width:0; }
  /* Slack goes to an absorber on BOTH sides, so neither column can end in a hole: the right column's
     is the dormant Components slot (flex:1), the left's is the ramp itself — its rows share the extra
     space and simply breathe, up to a cap that stops a one-row ramp from becoming one giant row.
     A ramp that cannot absorb the slack within that cap keeps .natural (balanceBento() decides, by
     measurement) and takes its content height — an empty page gutter beside a short column beats a
     bordered hole inside it. */
  .bento > .card:first-child .typerow { flex:1 1 auto; max-height:54px; }
  .bento > .card.natural { align-self:start; }
  .bento > .card.natural .typerow { flex:none; }
  .bcol { display:flex; flex-direction:column; gap:12px; min-width:0; }
  .bcol > .card, .bcol > .compslot { flex:none; }
  .bcol > .compslot { flex:1 1 auto; }
  .bento .card { display:flex; flex-direction:column; }
  .bento .card .foot { margin-top:auto; padding-top:8px; font-family:var(--mono); font-size:10.5px; color:var(--dim); }
  .bento .card.c-space, .bento .card.c-rad, .bento .card.c-sh { min-height:112px; }
  .bnone { font-size:12px; color:var(--dim); }
  @media (max-width:900px){ .bento { grid-template-columns:minmax(0,1fr); } }

  /* (v2.6 F1) RADIUS — one tile size for every value, so the grid keeps one row height. The observed
     value is applied VERBATIM (no clamp): an asymmetric `2px 0px 0px 2px` lands per-corner on the same
     square, which is exactly what makes it scannable next to a symmetric neighbour. */
  .radgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(84px,1fr)); gap:8px; }
  .rad { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:9px 6px 7px;
         text-align:center; min-width:0; }
  .rad .sq { width:64px; height:64px; margin:0 auto 7px; background:var(--card);
             border:2px solid var(--accent-strong); }
  .rad .m { display:block; font-family:var(--mono); font-size:10px; color:var(--dim);
            white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rad .m b { display:block; color:var(--txt); font-weight:550; overflow:hidden; text-overflow:ellipsis; }

  .shgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(128px,1fr)); gap:12px; }
  /* allowlisted literal: the tile renders an OBSERVED shadow (data) — a shadow is invisible on a dark
     surface, so the preview keeps a light one. The shadow value itself is the artifact, like a swatch. */
  .sh { background:#FFFFFF; border:1px solid var(--line); border-radius:10px; height:52px; }
  .sh + .m { font-family:var(--mono); font-size:9.5px; color:var(--dim); word-break:break-all; margin-top:5px; }

  /* (v2.6 F2.3) the dormant Components slot — the journal's "someday" teaser, moved into the bento.
     Dashed + --dim says "not a thing yet"; it fills the bento today and is where pattern mining lands. */
  .compslot { border:1px dashed var(--line); border-radius:10px; padding:14px 16px; min-height:96px;
              background:color-mix(in srgb, var(--panel) 50%, var(--bg));
              display:flex; flex-direction:column; justify-content:center; gap:4px; }
  .compslot .cmeta { font-size:10.5px; font-family:var(--mono); color:var(--dim); text-transform:uppercase; letter-spacing:.5px; }
  .compslot .ctitle { font-size:14px; font-weight:600; color:var(--dim); }
  .compslot .cdetail { font-size:12px; color:var(--dim); }
  .secgap { margin-top:26px; }

  /* ── onboarding (wizard · login wait · live progress · completion) ── */
  .ob { max-width:560px; margin:6vh auto 40px; }
  .ob h2 { font-size:22px; font-weight:680; margin-bottom:6px; }
  .ob .sub { color:var(--dim); font-size:14px; margin-bottom:20px; }
  .fld { display:block; margin-top:18px; }
  .fld > span { display:block; font-size:13px; font-weight:600; margin-bottom:6px; }
  .ob input[type=text], .ob select { width:100%; background:var(--panel-2); border:1px solid var(--line); border-radius:8px;
                                      padding:10px 12px; font:inherit; color:var(--txt); }
  .ob input:focus, .ob select:focus { border-color:var(--accent-strong); outline:none; }
  .hint { font-size:12px; color:var(--dim); margin-top:6px; }
  .ob code { font-family:var(--mono); font-size:11.5px; background:var(--panel-2); border-radius:4px; padding:0 4px; }
  .seg { display:flex; gap:8px; }
  .segbtn { flex:1; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px; font-weight:550; color:var(--txt); }
  .segbtn.on { border-color:var(--accent-strong); background:color-mix(in srgb, var(--accent) 12%, var(--panel)); color:var(--link); }
  .expect { margin-top:12px; font-size:13px; color:var(--dim); background:var(--panel); border:1px solid var(--line);
            border-left:3px solid var(--accent); border-radius:8px; padding:10px 12px; }
  .err { color:var(--bad); font-size:13px; margin-top:12px; min-height:1px; }
  .btn.big { display:block; width:100%; padding:12px; font-size:15px; margin-top:22px; }
  .phase { max-width:520px; margin:13vh auto; text-align:center; }
  .phase h2 { font-size:20px; margin-bottom:8px; }
  .phase p { color:var(--dim); }
  .spin { width:26px; height:26px; border:3px solid var(--line); border-top-color:var(--accent-strong); border-radius:50%;
          margin:22px auto; animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce){ .spin { animation:none; } }
  .prog { max-width:760px; margin:5vh auto 40px; }
  .prog h2 { font-size:21px; font-weight:680; }
  .prog .counters { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; margin:16px 0; }
  .oblog { background:var(--bg-deep); color:var(--txt); border:1px solid var(--line); font-family:var(--mono); font-size:12px; line-height:1.5; border-radius:10px;
           padding:12px 14px; height:44vh; overflow-y:auto; white-space:pre-wrap; word-break:break-word; }
  .ok-note { background:color-mix(in srgb, var(--ok) 8%, var(--bg)); border:1px solid color-mix(in srgb, var(--ok) 30%, var(--bg)); border-radius:10px; padding:14px 16px; margin-top:16px; font-size:14px; }

  /* ── prompt chips ("prompts are the UI") + Use-it tab ── */
  .pchip { display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; background:var(--accent);
           color:var(--accent-text); border:0; border-radius:8px; padding:7px 12px; margin:0 8px 8px 0; transition:filter .2s; text-align:left; }
  .pchip:hover { filter:brightness(1.12); }
  .pchip svg { width:13px; height:13px; flex:none; }
  .pchip.ghost { background:var(--panel-2); color:var(--txt); border:1px solid var(--line); }
  .pchip.ghost:hover { background:var(--panel-2); border-color:color-mix(in srgb, var(--accent) 45%, var(--line)); }
  /* ⧉ Copy for Figma — a real action button (not a copy-prompt chip); secondary to the primary
     Wireframe chip it sits beside. Its label swaps to Converting…/Ready during the copy pipeline (F2). */
  .figbtn { display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; background:var(--panel-2);
            color:var(--txt); border:1px solid var(--line); border-radius:8px; padding:7px 12px; margin:0 8px 8px 0;
            cursor:pointer; transition:background .2s,border-color .2s; text-align:left; }
  .figbtn:hover { border-color:color-mix(in srgb, var(--accent) 45%, var(--line)); }
  .figbtn:disabled { opacity:.7; cursor:progress; }
  .figbtn.armed { background:color-mix(in srgb, var(--accent) 15%, var(--panel)); border-color:var(--accent-strong); color:var(--link); }
  /* compact per-state variant — lives under a states-strip tile / inside a panel state row */
  .figbtn.mini { font-size:10.5px; font-weight:600; padding:3px 8px; margin:4px 0 0; gap:4px; }
  .chiprow { display:flex; flex-wrap:wrap; align-items:center; }
  .useit { max-width:820px; margin:0 auto; }
  .useit h2 { font-size:20px; font-weight:680; margin-bottom:4px; }
  .useit .lead { color:var(--dim); margin-bottom:18px; }
  .mode { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin-bottom:14px; }
  .mode .badge { display:inline-block; font-size:10.5px; font-family:var(--mono); color:var(--link); background:color-mix(in srgb, var(--accent) 12%, transparent); border-radius:20px; padding:2px 9px; margin-bottom:8px; }
  .mode h3 { font-size:15px; margin:0 0 4px; text-transform:none; letter-spacing:0; color:var(--txt); font-weight:650; }
  .mode p { font-size:13px; color:var(--dim); margin-bottom:10px; }
  .mono-cmd { font-family:var(--mono); font-size:12px; background:var(--bg-deep); color:var(--txt); border:1px solid var(--line); border-radius:8px; padding:10px 12px;
              margin:4px 0; overflow-x:auto; white-space:pre; line-height:1.7; }
  .sensitivity { border:1px solid color-mix(in srgb, var(--warn) 35%, var(--bg)); background:color-mix(in srgb, var(--warn) 9%, var(--bg)); border-radius:10px; padding:12px 14px; font-size:13px; color:var(--warn); margin-bottom:16px; }
  .sensitivity code { font-family:var(--mono); background:color-mix(in srgb, var(--warn) 15%, transparent); border-radius:4px; padding:0 4px; }
  .bundle-row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .bundle-row select { background:var(--panel-2); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font:inherit; color:var(--txt); max-width:100%; }
  .mode code { font-family:var(--mono); font-size:12px; background:var(--panel-2); border-radius:4px; padding:0 4px; }

  /* ── dashboard v2 ── */
  .hatch { background:repeating-linear-gradient(45deg,var(--panel),var(--panel) 6px,var(--bg) 6px,var(--bg) 12px); }

  /* readiness chip + breakdown popover (ring stroke = --accent, on the --bg shell).
     v2.4.2 F3: the SHELL is the mock's — unfilled 28px capsule, --line-2 hairline, 10/11px padding, the
     mark sitting where the mock's dot sits. Prateek's explicit exception: the RING stays (the mock shows
     a plain dot; the ring encodes measured progress), sized down to the mock's 13px dot footprint + 3px
     so the arc still reads. Its punch-out follows the pill's new fill — --bg, not --panel. */
  .rchip { display:inline-flex; align-items:center; gap:8px; font-size:12px; color:var(--txt); background:transparent;
           border:1px solid var(--line-2); border-radius:999px; height:28px; padding:0 11px 0 10px; white-space:nowrap; }
  .rchip:hover { border-color:color-mix(in srgb, var(--accent) 45%, var(--line-2)); }
  .rring { width:16px; height:16px; border-radius:50%; flex:none; position:relative;
           background:conic-gradient(var(--accent) calc(var(--pct,0)*1%), var(--line-2) 0); }
  .rring::after { content:""; position:absolute; inset:3px; background:var(--bg); border-radius:50%; }
  .rchip.quiet .rring { background:conic-gradient(var(--ok) calc(var(--pct,0)*1%), var(--line-2) 0); }
  #readypop { position:absolute; top:48px; right:14px; width:308px; background:var(--panel-2); border:1px solid var(--line);
              border-radius:12px; box-shadow:var(--elev); padding:14px 16px; z-index:40; display:none; }
  #readypop.open { display:block; }
  #readypop h4 { font-size:13px; margin-bottom:2px; }
  #readypop .rnext { font-size:12px; font-weight:600; color:var(--link); background:color-mix(in srgb, var(--accent) 12%, transparent); border-radius:6px; padding:5px 8px; margin:6px 0 8px; }
  #readypop .pnote { font-size:11px; color:var(--dim); margin-bottom:10px; }
  .rcomp { margin:9px 0; }
  .rcomp .rlab { display:flex; justify-content:space-between; font-size:12px; margin-bottom:3px; }
  .rcomp .rlab b { font-family:var(--mono); color:var(--dim); font-weight:500; }
  .rcomp .rbar { height:6px; background:var(--bg); border:1px solid var(--line); border-radius:4px; overflow:hidden; }
  .rcomp .rbar i { display:block; height:100%; background:var(--accent-strong); }
  .rcomp .rdet { font-size:10.5px; color:var(--dim); margin-top:3px; }
  /* readiness action row (F3) */
  #readypop .ract { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:2px 0 10px; }
  #readypop .ract .gobtn { font-size:12px; font-weight:600; background:var(--accent); color:var(--accent-text); border:0; border-radius:8px; padding:7px 12px; cursor:pointer; }
  #readypop .ract .gobtn:hover { filter:brightness(1.12); }
  /* generic primary/ghost action buttons reused in the ledger (End session) */
  .gobtn { font-size:12px; font-weight:600; background:var(--accent); color:var(--accent-text); border:0; border-radius:8px; padding:7px 12px; cursor:pointer; }
  .gobtn:hover { filter:brightness(1.12); }
  .gobtn.ghost { background:transparent; color:var(--txt); border:1px solid var(--line); }
  .gobtn.ghost:hover { border-color:color-mix(in srgb, var(--accent) 45%, var(--line)); background:var(--panel-2); filter:none; }
  .gobtn:disabled { opacity:.5; cursor:not-allowed; }
  .gobtn:disabled:hover { background:transparent; border-color:var(--line); }
  /* FB4: the in-progress ledger entry reads as ALIVE — a throbbing dot + a soft breathing ring */
  .ent.live { position:relative; animation:liveframe 2.4s ease-in-out infinite; }
  .livedot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--accent-strong); margin-right:7px; vertical-align:middle; animation:livepulse 1.5s ease-in-out infinite; }
  .livedot.hot { background:var(--warn); animation-duration:.9s; }
  @keyframes livepulse { 0%,100%{ box-shadow:0 0 0 0 color-mix(in srgb, var(--accent-strong) 45%, transparent); opacity:1; } 50%{ box-shadow:0 0 0 6px transparent; opacity:.5; } }
  @keyframes liveframe { 0%,100%{ box-shadow:0 0 0 1px color-mix(in srgb, var(--accent-strong) 25%, transparent); } 50%{ box-shadow:0 0 0 1px color-mix(in srgb, var(--accent-strong) 55%, transparent); } }
  @media (prefers-reduced-motion: reduce){ .ent.live{ animation:none; } .livedot,.livedot.hot{ animation:none; } }
  /* F1 capture menu — anchored under "+ Capture again"; fixed so it never grows the header */
  #recapmenu { position:fixed; z-index:60; min-width:288px; max-width:min(92vw,340px); background:var(--panel-2);
               border:1px solid var(--line); border-radius:12px; box-shadow:var(--elev); padding:6px; display:none; }
  #recapmenu.open { display:block; }
  #recapmenu button.mi { display:block; width:100%; text-align:left; background:none; border:0; border-radius:8px; padding:9px 11px; cursor:pointer; font:inherit; color:var(--txt); }
  #recapmenu button.mi:hover, #recapmenu button.mi:focus-visible { background:color-mix(in srgb, var(--txt) 7%, transparent); }
  #recapmenu .mi b { display:block; font-size:13px; font-weight:650; }
  #recapmenu .mi .ex { display:block; font-size:11.5px; color:var(--dim); margin-top:3px; line-height:1.4; font-weight:400; }
  #recapmenu .midiv { height:1px; background:var(--line); margin:4px 2px; }
  /* ledger per-item detail lines (guided/hygiene events, F4) */
  .ent .edlines { margin:6px 0 0; padding:0; list-style:none; }
  .ent .edlines li { font-size:11.5px; color:var(--dim); line-height:1.5; padding-left:12px; position:relative; }
  .ent .edlines li::before { content:"·"; position:absolute; left:2px; color:var(--line); font-weight:700; }
  /* the Journal pill's active state — the dot is white at rest now (mock), so the state is carried by the
     surface + accent edge instead of by the dot. */
  .jpill.on { background:var(--panel-2); border-color:color-mix(in srgb, var(--accent) 45%, var(--line-2)); }

  /* ── home, matched to the v2.4.1 mock (prds/dashboard-v2.4-mock/) ──
     The page is a HEADER BAND above a BODY, split by a full-width --line rule, with the working ledger
     as its own full-height column on the right. The band carries the square logo tile, the full-measure
     meta description, and the stats row LEFT-aligned BELOW the description (small lowercase label on
     top, large mono value under it) — the metrics no longer sit right-aligned in the top-right corner
     where they collided with the rail heading. Band and body share one horizontal padding (--pad) so
     the tile, the filter chips and the first card all hang off the same left edge. */
  #pane-home.scrollpane { padding:0; overflow:hidden; }
  .homecols { display:flex; align-items:stretch; height:100%; }
  .gridwrap { flex:1; min-width:0; overflow-y:auto; }
  .hband { padding:30px var(--pad) 30px; border-bottom:1px solid var(--line); }
  .hbody { padding:24px var(--pad) 60px; }
  .rail, #maprail { background:var(--rail);
    /* Inside the rail the surface ramp steps DOWN one notch (mock-ledger.png: the rail is the panel and
       the cards are recessed into it, the inverse of the body). Remapping the three surface tokens in

    --panel-2:var(--panel); --panel:var(--bg); --card:var(--bg); }

  /* atlas: a uniform 16:9 thumbnail window that the screenshot fills edge-to-edge (no letterbox, no
     inner padding), then a two-part caption — one ellipsized title line + a 2-line description. The
     mono route line is gone from the card face; the route lives in the rail panel and page doc.
     (v2.4.2 F1) The column COUNT is no longer fixed at 4 — a fixed 4-col grid ballooned each card to
     ~515px on a 2560 monitor. auto-fill + a 236px floor keeps the card in the mock's size family and
     lets the count follow the viewport. Derivation: the grid's usable width is
     `vw − 340 (rail) − 2 × --pad`, so with the 18px gutters kept, cols = ⌊(W+18)/(236+18)⌋ →
     1280:3 (272px) · 1440:4 (240px) · 1600:4 (280px — the mock's own card width) · 1920:5 (284px) ·
     2560:8 (249px). 236 rather than the brief's 250–270: at 1440 a 4-col row can only be 240px wide
     (the mock's 270px is a 1600px-viewport measurement), and a floor above 239 drops 1440 to 3 columns
     — the brief's own column targets win over its estimated floor. The old 1180/820 breakpoint
     overrides are gone: auto-fill subsumes them. */
  .atlas { display:grid; grid-template-columns:repeat(auto-fill,minmax(236px,1fr)); gap:18px; }
  /* padding:0 is load-bearing (v2.4.2 F2): .pg is a <button>, and the UA's default button padding

  /* ── v2.1: F2 map — zoom controls, regions, arc ── */
  #mapworld { transform-origin:0 0; }
  /* ── whisper regions on a LIT ground (v2.5 §2.5) ──
     v2.4 killed the stacked-alpha lavender blobs by pre-mixing region fills opaquely against a FLAT
     --bg. The canvas is no longer flat, so a pre-mixed opaque fill would paint a dark patch across the
     lit centre. The mechanism that keeps both properties: ONE opacity group. #mapregions carries the
     opacity; every child is a FULLY OPAQUE var(--accent) shape inside it. Two opaque same-colour shapes
     that overlap render as that colour — so the group composites exactly once, at exactly one alpha,
     over whatever the local canvas value is. Stacking stays geometrically impossible AND the whisper
     tracks the lighting. Rest lands at ≈4.5% accent over the local ground; the border goes (the
     reference has none at rest — "barely-there" means barely-there).
     The hover wash cannot live inside the group (the group's alpha is uniform by construction), so it
     is one separate shape, #maphot, drawn just above it: a single element, so it cannot stack either. */
  /* (v2.5.1 F2) THE EDGES SOFTEN AT REST. A rounded bbox with a 1px alpha cliff reads as a shape; a
     district is not a shape, it is a neighbourhood. `filter` on the GROUP is what makes this free of the
     stacking hazard: per the compositing model the filter applies to the group's flattened buffer and only
     THEN is the group alpha applied — the children composite among themselves first, and two fully OPAQUE
     same-colour shapes flatten to that colour with alpha 1, so blurring the buffer blurs a max-1 alpha
     field. One composite, one alpha, still geometrically impossible to stack (proof re-run, §gates).
     Hit-testing uses the UNFILTERED border box, so hover territories and the district card are untouched;
     #maparea's overflow:hidden is what stops the spread painting outside the pane. */
  #mapregions { position:absolute; left:0; top:0; z-index:0; opacity:.035; pointer-events:none; filter:blur(14px); }
  .mapregion { position:absolute; border-radius:44% 56% 52% 48% / 50%; background:var(--accent); pointer-events:auto; }
  #maphot { position:absolute; z-index:0; border-radius:44% 56% 52% 48% / 50%; pointer-events:none;
            background:color-mix(in srgb, var(--accent) 7%, transparent); border:1px solid color-mix(in srgb, var(--accent) 26%, transparent); }
  #maplabels { position:absolute; inset:0; z-index:5; pointer-events:none; }
  #maplabels .mapnlbl, #maplabels .maprlbl, #maplabels .maphomelbl, #maplabels .mapghostlbl, #maplabels .maparclbl { position:absolute; transform:none; }
  .mapghostlbl { transform:translate(-50%,0); text-align:center; font-size:9px; color:var(--dim); white-space:nowrap;
                 border-radius:999px; padding:2px 8px; }
  .mapghostlbl small { display:block; color:var(--dim); font-size:8px; }
  /* the `deep fog …N more` arc sits where the play field turns into the vignette — the pill surface is
     what makes it read identically on both grounds (v2.5 §2.4; the reference draws it as a capsule). */
  .maparclbl { transform:translate(-50%,-50%); font-size:10px; color:var(--dim); text-transform:uppercase; letter-spacing:.6px;
               padding:2px 10px; border-radius:999px; white-space:nowrap; }
  #mapzoom { position:absolute; right:16px; bottom:14px; z-index:7; display:flex; gap:4px; background:var(--panel-2);
             border:1px solid var(--line); border-radius:8px; padding:3px; }
  #mapzoom button { width:26px; height:26px; border:0; background:none; color:var(--dim); font-size:15px; border-radius:6px; }
  /* the shell is now --panel-2, so hover steps DOWN to --panel (the surface ramp inverts inside a
     panel-coloured container — the same move the rail makes on Home). */
  #mapzoom button:hover { background:var(--panel); color:var(--txt); }
  #mapzoom .zlbl { min-width:34px; text-align:center; font-size:10px; color:var(--dim); align-self:center; font-family:var(--mono); }
  /* (v2.4) F8's panel-offset rule is retired with the floating panel itself — the rail owns the right
     edge and #mapzoom lives inside #maparea, so the zoom controls can never be covered. */
  /* (v2.5 §2.3) a disc with no thumbnail is a plain --panel-2 well inside its ring. The v2.4 accent-tinted
     fill existed to stop small discs vanishing into near-black; on the lit canvas --panel-2 already reads,
     and the tint now competes with the accent RING that carries the meaning. The ring keeps its encoding
     (accent = explored · --dim = dormant caption · --tpl = template) — only the fill changed. */
  .mapnode.mono-disc { background-color:var(--panel-2); }

  /* ══ (v2.5.1 F5) THE MOTION PASS ════════════════════════════════════════════════════════════════
     The whole pass in one place, and one rule explains most of it: every keyframe declares only `from`,
     and every animation uses fill-mode BACKWARDS.
       · only `from` ⇒ the implicit 100% keyframe IS the element's own static value, taken from the normal
         cascade (inline styles included). An animation therefore cannot land anywhere except exactly where
         the static layout already was — "ends in the byte-identical static layout" holds by construction,
         not by me copying values into a `to` block and keeping them in sync forever.
       · backwards  ⇒ the from-state is held during the delay (nothing flashes at full opacity first) and
         the effect is RELEASED the moment it finishes, handing the element back to its static declaration.
         So `document.getAnimations()` is genuinely EMPTY once the map settles — every measured gate in this
         build runs against the same render it would have without the pass.
     Durations 120–450ms, ease-out. NOTHING loops: the capture heartbeat (.ent.live/.livedot) and the
     capture spinner are the only infinite animations in the file and both exist only while a capture runs.
     Reduced motion needs no new rules — the :root block kills every animation and transition outright, so
     no transform motion survives it. */
  @keyframes mzfade  { from { opacity:0; } }
  @keyframes mzpop   { from { opacity:0; transform:translate(-50%,-50%) scale(.92); } }
  @keyframes mzlift  { from { opacity:0; transform:scale(.92); } }
  @keyframes mzrise  { from { opacity:0; transform:translate(-50%,4px); } }
  @keyframes mzriseY { from { opacity:0; transform:translateY(4px); } }
  /* F5·1 — the map materialises ONCE per pane reveal. #maparea.mzin gates every one of these, and it is
     only ever on for the ~450ms of a reveal: after that the very same elements are rebuilt by pan/zoom/
     selection with no animation attached, which is exactly why direct manipulation stays immediate. Home
     and the rings lead (delay 0); discs follow inner-ring→outer via --mzd, written per disc by renderWorld. */
  #maparea.mzin .mapring { animation:mzfade 200ms ease-out backwards; }
  #maparea.mzin .mapnode, #maparea.mzin .mapghost { animation:mzpop 200ms ease-out var(--mzd,0ms) backwards; }
  #maparea.mzin #maplabels .maphomelbl, #maparea.mzin #maplabels .maprlbl { animation:mzlift 200ms ease-out backwards; }
  #maparea.mzin #maplabels .mapnlbl    { animation:mzfade 170ms ease-out 150ms backwards; }
  #maparea.mzin #maplabels .maparclbl  { animation:mzfade 170ms ease-out 190ms backwards; }
  #maparea.mzin #maplabels .mapghostlbl{ animation:mzfade 170ms ease-out 230ms backwards; }
  /* F5·2 — hover. The disc's transform lives in .mapnode (NOT inline, or :hover could never win) so the
     scale composes with the centring translate; the drop shadow deepens with it. */
  .mapnode, .mapghost { transition:transform 140ms ease-out, box-shadow 140ms ease-out; }
  .mapnode:hover, .mapghost:hover { transform:translate(-50%,-50%) scale(1.04); }
  #maphot { animation:mzfade 150ms ease-out backwards; }          /* the region wash fades in */
  .mapdistrict { animation:mzrise 150ms ease-out backwards; }     /* the district card fades + rises 4px */
  /* F5·3 — selection: the disc's ring pulses exactly once, an accent halo collapsing onto its own rim.
     Only a `from`, so the last frame IS the disc's resting shadow — no snap at the end. */
  @keyframes selring { from { box-shadow:0 0 0 12px color-mix(in srgb, var(--accent-strong) 55%, transparent),
                                        0 5px 16px color-mix(in srgb, var(--bg-deep) 62%, transparent); } }
  .mapnode.selpulse { animation:selring 250ms ease-out backwards; }
  #maprail-body.xfade, #homerail.xfade { animation:mzfade 160ms ease-out backwards; }
  /* F5·4 — button zoom eases the world transform; wheel/drag never get the transition (an eased direct
     manipulation reads as lag). Labels are placed by a screen-space collision pass, so they cannot ride a
     group transform — they fade for the 220ms and are re-placed at the far end, which is what keeps every
     pill attached to its disc instead of arriving 60px early. */
  #mapworld.zt { transition:transform 220ms ease-out; }
  #maplabels { transition:opacity 110ms ease-out; }
  #maplabels.zhide { opacity:0; }
  /* F5·5 — the shell. --pct must be a registered custom property or it cannot interpolate: an unregistered
     one is a token stream and the conic-gradient would jump. Registered, the ring SWEEPS 0→value once. */
  @property --pct { syntax:'<number>'; inherits:false; initial-value:0; }
  @keyframes rsweep { from { --pct:0; } }
  .rring.sweep { animation:rsweep 600ms ease-out backwards; }
  .pane.active { animation:mzfade 120ms ease-out backwards; }
  .ent.newest { animation:mzriseY 200ms ease-out backwards; }
  #peek.open { animation:mzfade 120ms ease-out backwards; }
</style>
</head>

<script>
const DASH = /*__DASHDATA__*/null;
const DATA = DASH ? DASH.map : null;
// F2 (v2.4) — the whitelabel accent: the dashboard wears the captured product's own color.
// brand is OBSERVED data (derived deterministically from tokens.json by build-index); when absent,
// the :root fallbacks (indigo) stay — measured-or-absent applies to color.
if (DASH && DASH.brand && DASH.brand.applied){
  const s = document.documentElement.style, a = DASH.brand.applied;
  if (a.accent) s.setProperty('--accent', a.accent);
  if (a.accentStrong) s.setProperty('--accent-strong', a.accentStrong);
  if (a.buttonText) s.setProperty('--accent-text', a.buttonText);
}
const esc = s => (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const short = (s,n=24) => { s = s||''; return s.length>n ? s.slice(0,n-1)+'…' : s; };
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const IS_MAC = /Mac|iPhone|iPad/i.test((navigator.platform||'') + ' ' + (navigator.userAgent||''));
let serverMode=false, STATUS=null;

function api(p,body){ return fetch(p,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)})
  .then(r=>r.json()).catch(e=>({ok:false,error:String(e)})); }
function toast(msg, sticky){ const t=document.getElementById('toast'); t.textContent=msg; t.style.display='block';
  clearTimeout(t._h); if(!sticky) t._h=setTimeout(()=>t.style.display='none', 6000); }

// ═════════════════════════ PROMPTS (the UI) ══════════════════════════════════
// Canonical wordings — the single source of truth is prds/use-it-layer.md Appendix A.
// Change one, review both. Copied text is PLAIN markdown; real workspace paths baked in.
const PROMPTS = {
  describeLibrary: () => "Open this folder's design context. Read `design-context/registry.json`, then for every page whose `page.md` still says '(not yet described)', write the screen doc between its ai:begin/ai:end markers per `skills/capture-product/SKILL.md` §5 — grounded only in that page's `content.md`, `screenshot.png`, and `meta.json`. Never invent features; never edit anything outside the markers. Then run `node tools/build-index.js`.",
  wireframe: (slug) => "Read `design-context/pages/" + slug + "/page.md` and look at its `screenshot.png`. I want to explore: ‹describe your change›. Per `skills/wireframe-on-snapshot/SKILL.md`: work on COPIES in `wireframes/" + slug + "/round-1/` (never edit `design-context/`), keep the product's real shell, make 2–3 genuinely different approaches, new elements visibly lo-fi, then render previews with `node tools/shot.js`.",
  whatsMissing: () => "Read `design-context/registry.json` — especially `frontier` (discovered-but-not-downloaded pages) and each page's `states`. Tell me, as my design partner: which locked pages and which missing states matter most for understanding this product, and why. Don't capture anything yet — recommend.",
  addState: () => "I can reach a page state via URL. Run `node tools/capture.js --state <slug>:<state-name> --url \"<the url>\"` and confirm it landed under `design-context/pages/<slug>/states/`.",
  // A.9 (ux-copy.md — verbatim) — guided capture: human-driven, button-only states/modals
  guided: () => "Run `node tools/capture.js --guided --url ‹where to start›`. A browser window opens on my logged-in profile — I'll drive. Watch the folder: each capture lands under `design-context/pages/…` with `method: guided`. When I close the window, run `node tools/build-index.js` and tell me what the hygiene check found.",
  auditTokens: () => "Read `design-context/tokens.json`. These are OBSERVED values (method: heuristic), not authored tokens. As a design-systems reviewer: where is this product consistent, where is it drifting (near-duplicate colors, off-scale spacing), and what would you consolidate first?",
  recaptureCheck: () => "The product may have changed. Re-run `node tools/capture.js --config design-context/product.json`, then compare `contentHash` changes in `design-context/registry.json` and tell me which pages changed and whether their descriptions need updating.",
  bootstrap: () => "You're in a designer's workspace. Read `AGENTS.md` first and follow its five rules. Then read `design-context/INDEX.md` to learn this product, and ask me what I want to work on.",
  // A.8 (ux-copy.md — revised 2026-07-27: skill pointer + shell instruction, evidence: create-chain run)
  designNew: () => "Read `design-context/registry.json`, `tokens.json`, and the pages most like what I'm making. I want to design something NEW: ‹describe it›. **Per `skills/wireframe-on-snapshot/SKILL.md` §7:** start from the captured page whose shell this new page would share, work on a COPY in `wireframes/new/‹concept›/round-1/` (never in `design-context/`), keep the product's real shell, make 2–3 genuinely different approaches, new elements visibly lo-fi. If the library is too thin to know this product's grammar for some part, tag that region `ASSUMED: …` and explain it in `notes.md` — never invent house style. Render previews with `node tools/shot.js`.",
  askQuestion: () => "Read `design-context/registry.json` and `INDEX.md` to learn this product. I have a question about it: ‹your question›. Answer only from what's in the library — the captured pages, their descriptions, and the observed tokens. If the answer isn't in the library, say so plainly rather than guessing.",
  // A.10 (ux-copy.md — verbatim) — the Figma exit: convert a captured page/state to editable Figma layers
  figma: () => "Open the dashboard, go to the page you want, click ⧉ Copy for Figma, and paste into your Figma file (⌘V). It lands as editable auto-layout layers — arrange or restyle freely; the library stays untouched.",
};
const COPY_SVG = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5.5" y="5.5" width="8.5" height="8.5" rx="1.5"/><path d="M3.4 10.5H3A1.5 1.5 0 0 1 1.5 9V3A1.5 1.5 0 0 1 3 1.5h6A1.5 1.5 0 0 1 10.5 3v.4"/></svg>';
function pchip(label, text, ghost){ return `<button type="button" class="pchip${ghost?' ghost':''}" data-prompt="${esc(text)}">${COPY_SVG}${esc(label)}</button>`; }
function copyPrompt(text){ if(!text) return;
  (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject())
    .then(()=>toast('Copied — paste it into your AI chat.'))
    .catch(()=>{ toast('Your browser blocked the copy — the prompt is shown below to copy by hand.'); try{ prompt('Copy this prompt:', text); }catch(_){} }); }
// one delegated handler for every chip, anywhere (works during onboarding completion too)
document.addEventListener('click', e=>{ const b = e.target.closest && e.target.closest('[data-prompt]'); if (b) copyPrompt(b.getAttribute('data-prompt')); });
// delegated in-dashboard navigation: any [data-goto] sets the hash → route() (below) reacts
document.addEventListener('click', e=>{ const g = e.target.closest && e.target.closest('[data-goto]'); if (g && !g.hasAttribute('data-prompt')){ e.preventDefault(); if (window.closePanel) window.closePanel(); location.hash = g.getAttribute('data-goto'); } });

// ═════════════════════════ ONBOARDING ════════════════════════════════════════
// wizard → (login-page capture → login window) → live capture → completion.
// State lives on the server (product.json + the capture job); this view drives it.
const OB = { url:'', loggedIn:true, productType:'saas' };
const TYPES = [
  { k:'saas',      label:'SaaS / web app',          copy:'App screens + one example of each repeating page. Some flows (wizards, modals) need a later guided pass.' },
  { k:'ecommerce', label:'E-commerce / marketplace', copy:'Thousands of product pages share one layout — we capture one of each kind and count the rest.' },
  { k:'content',   label:'Content / media',          copy:'Article/video pages collapse to templates; live widgets freeze as captured.' },
  { k:'docs',      label:'Docs / knowledge base',    copy:'Mostly one page template — expect a big “stands for N” number.' },
  { k:'marketing', label:'Marketing site',           copy:'Usually captures completely in one pass.' },
  { k:'notsure',   label:'Not sure',                 copy:'We’ll use balanced defaults — you can refine later from the map.' },
];
let capCount=0, skipCount=0, navCount=0, tplCount=0;

function mountOnboard(){
  document.getElementById('shell').classList.add('onboarding');
  document.querySelectorAll('.pane').forEach(p=>p.classList.remove('active'));
  const el = document.getElementById('pane-onboard');
  el.classList.add('active','scrollpane');
}
function obEl(){ return document.getElementById('pane-onboard'); }

function showWizard(prefill){
  const p = prefill || (STATUS && STATUS.product) || {};
  OB.url = p.url || OB.url || '';
  OB.loggedIn = (p.loggedIn != null) ? !!p.loggedIn : OB.loggedIn;
  OB.productType = p.productType || OB.productType || 'saas';
  obEl().innerHTML = `<div class="ob">
    <h2>Set up your design context</h2>
    <p class="sub">Point the kit at the product you design for. Three answers, then watch it capture — you won’t touch the terminal.</p>
    <div class="fld"><span>Do you sign in to use it?</span>
      <div class="seg" id="w-seg">
        <button type="button" class="segbtn" data-v="yes">Yes, I sign in</button>
        <button type="button" class="segbtn" data-v="no">No, it’s public</button>
      </div>
      <div class="hint">Skipping sign-in captures your product's signed-out face — marketing pages, the login screen. If the real product lives behind a login, sign in first: the kit captures what you can see.</div>
    </div>
    <label class="fld"><span id="w-url-label">Product URL</span>
      <input type="text" id="w-url" value="${esc(OB.url)}" placeholder="https://app.example.com" autocomplete="off" spellcheck="false"></label>
    <div class="hint" id="w-url-hint"></div>
    <label class="fld"><span>What kind of product is it?</span>
      <select id="w-type">${TYPES.map(t=>`<option value="${t.k}">${esc(t.label)}</option>`).join('')}</select></label>
    <div class="expect" id="w-expect"></div>
    <div class="err" id="w-err"></div>
    <button class="btn primary big" id="w-start">Start capture</button>
  </div>`;
  // Frame the URL question by the sign-in answer: signed-in products want the address you land on
  // AFTER login (that's what triggers the login redirect and IS the real app), not a marketing homepage.
  const paintUrl = ()=>{
    const lbl = document.getElementById('w-url-label'), hint = document.getElementById('w-url-hint');
    if (OB.loggedIn){
      lbl.textContent = 'The address you sign in to';
      hint.innerHTML = 'Use the page you land on <b>after</b> signing in — e.g. <code>app.example.com</code> or <code>example.com/dashboard</code>. A plain homepage (like <code>github.com</code>) often won’t reach your login; the app URL will.';
    } else {
      lbl.textContent = 'Product URL';
      hint.textContent = 'The address of the product you design for.';
    }
  };
  const seg = document.getElementById('w-seg');
  const paintSeg = ()=>seg.querySelectorAll('.segbtn').forEach(b=>b.classList.toggle('on', (b.dataset.v==='yes')===OB.loggedIn));
  seg.querySelectorAll('.segbtn').forEach(b=>b.onclick=()=>{ OB.loggedIn = b.dataset.v==='yes'; paintSeg(); paintUrl(); });
  paintSeg(); paintUrl();
  const sel = document.getElementById('w-type'); sel.value = OB.productType;
  const paintExpect = ()=>{ const t = TYPES.find(x=>x.k===sel.value)||TYPES[0]; document.getElementById('w-expect').textContent = t.copy; };
  sel.onchange = ()=>{ OB.productType = sel.value; paintExpect(); };  // type no longer overrides the sign-in answer
  paintExpect();
  document.getElementById('w-start').onclick = startFlow;
}

function showPhase(title, sub){
  obEl().innerHTML = `<div class="phase"><h2>${esc(title)}</h2><div class="spin"></div><p>${esc(sub)}</p></div>`;
}

function showLoginWait(){
  obEl().innerHTML = `<div class="phase">
    <h2>Log in to your product</h2><div class="spin"></div>
    <p>A browser window just opened. <b>Log in the way you always do</b> — your password stays in that window, never here.
       When you’re in, <b>close the window</b> and I’ll continue automatically.</p>
    <button class="btn" id="ob-manual" style="display:none;margin-top:16px">I’m logged in — continue</button>
  </div>`;
  const b = document.getElementById('ob-manual');
  if (b) b.onclick = ()=>{ if (window.__loginContinue) window.__loginContinue(); };
}

function showProgress(resuming){
  obEl().innerHTML = `<div class="prog">
    <h2>${resuming?'Capture in progress':'Capturing your product'}</h2>
    <p style="color:var(--dim)">Read-only — it follows links, never clicks, submits, or types on your product. It lands one page at a time.
       You can close this tab; the capture keeps running and you’ll see progress again when you reopen.</p>
    <div class="counters">
      <div class="kpi blue"><div class="n" id="c-cap">0</div><div class="l">pages captured</div></div>
      <div class="kpi purple"><div class="n" id="c-tpl">0</div><div class="l">templates collapsed</div></div>
      <div class="kpi amber"><div class="n" id="c-skip">0</div><div class="l">skipped</div></div>
      <div class="kpi"><div class="n" id="c-nav">—</div><div class="l">nav pages found</div></div>
    </div>
    <div class="oblog" id="ob-log"></div>
  </div>`;
}

function resetCounters(){ capCount=0; skipCount=0; navCount=0; tplCount=0; updateCounters(); }
function updateCounters(){ const set=(id,v)=>{ const e=document.getElementById(id); if(e) e.textContent=v; };
  set('c-cap',capCount); set('c-tpl',tplCount); set('c-skip',skipCount); set('c-nav', navCount||'—'); }
function feed(line){
  const el=document.getElementById('ob-log'); if(el){ el.textContent += line+'\n'; el.scrollTop=el.scrollHeight; }
  let m;
  if ((m=line.match(/Nav discovery[^:]*:\s*(\d+)\s*candidate/i))) navCount=+m[1];
  if (/✓ \(/.test(line)) capCount++;
  if (/skipped \(/.test(line)) skipCount++;
  if (/capturing 1 of|⧉ \//.test(line)) tplCount++;
  updateCounters();
}

// F5 (UAT #14): bare domains ("pinterest.com") get a scheme prepended so the wizard accepts them; an
// explicit http:// is never upgraded to https. Mirrors tools/wizard-url.js by hand (kept in sync the
// same way routeKey is — see test-wizard-url.js) since this dashboard stays a single self-contained file.
function normalizeWizardUrl(raw){
  const trimmed = String(raw==null?'':raw).trim();
  if (!trimmed) return null;
  const withScheme = /^https?:\/\//i.test(trimmed) ? trimmed : `https://${trimmed}`;
  try { new URL(withScheme); } catch { return null; }
  return withScheme;
}
async function startFlow(){
  const raw = document.getElementById('w-url').value.trim();
  const errEl = document.getElementById('w-err');
  const url = normalizeWizardUrl(raw);
  if (!url) { errEl.textContent = 'Enter a URL that starts with http:// or https://'; return; }
  errEl.textContent=''; OB.url=url;
  const r = await api('/api/onboard', { url, loggedIn:OB.loggedIn, productType:OB.productType });
  if (!r.ok) { errEl.textContent = 'Could not save: ' + (r.error||''); return; }
  try {
    if (OB.loggedIn) { await runLoginPageCapture(); await runLogin(); }
    await runMainCapture();
  } catch (e) { toast('Onboarding error: ' + e.message); }
}

async function waitCaptureDone(){
  for (;;){ const s = await fetch('/api/capture/log?since=0').then(x=>x.json()).catch(()=>null);
    if (s && !s.running) return s; await sleep(700); }
}

async function runLoginPageCapture(){
  showPhase('Capturing your sign-in page', 'A throwaway browser grabs the page a signed-out visitor sees — before you log in. It never touches your session and disappears once you’re in. This is the only chance to capture it.');
  const r = await api('/api/capture/start', { mode:'login-page' });
  if (r.ok) await waitCaptureDone();   // non-fatal if it can't: continue to login
}

function runLogin(){
  return new Promise(async (resolve)=>{
    let resolved=false; const fin=()=>{ if(resolved) return; resolved=true; resolve(); };
    window.__loginContinue = fin;
    showLoginWait();
    await api('/api/login/start', { url:OB.url });
    const started = Date.now();
    const tick = async ()=>{
      if (resolved) return;
      const s = await fetch('/api/login/status').then(x=>x.json()).catch(()=>null);
      if (s && s.started && !s.running) return fin();
      if (Date.now()-started > 60000){ const b=document.getElementById('ob-manual'); if(b) b.style.display='inline-block'; }
      setTimeout(tick, 1500);
    };
    tick();
  });
}

async function runMainCapture(){
  const r = await api('/api/capture/start', { mode:'full' });
  showProgress(false);
  if (!r.ok){
    const s = await fetch('/api/status').then(x=>x.json()).catch(()=>null);
    if (!(s && s.capture && s.capture.running)){
      obEl().innerHTML = `<div class="ob"><h2>Couldn’t start the capture</h2>
        <p class="sub">${esc(r.error||'unknown error')}</p>
        <button class="btn primary big" id="ob-retry">Back to setup</button></div>`;
      document.getElementById('ob-retry').onclick=()=>showWizard(OB); return;
    }
  }
  attachStream();
}

// SSE primary, polling fallback (PRD risk mitigation). `since` counts lines already shown so a
// mid-stream SSE drop resumes cleanly from the server's ring buffer.
function attachStream(){
  resetCounters();
  let done=false, since=0;
  const finish = (info)=>{ if(done) return; done=true; onCaptureDone(info||{}); };
  const startPoll = async ()=>{
    for(;;){ if(done) return;
      const s = await fetch('/api/capture/log?since='+since).then(x=>x.json()).catch(()=>null);
      if (s){ (s.lines||[]).forEach(feed); since = s.next; if(!s.running) return finish({code:s.code}); }
      await sleep(800);
    }
  };
  if (typeof EventSource === 'undefined') return startPoll();
  let es;
  try { es = new EventSource('/api/capture/events'); }
  catch(_){ return startPoll(); }
  es.addEventListener('line', e=>{ feed(e.data); since++; });
  es.addEventListener('done', e=>{ let info={}; try{ info=JSON.parse(e.data); }catch(_){} try{es.close();}catch(_){} finish(info); });
  es.onerror = ()=>{ if(done) return; try{es.close();}catch(_){} startPoll(); };
}

async function onCaptureDone(info){
  const logText = (document.getElementById('ob-log')||{}).textContent || '';
  if (info && info.code && info.code !== 0 && capCount === 0){
    obEl().innerHTML = `<div class="prog"><h2>Capture didn’t complete</h2>
      <p style="color:var(--dim)">It stopped before saving any pages — usually a login that didn’t take, or a site that blocked the browser. The full log is below.</p>
      <div class="oblog" id="ob-log2" style="height:38vh"></div>
      <button class="btn primary big" id="ob-retry">Back to setup</button></div>`;
    document.getElementById('ob-log2').textContent = logText;
    document.getElementById('ob-retry').onclick=()=>showWizard(OB);
    return;
  }
  let host='your product'; try { host = new URL(OB.url || (STATUS&&STATUS.product&&STATUS.product.url) || '').host || host; } catch(_){}
  // a real page slug for the wireframe starter (registry.json now exists — build-index ran at capture end)

  // capped count comes from the manifest (authoritative) — the log-parsed counters don't track it,
  // and omitting it is how the completion screen used to imply a fuller picture than it captured.
  let cappedCount=0;

  const sub = [];
  if (tplCount) sub.push(`${tplCount} repeating layout${tplCount===1?'':'s'} collapsed to one example each.`);
  if (skipCount) sub.push(`${skipCount} skipped (the Overview tab says why).`);
  if (cappedCount){ const one = cappedCount===1;
    sub.push(`${cappedCount} more page${one?'':'s'} ${one?'was':'were'} discovered but not downloaded — a cap keeps this first pass small. Find ${one?'it':'them'} on the map's frontier (step 2) and unlock anything that matters.`); }
  obEl().innerHTML = `<div class="ob">
    <h2>Captured ${capCount} page${capCount===1?'':'s'} of ${esc(host)} ✓</h2>
    <p class="sub">${sub.length?sub.join(' ')+' ':''}Your product is now design context your AI tools can read. Three moves to start:</p>
    <div class="ok-note" style="padding:16px">

      <div class="chiprow" style="margin-bottom:14px">${pchip('Copy the describe prompt', PROMPTS.describeLibrary())}</div>
      <div style="margin-bottom:6px"><b>2 · Explore the map</b> — grey nodes are pages found but not downloaded; click to unlock.</div>
      <div class="chiprow" style="margin-bottom:14px"><button class="pchip ghost" id="ob-map">Open the map</button></div>
      <div style="margin-bottom:6px"><b>3 · First wireframe</b> — design on a copy of a real captured page.</div>

    </div>
    <button class="btn primary big" id="ob-open">Go to dashboard</button>
  </div>`;
  // NB: the completion screen is served at path "/", so changing only the hash won't reload —
  // set the hash then reload() so boot() re-runs and initDashboard honors #map.
  document.getElementById('ob-map').onclick = ()=>{ location.hash='map'; location.reload(); };

// F7 (UAT #18) — non-blocking, dismissible banner when the dashboard has no server behind it: either
// opened straight from disk (file:) or served some other way where /api/status doesn't answer. Mounted
// ONLY on detection (never in server mode) so server mode never reflows — see --fb-h in the CSS above.
// Dismissal is in-memory only (no storage), so it lasts this page view, not across a reload.
function mountFileBanner(){
  if (location.protocol !== 'file:' && serverMode) return; // server answered → never show
  const el = document.createElement('div');
  el.className = 'filebanner';
  el.innerHTML = `<div class="fb-body"><b>Browsing only — the dashboard is open as a file.</b><br>`
    + `Everything captured is readable here, but capturing, guided sessions, and Copy for Figma need `
    + `the kit's tiny local server. From this folder, run: <code>bash tools/start.sh</code> — nothing `
    + `leaves your machine.</div>`
    + `<button type="button" class="fb-close" aria-label="dismiss this notice">×</button>`;
  document.body.insertBefore(el, document.body.firstChild);
  const setH = () => document.documentElement.style.setProperty('--fb-h', el.offsetHeight + 'px');
  setH();
  window.addEventListener('resize', setH);
  el.querySelector('.fb-close').onclick = () => {
    el.remove();
    document.documentElement.style.setProperty('--fb-h', '0px');
    window.removeEventListener('resize', setH);
  };
}

// Everything below runs only when a captured library exists.
function initDashboard(){
