  let mapReopen = null;                        // node id whose panel to reopen on return to map
  let guidedLive = null;                       // guided-capture live state (F5): {running,count,lastCapture}

  // thumbnail: skeleton wrapper + fade-in on decode; monogram on error for logos (F5)
  function img2(src, cls, alt){ return src

    : `<span class="${cls} skel"></span>`; }
  function wireThumbs(root){ (root||document).querySelectorAll('img.fade[data-src]:not([data-wired])').forEach(img=>{
    img.setAttribute('data-wired','1');
    // (v2.4.2 F5) The skeleton is the nearest .skel ANCESTOR, not necessarily the direct parent. The page
    // doc's hero is `<div class="shotwrap skel"><a><img></a></div>`, so `img.parentNode` resolved to the
    // <a>: `remove('skel')` hit an element that never had the class and the hero shimmered forever, over

  function monogram(cls, name){ return `<span class="${cls} mono-logo">${esc(((name||DATA.product||'?').trim()[0]||'?'))}</span>`; }

  // peek (F1): one component for atlas + map. #peek is a body-level portal (fixed), never clipped.
  const peekEl = document.getElementById('peek'); let peekHideT=null;
  function showPeek(n, cx, cy){ if(!n){ return; } clearTimeout(peekHideT);
    peekEl.innerHTML = n.locked
      ? `<div class="pk-b"><div class="pk-nm">${esc(short(n.pattern||n.label||'locked',40))}</div>
          <div class="pk-rt">${esc(n.pattern||'')}</div><div class="pk-desc dorm">not downloaded yet</div>
          <div class="pk-foot"><span>linked from ${n.inboundCount||n.count||1} pages</span><span class="pk-hint">click to unlock</span></div></div>`
      : `${img2(n.screenshot,'pk-shot')}
          <div class="pk-b"><div class="pk-nm">${esc(dlabel(n))}</div><div class="pk-rt">${esc(n.route||'')}</div>
          <div class="pk-desc${n.descPending?' dorm':''}">${n.descPending?'caption dormant, waiting for your AI':esc(short(n.desc||'',120))}</div>
          <div class="pk-foot"><span>linked from ${n.inboundCount||0} pages</span><span class="pk-hint">click to inspect</span></div></div>`;
    peekEl.classList.add('open'); peekEl.setAttribute('aria-hidden','false'); wireThumbs(peekEl); positionPeek(cx,cy); }
  function positionPeek(cx, cy){ const w=peekEl.offsetWidth||252, h=peekEl.offsetHeight||170;
    let x=cx+16, y=cy+16; if(x+w>innerWidth-8) x=cx-w-16; if(x<8) x=8;
    if(y+h>innerHeight-8) y=Math.max(8, cy-h-16); if(y<8) y=8; peekEl.style.left=x+'px'; peekEl.style.top=y+'px'; }
  function hidePeek(){ clearTimeout(peekHideT); peekHideT=setTimeout(()=>{ peekEl.classList.remove('open'); peekEl.setAttribute('aria-hidden','true'); }, 60); }

  // ═════════ MAP TAB — M22 orbital under fog (v2.1: zero-overlap · zoom · regions) ═════════
  // Honesty invariant: every spatial encoding is MEASURED — ring = clicks-from-home (clickDepth),
  // node size = inbound links (observed), bearing = the page's nav section. Only fog is decorative.
  // Zero-overlap: discs relaxed deterministically; labels placed by a measured screen-space collision pass.
  const nodes = [], byId = {};
  // F3 (hygiene-speaks-designer): a folded member drops its own map node (the rep carries it) but still
  // gets a byId entry — a direct link to its page doc (from the rep's "folded into this" list, or a
  // stale bookmark) still resolves; it's re-shelved, not hidden.
  DATA.nodes.forEach(n=>{ const o = {...n, locked:false}; if (!n.foldedInto) nodes.push(o); byId[o.id]=o; });
  DATA.frontier.forEach(f=>{ const o = {...f, locked:true}; nodes.push(o); byId[o.id]=o; });
  const edges = DATA.edges.filter(e=>byId[e.a]&&byId[e.b]&&!byId[e.a].foldedInto&&!byId[e.b].foldedInto);
  const adj = {}; nodes.forEach(n=>adj[n.id]=new Set());
  edges.forEach(e=>{ adj[e.a].add(e.b); adj[e.b].add(e.a); });
  document.title = DATA.product + ' — design context';
  const lockedTotal = DATA.frontier.reduce((s,f)=>s+(f.count||1),0);
  const root = nodes.find(n=>!n.locked && (n.id===DATA.rootSlug || n.route==='/')) || nodes.find(n=>!n.locked) || nodes[0];

  const selected = new Set(); let activeNode = null;
  const world=document.getElementById('mapworld'), areaEl=document.getElementById('maparea'), linesEl=document.getElementById('maplines'),
        labelsEl=document.getElementById('maplabels'), dcardEl=document.getElementById('mapdcard');
  const capNodes = nodes.filter(n=>!n.locked && n!==root);
  const maxIn = Math.max(1, root.inboundCount||0, ...capNodes.map(n=>n.inboundCount||0), ...DATA.frontier.map(f=>f.inboundCount||0));
  const secList0 = (DATA.sections||[]).filter(s=>s!=='Home');
  const secList = secList0.length ? secList0 : ['Other'];
  // ── F2 (v2.5 §3) — SECTOR WIDTH IS PROPORTIONAL TO MEMBERSHIP ──────────────────────────────────
  // UAT #17: a sector used to be a FIXED 1/n slice of the circle, so a product whose pages concentrate
  // in one or two nav sections (wikipedia: 23 of 24 pages under `Wiki`) piled every node into a single
  // arc and left the rest of the world empty. The encoding survives intact because what a sector
  // honestly claims is GROUPING, not absolute compass position: same section ⇒ same wedge, adjacency ⇒
  // same neighbourhood. Nothing ever claimed that north means anything. So the wedges now get the width
  // their membership earns — every sector keeps a SECTOR_FLOOR so a 1-page section stays findable, and
  // the remainder is split by member count. Pure function of (section order, member counts): the
  // section order is DATA.sections' own stable order and the counts are integers, so no randomness and
  // no float accumulation beyond a single left-to-right sweep — build-twice identical.
  const SECTOR_FLOOR = 18 * Math.PI/180;                        // ≥18° per sector, however small it is
  const secWeight = {}; secList.forEach(s=>secWeight[s]=0);
  capNodes.forEach(n=>{ const s=n.section; if(secWeight[s]!=null) secWeight[s]++; });
  const bearing = {}, sectorW = {};
  { const total = secList.reduce((a,s)=>a+secWeight[s], 0);
    const floor = Math.min(SECTOR_FLOOR, 2*Math.PI/secList.length);   // n×floor can't exceed the circle
    const rem = 2*Math.PI - floor*secList.length;
    let cur = -Math.PI/2;                                        // the first sector still opens at north
    secList.forEach(s=>{ const w = total ? floor + rem*secWeight[s]/total : 2*Math.PI/secList.length;
      sectorW[s] = w; bearing[s] = cur + w/2; cur += w; }); }
  const bearingOf = (s)=> bearing[s]!=null ? bearing[s] : 0;
  const sectorOf  = (s)=> sectorW[s]!=null ? sectorW[s] : 2*Math.PI/secList.length;

  // ---- layout state (world coords, home at 0,0) ----
  let VW=0, VH=0, minD=0, maxDepth=1, ringR1=0, ringRmax=0, nullR=0, ghostR=0;
  const P = {};                 // id -> {x,y,r,node,ghost}
  let ghostShown=[], deepCount=0, unreachCount=0, regions=[], hotRegion=null;
  // (v2.5.1 F1) the fog's zone boundaries are MEASURED off the finished layout rather than read off the
  // ring constants: the frontier band has to begin where the outermost explored disc actually ENDS and run
  // through where the ghost orbit actually ends, or the band lands on the wrong things — the relaxation
  // moves discs off their nominal rings, and a sparse product's rings sit nowhere near a dense one's.
  let exploredR=0, ghostOuterR=0;
  const ringRadius = (d)=> maxDepth<=1 ? ringR1 : ringR1 + (d-1)*(ringRmax-ringR1)/(maxDepth-1);
  const sizeOf = (n)=> Math.round(16 + 46*Math.min(1,(n.inboundCount||0)/maxIn));

  function computeLayout(){
    // v2.4 F4: the map lives in #maparea (the rail owns the right edge) — all geometry keys off it.
    const pane=document.getElementById('maparea'); const r=pane.getBoundingClientRect();
    VW=r.width; VH=r.height; if(!VW||!VH) return; minD=Math.min(VW,VH);
    for(const k in P) delete P[k];
    const homeD=Math.max(58, minD*0.10); P[root.id]={x:0,y:0,r:homeD/2, node:root};
    maxDepth=Math.max(1, ...capNodes.map(n=> n.clickDepth==null?1:n.clickDepth));
    ringR1=minD*0.22; ringRmax=minD*0.40; nullR=minD*0.45; ghostR=minD*0.56;
    const groups={}; capNodes.forEach(n=>{ const k=(n.section||'Other')+'|'+(n.clickDepth==null?'x':n.clickDepth); (groups[k]=groups[k]||[]).push(n); });
    // each (section, ring) group spreads inside ITS OWN sector's arc (F2) — a populous sector is wide, so
    // its members fan out across the world instead of stacking into one bearing. How MUCH of the wedge a
    // group uses scales with its size: a lone page sits dead centre, a pair stays compact around the
    // centre, and only a genuinely crowded group opens out to (almost) the full wedge. That is what keeps
    // "same section ⇒ same neighbourhood" legible while still filling the circle — spreading every group
    // to its wedge ends would fling a 2-page section as far apart as the layout allows.
    Object.values(groups).forEach(g=>{ g.sort((a,b)=>(b.inboundCount||0)-(a.inboundCount||0));
      const w=sectorOf(g[0].section)*Math.min(0.94, 0.30+0.16*(g.length-1));
      g.forEach((n,i)=>{ const b=bearingOf(n.section); const off=g.length>1?(-w/2 + i*w/(g.length-1)):0;
        const rad=n.clickDepth==null?nullR:ringRadius(n.clickDepth);
        P[n.id]={x:Math.cos(b+off)*rad, y:Math.sin(b+off)*rad, r:sizeOf(n)/2, node:n}; }); });
    const ghosts=DATA.frontier.slice().sort((a,b)=>(b.inboundCount||0)-(a.inboundCount||0));
    ghostShown=ghosts.slice(0, Math.min(ghosts.length,14));
    const gg={}; ghostShown.forEach(f=>{ const k=f.section||'Other'; (gg[k]=gg[k]||[]).push(f); });
    // ghosts fan out inside their own section's sector too (F2), so a populous section's frontier
    // follows its wedge instead of bunching at one bearing; the alternating radius stays.
    Object.values(gg).forEach(g=>g.forEach((f,i)=>{ const gw=Math.min(sectorOf(f.section)*0.7, 0.20*Math.max(1,g.length-1));
      const b=bearingOf(f.section)+(g.length>1?(-gw/2 + i*gw/(g.length-1)):0); const rad=ghostR+(i%2)*minD*0.05;
      P[f.id]={x:Math.cos(b)*rad, y:Math.sin(b)*rad, r:(Math.round(12+18*Math.min(1,(f.inboundCount||1)/maxIn)))/2, node:f, ghost:true}; }));
    deepCount=Math.max(0, lockedTotal - ghostShown.reduce((s,f)=>s+(f.count||1),0));
    unreachCount=capNodes.filter(n=>n.clickDepth==null).length;
    relaxDiscs();
    // (v2.5.1 F1) zone boundaries, measured AFTER relaxation — the outer edge of the outermost explored
    // disc and of the outermost ghost. Pure function of the layout, so build-twice identical.
    exploredR=0; ghostOuterR=0;
    for(const k in P){ const p=P[k], d=Math.hypot(p.x,p.y)+p.r;
      if(p.ghost) ghostOuterR=Math.max(ghostOuterR,d); else exploredR=Math.max(exploredR,d); }
    // a product with no frontier still gets a frontier band — just an empty one, so the fog reads the same
    if(!ghostOuterR) ghostOuterR = exploredR*1.18;
    computeRegions();
  }
  // deterministic relaxation — seeded from the radial layout, home fixed; guarantees disc gaps
  function relaxDiscs(){
    const ids=Object.keys(P).filter(id=>id!==root.id);
    const GAP=10, hr=P[root.id].r;
    for(let iter=0; iter<1500; iter++){ let worst=0;
      for(let i=0;i<ids.length;i++){ for(let j=i+1;j<ids.length;j++){
        const a=P[ids[i]], b=P[ids[j]]; let dx=b.x-a.x, dy=b.y-a.y; let d=Math.hypot(dx,dy);
        // break exact coincidence deterministically. (v2.5.1) d is set to 1, NOT to 0.001: dx,dy are
        // already a UNIT vector here, and the push below divides them by d — with d=0.001 that scaled the
        // separation by 1000×, flinging the pair ±20,000px in a single iteration. Eight of flipkart's
        // fourteen ghosts were sitting at r≈16,000 world px (invisible, ~20× off-canvas) because of it,
        // which is also why the frontier read as empty. Deterministic either way; now also correct.
        if(d<0.001){ dx=Math.cos(i*1.7); dy=Math.sin(i*1.7); d=1; }
        const need=a.r+b.r+GAP; if(d<need){ const push=(need-d)/2, ux=dx/d, uy=dy/d;
          a.x-=ux*push; a.y-=uy*push; b.x+=ux*push; b.y+=uy*push; worst=Math.max(worst,need-d); } } }
      for(const id of ids){ const p=P[id]; const d=Math.hypot(p.x,p.y)||0.001; const need=p.r+hr+10;
        if(d<need){ p.x+=p.x/d*(need-d); p.y+=p.y/d*(need-d); } }
      if(worst<0.25) break;
    }
  }
  // districts → regions (rounded bbox behind member nodes); 1-page sections merge into "Everything else"
  function computeRegions(){
    regions=[];
    const bySec={}; capNodes.forEach(n=>{ const s=n.section||'Other'; (bySec[s]=bySec[s]||[]).push(n); });
    const small=[];
    for(const [name,arr] of Object.entries(bySec)){ if(arr.length<=1){ small.push(...arr); continue; } regions.push(makeRegion(name, arr)); }
    if(small.length) regions.push(makeRegion('Everything else', small, small.length));
  }
  function makeRegion(name, arr, smallCount){
    let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9; const pad=30;
    arr.forEach(n=>{ const p=P[n.id]; if(!p) return; minx=Math.min(minx,p.x-p.r); miny=Math.min(miny,p.y-p.r); maxx=Math.max(maxx,p.x+p.r); maxy=Math.max(maxy,p.y+p.r); });
    const dist=(DATA.districts||[]).find(d=>d.name===name);
    const explored = smallCount!=null ? smallCount : (dist?dist.explored:arr.length);
    const fog = smallCount!=null ? 0 : (dist?dist.fog:0);

  function applyMapView(){

    // ── THE LUMINOUS CANVAS, one gradient system (v2.5 §2.1) ──────────────────────────────────────
    // v2.4.1 stacked three layers to tell the fog story — a world-space lit pool, a haze donut, a grain
    // texture — and the reading Prateek rejected came from the last of them: an overlay ABOVE the discs
    // darkens the world, so the frontier looked like a wall and the discs looked pasted on. Here the
    // whole ramp is ONE background on #maparea, i.e. GROUND. Nothing in the world is ever dimmed by it;
    // depth comes from the surface the world sits on. Screen-space, centred on home, radii × zoom so it
    // tracks the orbits exactly as the old fog did.
    // ── (v2.5.1 F1) FOUR zones, not three ───────────────────────────────────────────────────────────
    // v2.5 shipped lit centre → flat canvas → one compact rim, and the frontier — where the ghosts live —
    // was indistinguishable from the explored field, so the fog-of-war read was weak at rest. Same
    // mechanism (one gradient, painted as GROUND on #maparea), new falloff:
    //   1 · the lamp     — accent mixed into --canvas-lit, brightest at home. Unchanged mechanism, but it
    //                      now FINISHES inside the explored field: in v2.5 it ran to 0.66·minD, i.e. past
    //                      the ghost orbit, which is precisely what left no room for a frontier to read.
    //   2 · the field    — a genuine plain --canvas plateau holding the outermost explored ring.
    //   3 · the frontier — NEW. From just outside the outermost explored disc, through the ghost orbit, a
    //                      gradual wash to FRONT. The ghosts now sit visibly IN fog; `NOT LINKED …` sits at
    //                      this band's inner edge and `DEEP FOG …` at its outer edge.
    //   4 · the rim      — from past the ghost orbit, a wide ease-in easing (t², seven stops) to OPAQUE
    //                      --bg-deep by the pane corner. v2.5 stopped the vignette 60% short of --bg-deep
    //                      and put that 60% mostly outside the pane; the full range is now in-pane.
    const cx=VW/2+mapView.panX, cy=VH/2+mapView.panY, z=mapView.zoom;
    const hd=Math.hypot(VW,VH)/2;
    // Zone radii are world-tied (they belong to the orbits) but FLOORED to the pane: zoomed out, a purely
    // world-tied ramp collapses onto the shrinking world and the pane goes black — the pane must always

    const fieldEnd = Math.max(exploredR*z, hd*0.34);

    const rimEnd   = hd*0.985;   // …and --bg-deep is fully reached just inside the corner, never beyond it
    const lampEnd  = fieldEnd*0.85;                 // leaves a real --canvas plateau before the band
    const LIT='color-mix(in srgb, var(--accent) 11%, var(--canvas-lit))';
    const FRONT='color-mix(in srgb, var(--bg-deep) 30%, var(--canvas))';   // the frontier's own value
    const L=p=>`color-mix(in srgb, ${LIT} ${p}%, var(--canvas))`;          // lamp:     LIT   → --canvas
    const B=p=>`color-mix(in srgb, ${FRONT} ${p}%, var(--canvas))`;        // frontier: canvas → FRONT
    const R=p=>`color-mix(in srgb, var(--bg-deep) ${p}%, ${FRONT})`;       // rim:      FRONT → --bg-deep
    const stops=[]; const add=(c,r)=>stops.push(c+' '+(Math.round(r*100)/100)+'px');
    // the lamp falls off over SEVEN stops, not two: a radial-gradient interpolates linearly between stops,
    // so a 3-stop ramp puts a visible crease in the field exactly where the derivative jumps — which is
    // what made the lit area read as a hard-edged disc instead of light.
    add(LIT,0); [[84,.152],[56,.333],[30,.515],[14,.682],[5,.848]].forEach(([p,t])=>add(L(p), lampEnd*t));

    add('var(--canvas)', fieldEnd);                                        // the plateau
    // the band's onset is quick and its tail is long: by the time the ghost orbit begins the ground is
    // already most of the way to FRONT, so a ghost sits IN fog rather than at the top of a ramp toward it.
    // (The onset is still only ~3 levels over 37px — far below a visible edge.)

  const ovl=(a,b)=>{ const ox=Math.min(a.right,b.right)-Math.max(a.left,b.left), oy=Math.min(a.bottom,b.bottom)-Math.max(a.top,b.top); return ox>4 && oy>4; };

  // ═════════ (v2.5.1 F5) THE MOTION CONTROLLER ═════════
  // Three one-shot effects the CSS cannot start on its own, and one suspend switch. No JS ever writes a
  // layout value on a timer — the only thing these do is add or drop a class, so the settled render (and
  // therefore every measured gate, and the shot tooling) is identical to a build with no motion at all.
  let mzT=null;
  // Ending the reveal RE-PLACES the labels, and that is not a nicety — it is what keeps the reveal from
  // changing the settled layout. placeLabels() is a screen-space collision pass that measures real disc
  // rects; during the reveal those rects are mid-`mzpop`, i.e. scale(.92), so the pass sees discs ~8%
  // smaller than they end up and commits pill positions computed against geometry that no longer exists a
  // moment later. (Caught by the F5 gate: a home→map switch left five pills in different slots than the
  // same map at rest, and the difference vanished under prefers-reduced-motion — which is what named the
  // animation as the cause.) One re-place on settle, so the collision pass always has final geometry.

  // F5·4 — the eased button zoom. Labels are hidden for the ride and re-placed once the transform lands, so

  // would never fire transitionend — hence the explicit no-op path.
  function easedZoom(apply){
    const t0=world.style.transform;
    world.classList.add('zt'); labelsEl.classList.add('zhide');
    let settled=false;
    const done=()=>{ if(settled) return; settled=true;
      world.classList.remove('zt'); labelsEl.classList.remove('zhide'); placeLabels(); };
    apply();
    if(world.style.transform===t0) return done();
    world.addEventListener('transitionend', done, {once:true});
    world.addEventListener('transitioncancel', done, {once:true});
  }

  // ---- zoom + pan (listeners live on #maparea so the rail scrolls/clicks like a normal column, F4) ----
  const clampZoom=z=>Math.max(0.45, Math.min(3, z));
  function zoomAt(cx, cy, factor){ const z0=mapView.zoom, z1=clampZoom(z0*factor);
    // keep the world point under (cx,cy) fixed
    const wx=(cx - (VW/2+mapView.panX))/z0, wy=(cy - (VH/2+mapView.panY))/z0;
    mapView.zoom=z1; mapView.panX = cx - VW/2 - wx*z1; mapView.panY = cy - VH/2 - wy*z1; applyMapView(); }
  const mapPane=document.getElementById('pane-map');
  const mapArea=document.getElementById('maparea');
  mapArea.addEventListener('wheel', e=>{ if(!mapPane.classList.contains('active')) return; e.preventDefault();
    suspendMapMotion();   // (F5·4) wheel is direct manipulation: same-frame, never eased
    const r=mapArea.getBoundingClientRect(); zoomAt(e.clientX-r.left, e.clientY-r.top, e.deltaY<0?1.12:0.893); }, {passive:false});
  let panning=false, sx0=0, sy0=0, mapDragged=false;
  mapArea.addEventListener('mousedown', e=>{ if(e.target.closest('#mapzoom')) return; suspendMapMotion();
    panning=true; mapDragged=false; sx0=e.clientX; sy0=e.clientY; world.style.cursor='grabbing'; });
  addEventListener('mousemove', e=>{ if(!panning) return; const dx=e.clientX-sx0, dy=e.clientY-sy0; if(Math.abs(dx)+Math.abs(dy)>3) mapDragged=true;
    mapView.panX+=dx; mapView.panY+=dy; sx0=e.clientX; sy0=e.clientY; applyMapView(); });
  addEventListener('mouseup', ()=>{ if(panning){ panning=false; world.style.cursor=''; setTimeout(()=>mapDragged=false, 0); } });
  mapArea.addEventListener('dblclick', e=>{ if(e.target.closest('[data-mapid]')||e.target.closest('#mapzoom')) return; resetView(); });
  // F4·3: clicking empty map canvas deselects → the rail returns to the ledger. Lives on #maparea (the
  // transformed #mapworld doesn't cover the whole visible area), skipping nodes and floating controls.
  mapArea.addEventListener('click', e=>{ if(mapDragged) return;
    if(e.target.closest('[data-mapid]')||e.target.closest('#mapzoom')||e.target.closest('#mapstats')||e.target.closest('#maplegend')||e.target.closest('#mapnote')||e.target.closest('#mapdcard')) return;
    window.closePanel(); });
  // (F5·4) the three BUTTONS ease — a deliberate step deserves a transition; the gestures above do not
  document.getElementById('zinbtn').onclick=()=>easedZoom(()=>zoomAt(VW/2, VH/2, 1.2));
  document.getElementById('zoutbtn').onclick=()=>easedZoom(()=>zoomAt(VW/2, VH/2, 0.83));
  document.getElementById('zfitbtn').onclick=()=>easedZoom(resetView);
  function resetView(){ mapView.zoom=1; mapView.panX=0; mapView.panY=0; applyMapView(); }

  function resize(){ computeLayout(); renderWorld(); applyMapView(); }
  function fit(){ resize(); }
  addEventListener('resize', ()=>{ if(document.getElementById('pane-map').classList.contains('active')) resize(); });

  // ═════════ UNIFIED RIGHT RAIL (v2.4 F4) — one rail on Home + Map ═════════
  // State machine: default = the ledger; selecting a page (atlas card / map node) swaps the rail to the
  // page-detail panel; × / ESC / empty-canvas click return the ledger; a tab switch resets; "Expand"
  // opens the full page doc and "← Back to map" restores zoom/pan/selection AND this rail panel.
  let railSel = null;   // slug whose detail the rail shows; null → the ledger
  // (v2.4.2 F4) Below the stacking breakpoint the Home rail wraps UNDER the content, so swapping it to a
  // page detail changes something the user cannot see. One token governs it: --stack-bp in :root, read
  // here so the number lives in exactly one place (the @media blocks are slaved to the same value).
  const STACK_BP = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--stack-bp')) || 1080;
  const isStacked = () => innerWidth <= STACK_BP;
  // The one entry point for "a page was selected" — atlas card (Home) and map node (Map) both come here.
  // Stacked: go straight to the full page doc (the same view Expand opens; its back button returns to the
  // originating tab, and the map's camera is restored by mapReopen). Locked nodes have no page doc — the
  // unlock list only exists in the rail panel — so they keep the rail and it is scrolled into view.
  function selectPage(n){
    if(isStacked()){
      if(!n.locked) return openFullDoc(n.id);
      openPanel(n); const r=railTarget(); if(r && r.scrollIntoView) r.scrollIntoView({block:'start'}); return;
    }
    openPanel(n);
  }
  function railTarget(){
    return document.getElementById('pane-map').classList.contains('active')
      ? document.getElementById('maprail-body')
      : document.getElementById('homerail');
  }
  // Shared selective-pull trigger — the global capbtn (manual checkbox picking) and the shape offer's
  // "Get one example" / "Download all" both funnel through this so there's one capture path, not three.
  async function runCapture(urls, btn){
    if (!urls || !urls.length) return;
    if (serverMode){ if(btn) btn.disabled=true; toast(`Capturing ${urls.length} page(s) — watch the browser window…`, true);
      const r = await api('/api/capture',{urls}); if (r.ok) location.reload(); else { toast('Failed: '+r.error); if(btn) btn.disabled=false; } }
    else { const cmd = `node tools/capture.js --urls "${urls.join(',')}"`;
      try { await navigator.clipboard.writeText(cmd); toast('Command copied — paste it in your terminal (or ask your AI to run it)'); }
      catch(_){ prompt('Run this in the terminal:', cmd); } }
  }
  function renderRail(){
    const el = railTarget(); if(!el) return;
    const n = railSel ? byId[railSel] : null;
    if (n) renderDetail(el, n); else { el.innerHTML = ledgerBody(); wireHygieneCard(el); }
  }
  function openPanel(n){ activeNode=n; railSel=n.id; renderRail();
    railFade(); pulseDisc(n.id);   // (v2.5.1 F5·3) ledger→detail dissolves; the chosen disc pulses once
    const mr=document.getElementById('maprail');
    if(mr && document.getElementById('pane-map').classList.contains('active')) mr.scrollTop=0; }
  function renderDetail(el, n){
    const CLOSE = '<button class="rclose" data-rail-close aria-label="close — back to the ledger">×</button>';
    if (n.locked){
      const urls = n.urls || [n.url];
      const isShape = n.kind==='frontier-group';
      // representative-first (bug 8): a shape offers ONE example by default (coverage copy, canon) with
      // "download all" demoted below it, dim and warned — downloading every sibling is rarely what the
      // designer wants (near-duplicates flooding a capped library) and the kit already knows they share a
      // layout. Picking specific pages (the checkbox list) stays available beneath, for when it isn't.
      const shapeOffer = `<div class="desc"><b>${n.count}</b> pages share this layout — one example covers the shape for your AI.</div>
        ${n.via&&n.via.length?`<span class="meta">found on: ${n.via.slice(0,4).map(esc).join(', ')}</span>`:''}
        <div class="repcta"><button class="btn primary" id="getone">Get one example</button>
        <div class="dlall-wrap"><button class="btn dlall" id="dlall">Download all ${n.count}</button>
        <div class="warn">usually near-duplicates — they'll crowd your library and your AI learns nothing new.</div></div></div>`;
      const plainOffer = `<div class="desc">Discovered during capture, not downloaded.
        ${n.via&&n.via.length?`<br><span class="meta">found on: ${n.via.slice(0,4).map(esc).join(', ')}</span>`:''}</div>`;
      el.innerHTML = `<div class="railpanel">${CLOSE}<h2>Locked — not downloaded yet</h2>
        <div class="route">${esc(n.pattern||'')}</div>
        ${isShape ? shapeOffer : plainOffer}
        <div class="chiprow" style="margin:10px 0">${pchip("Ask your AI what's worth unlocking", PROMPTS.whatsMissing(), true)}</div>
        <h3>${isShape?'Or pick specific pages':'Pick pages to unlock'} ${n.count>urls.length?`(showing ${urls.length} of ${n.count})`:''}</h3>
        ${urls.map(u=>`<label class="urlrow"><input type="checkbox" data-u="${esc(u)}" ${selected.has(u)?'checked':''}>
          <span class="u">${esc(decodeURIComponent(u).replace(/^https?:\/\/[^/]+/,''))}<small>${esc(u.split('/')[2]||'')}</small></span></label>`).join('')}
        <div style="margin-top:10px"><button class="btn" id="selall">Select all shown</button></div></div>`;
      el.querySelectorAll('input[data-u]').forEach(cb=>cb.onchange=()=>{ cb.checked?selected.add(cb.dataset.u):selected.delete(cb.dataset.u); n.someSelected=[...selected].some(u=>urls.includes(u)); syncCapBtn(); });
      el.querySelector('#selall').onclick=()=>{ urls.forEach(u=>selected.add(u)); n.someSelected=true; openPanel(n); syncCapBtn(); };
      if (isShape){
        // "the specific URL the designer clicked" = a single box already checked in the list below;
        // otherwise the server-computed highest-inbound representative (n.repUrl).
        el.querySelector('#getone').onclick=()=>{ const checkedHere=urls.filter(u=>selected.has(u));
          runCapture(checkedHere.length===1 ? checkedHere : [n.repUrl || urls[0]]); };
        el.querySelector('#dlall').onclick=()=>runCapture(urls);
      }
    } else {
      const when = n.capturedAt ? new Date(n.capturedAt).toLocaleString() : '—';
      const depthTxt = n.clickDepth==null ? 'not linked from home' : `${n.clickDepth} click${n.clickDepth===1?'':'s'} from home`;
      // F3 (hygiene-speaks-designer): a folded rep lists its instances as links (they still resolve —
      // "re-shelved", not hidden); a folded member (opened directly, e.g. a stale bookmark) points back.
      const foldedMembers = Object.values(byId).filter(x=>!x.locked && x.foldedInto===n.id);
      el.innerHTML = `<div class="railpanel">${CLOSE}<h2>${esc(dlabel(n))}</h2>
        <div class="route">${esc(n.route)}</div>
        ${n.screenshot?`<a href="${esc(n.screenshot)}" target="_blank" aria-label="open full screenshot">${img2(n.screenshot,'pshot')}</a>`:''}
        <div class="meta">downloaded ${when}${n.standsFor?` · stands for <b>${n.standsFor}</b> pages`:''} · linked from ${n.inboundCount||0} · ${depthTxt}</div>
        <div class="desc">${n.descPending?'<span class="meta">— caption dormant, waiting for your AI</span>':esc(n.desc||'')} ${n.descPending?'':'<span class="ai" title="model-written orientation, not extracted fact">ai</span>'}</div>
        <button class="btn primary" id="pnl-expand" style="width:100%;margin-top:12px">Expand ↗ Open the full page doc</button>
        <div class="chiprow" style="margin-top:10px">${pchip('Wireframe on this page', PROMPTS.wireframe(n.id))}${figmaBtn(n.id)}${n.descPending ? pchip('Describe this page', PROMPTS.describeLibrary(), true) : pchip('Ask about this page', PROMPTS.askQuestion(), true)}</div>
        <div class="links" style="margin-top:8px;font-size:12px"><a href="${esc(n.pageHtml)}" target="_blank">open HTML</a> · <a href="${esc(n.pageMd)}" target="_blank">screen doc</a></div>
        ${n.foldedInto?`<div class="meta" style="margin-top:6px">Folded into <button class="lnk" data-goto="page/${esc(n.foldedInto)}">${esc(dlabel(byId[n.foldedInto]||{id:n.foldedInto}))}</button> — captured here, shown there.</div>`:''}
        ${foldedMembers.length?`<h3>Also stands for</h3><div class="desc">${foldedMembers.map(m=>`<button class="lnk" data-goto="page/${esc(m.id)}">${esc(dlabel(m))}</button>`).join(' · ')}</div>`:''}
        ${n.notes?`<h3>Designer notes</h3><div class="desc">${esc(n.notes)}</div>`:''}
        <h3>States</h3>
        ${(n.states||[]).map(s=>`<div class="state"><span>${esc(s.name)}</span><span class="stateacts"><span class="tag ${s.captured?'':'pending'}">${s.captured?'captured':'pending'}</span>${s.captured?figmaBtn(n.id, s.name, true):''}</span></div>`).join('') || '<div class="meta">none recorded</div>'}
        <div id="stateform" style="margin-top:8px">
          <input id="st-name" placeholder="state name (e.g. empty, error)" aria-label="state name">
          <input id="st-url" placeholder="URL that shows this state" aria-label="state url">
          <button class="btn primary" id="st-add">Add &amp; download state</button>
          <div class="meta" style="margin-top:4px">States you can reach by URL (filters, #modal=…, ?tab=…). Others need the guided pass.</div>
          <button class="guidedlink" id="st-guided" data-url="${esc(pageUrl(n))}">Can't reach it by URL? Guided capture</button>
        </div></div>`;
      wireThumbs(el);
      el.querySelector('#pnl-expand').onclick=()=>openFullDoc(n.id);
      { const g=el.querySelector('#st-guided'); if(g) g.onclick=()=>launchGuided(g.dataset.url); }
      el.querySelector('#st-add').onclick=async()=>{ const name=el.querySelector('#st-name').value.trim(), url=el.querySelector('#st-url').value.trim();
        if(!name||!url) return toast('Give the state a name and a URL');
        if (serverMode){ toast('Capturing state — watch the browser window…', true);
          const r = await api('/api/state',{slug:n.id,name,url}); r.ok ? location.reload() : toast('Failed: '+r.error); }
        else toast(`Run: node tools/capture.js --state ${n.id}:${name} --url "${url}"`); };
    }
  }
  window.closePanel = function(){ const had=railSel!=null; railSel=null; activeNode=null; renderRail();
    if(had) railFade(); };   // (v2.5.1 F5·3) detail→ledger dissolves too; a no-op close stays still
  // × on the rail panel + ESC both return the rail to the ledger (F4·3)
  document.addEventListener('click', e=>{ if(e.target.closest && e.target.closest('[data-rail-close]')) window.closePanel(); });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape' && railSel) window.closePanel(); });
  // F1: expand → full doc, recording provenance (and the map node to reopen on return)
  function openFullDoc(slug){ const onMap = document.getElementById('pane-map').classList.contains('active');
    pageOrigin = onMap ? 'map' : 'home'; if (onMap) mapReopen = slug;
    window.closePanel(); location.hash = 'page/' + slug; }

  // ═════════ GUIDED CAPTURE (F1/F2/F3 launch · F5 live loop · file:// degrade) ═════════
  // The full product URL for a page node (map nodes carry route, not the absolute URL).
  function pageUrl(n){ const o=(DATA.origin||'').replace(/\/+$/,''); return o + (n && n.route ? n.route : '/'); }
  // file:// fallback command — prompts-are-the-UI, same shape as v2's cd chip.
  function guidedCmd(startUrl){ return `node tools/capture.js --guided --url "${startUrl || (DATA.origin||'<product URL>')}"`; }
  // Launch a guided session. Server mode → POST; file:// → copy the command (handled at the call site
  // via copyGuidedCmd). Returns silently; the live loop is driven by guidedStream().
  async function launchGuided(startUrl){
    // F1/F3 pass no URL → start at the product's own origin (validation workspaces have no product.json
    // for the server to fall back to). F2 passes the specific page URL.
    const u = startUrl || DATA.origin || '';
    if(!serverMode) return copyGuidedCmd(u);
    const r = await api('/api/guided/start', u?{startUrl:u}:{});
    if(!r.ok){ toast(r.error || 'Another capture is running — finish or stop it first.'); return; }
    guidedLive = { running:true, count:0, lastCapture:null, capturing:false };
    paintGuidedLive();
    guidedStream();
  }
  function copyGuidedCmd(startUrl){ const cmd=guidedCmd(startUrl);
    (navigator.clipboard?navigator.clipboard.writeText(cmd):Promise.reject())
      .then(()=>toast('Command copied — paste it in your terminal (or ask your AI to run it)'))
      .catch(()=>{ try{ prompt('Run this in the terminal:', cmd); }catch(_){} }); }
  // End a running guided session from the dashboard (FB1) — the server SIGTERMs capture.js, which
  // closes its browser cleanly and still writes the session + hygiene artifacts. guided-done reloads us.
  async function endGuided(){
    if(guidedLive && guidedLive.capturing){ toast('A page is still saving — one moment…'); return; }  // CTA is disabled here anyway
    toast('Ending the guided session…', true);
    const r = await api('/api/guided/stop', {});
    if(!r || !r.ok) toast('Could not end the session: ' + ((r&&r.error)||'unknown') + ' — if it says “unknown endpoint”, restart tools/map.js (the server predates this feature).');
    // success path: the guided-done SSE event (or poll) drives the rebuild + reload.
  }
  // Live in-progress entry: sticky toast + (if home is showing) the ledger's next-slot updates.
  function paintGuidedLive(){
    const cnt = guidedLive ? guidedLive.count : 0;
    toast(guidedLive && guidedLive.capturing ? `Capturing this page… · ${cnt} saved so far` : `Guided capture in progress — ${cnt} captured · the window is yours`, true);
    if(document.getElementById('pane-home').classList.contains('active')) renderHome();
    else if(document.getElementById('pane-map').classList.contains('active') && !railSel) renderRail(); // live entry in the map's ledger too (F4)
  }
  // SSE primary (namespaced "guided"/"guided-done"), polling fallback — mirrors attachStream().
  function guidedStream(){
    let done=false;
    const finish=(d)=>{ if(done) return; done=true; guidedLive=null;
      if(d && d.error){                                   // launch failed (usually a locked profile) — say why, don't reload into nothing
        toast('Guided capture couldn’t start: ' + d.error, true);
        if(document.getElementById('pane-home').classList.contains('active')) renderHome();
        return;
      }
      toast('Guided session ended — rebuilding your library…', true);
      setTimeout(()=>{ location.hash=''; location.reload(); }, 900); };
    const update=(p)=>{ if(!p) return; guidedLive={ running:!!p.running, count:p.captures||0, lastCapture:p.lastCapture, capturing:!!p.capturing };
      if(!p.running) return finish(p); paintGuidedLive(); };
    const poll=async()=>{ for(;;){ if(done) return;
      const s=await fetch('/api/guided/status').then(x=>x.json()).catch(()=>null);
      if(s){ update(s); if(!s.running) return; } await sleep(1200); } };
    if(typeof EventSource==='undefined') return poll();
    let es; try{ es=new EventSource('/api/capture/events'); }catch(_){ return poll(); }
    es.addEventListener('guided', e=>{ let p={}; try{p=JSON.parse(e.data);}catch(_){} update(p); });
    es.addEventListener('guided-done', e=>{ let d={}; try{d=JSON.parse(e.data);}catch(_){} try{es.close();}catch(_){} finish(d); });
    es.onerror=()=>{ if(done) return; try{es.close();}catch(_){} poll(); };
  }

  // ═════════ COPY FOR FIGMA (figma-exit-copy-paste PRD, F1/F2) ═════════
  // One component everywhere (page-doc header · shared panel · each captured state). Converts the real
  // SNAPSHOT DOM — pages/<slug>/page.html, or a state's page.html — into Figma's paste format entirely
  // in the browser, then writes it to the clipboard as a user gesture. No plugin, no network, no server
  // required (the copy works on file:// too; the server, when present, only records the exit).
  const FIG_LABEL = '⧉ Copy for Figma';
  // Font handling: the pasted Figma TEXT only survives if the converter can embed real font bytes — a
  // loader that returns no/empty bytes makes Figma drop the text and keep only images + frames. So we
  // use the converter's DEFAULT font loader, which fetches the needed font (falling back to Inter) from
  // cdn.jsdelivr.net/fontsource. That is the ONE external request the kit makes during a copy: a cacheable
  // GET of public font files, no user data. (See figma-exit-copy-paste-2026-07: fully-offline text needs
  // fonts vendored locally — a follow-up; text fidelity wins over the no-CDN purity in the meantime.)
  let figmaLib = null;     // the lazy-loaded DomToFigma module (loaded once, on first Copy click)
  let figmaCache = null;   // { key, item, html } — a converted payload kept for a focused click:
                           //   both the two-phase re-arm (F2·3) AND the same-page repeat-copy cache (§4·5)

  // Lazy-load the 830KB vendored bundle on first use ONLY — first paint never pays for it (§4·5).
  function loadFigmaLib(){
    if (figmaLib) return Promise.resolve(figmaLib);
    if (typeof window.DomToFigma !== 'undefined'){ figmaLib = window.DomToFigma; return Promise.resolve(figmaLib); }
    return new Promise((resolve, reject)=>{
      const s = document.createElement('script'); s.src = '_dom-to-figma.js';
      s.onload = ()=>{ figmaLib = window.DomToFigma || null; figmaLib ? resolve(figmaLib) : reject(new Error('converter missing after load')); };
      s.onerror = ()=>reject(new Error('could not load the Figma converter'));
      document.head.appendChild(s);
    });
  }

  // Convert one snapshot → a Figma clipboard payload. The snapshot's page.html runs in a hidden,
  // OFFSCREEN same-origin iframe (never display:none — computed styles need real layout) so we convert
  // the TRUE product DOM, not the dashboard. Width rule (F2·2) lands the frame at the snapshot's natural
  // width (min 1440 — the capture viewport) so nothing crops. The iframe is always torn down (F2·hygiene).
  async function convertSnapshot(src, name){
    const lib = await loadFigmaLib();
    const frame = document.createElement('iframe');
    frame.setAttribute('aria-hidden', 'true');
    frame.style.cssText = 'position:fixed;left:-99999px;top:0;width:1440px;height:900px;border:0;visibility:hidden';
    document.body.appendChild(frame);
    try {
      await new Promise((resolve, reject)=>{
        frame.onload = ()=>resolve();
        frame.onerror = ()=>reject(new Error('could not load the snapshot'));
        frame.src = src;
        setTimeout(()=>reject(new Error('snapshot load timed out')), 30000);
      });
      const doc = frame.contentDocument;
      if(!doc || !doc.body) throw new Error('snapshot has no body');
      await sleep(120);   // settle beat: let late styles/layout apply before we measure
      // width = max(documentElement.scrollWidth, body.scrollWidth, 1440) — the spike's crop is the regression test
      const width = Math.max(doc.documentElement.scrollWidth||0, doc.body.scrollWidth||0, 1440);
      if (Math.abs(width - 1440) > 1){ frame.style.width = width + 'px'; await sleep(80); }   // reflow at natural width, then re-measure height
      let height = Math.max(doc.documentElement.scrollHeight||0, doc.body.scrollHeight||0, 1);
      // F1 — a `loading="lazy"` image only decodes once it enters the iframe's OWN rendered viewport,
      // and the frame was left at its initial 900px height, so nothing below the fold on a long page
      // ever got there. Grow the frame to the full content height, force every image eager as a
      // belt-and-braces backstop, then wait for each to actually decode before converting — settle-guarded
      // (allSettled) so one broken image can't hang the whole convert.
      frame.style.height = height + 'px';
      const imgs = [...doc.images];
      imgs.forEach(img => { if (img.loading === 'lazy') img.loading = 'eager'; });
      await sleep(80);   // let the now-full-height frame settle before decoding
      await Promise.allSettled(imgs.map(img => img.decode ? img.decode() : Promise.resolve()));
      height = Math.max(doc.documentElement.scrollHeight||0, doc.body.scrollHeight||0, 1);   // re-measure: a decoded image with no reserved box can reflow the page
      frame.style.height = height + 'px';
      const conv = lib.createFigmaConverter();   // default font loader — embeds real fonts so Figma keeps the text
      const result = await conv.convert({ element: doc.body, width, height, name });
      return { item: result.toClipboardItem(), html: result.toClipboardHtml(), bytes: (result.bytes && result.bytes.length) || 0 };
    } finally {
      frame.remove();
    }
  }

  // Write a converted payload to the clipboard. Primary = the real Figma ClipboardItem; on a focused
  // document where that specific write fails, fall back to a text/html envelope (F2·5, the spike's
  // fallback). Returns 'ok' on success, 'refocus' when the doc isn't focused (caller re-arms, F2·3).
  async function attemptWrite(payload){
    try { await navigator.clipboard.write([payload.item]); return 'ok'; }
    catch(e){
      if (!document.hasFocus() || (e && e.name === 'NotAllowedError')) return 'refocus';
      await navigator.clipboard.write([new ClipboardItem({ 'text/html': new Blob([payload.html], { type:'text/html' }) })]);
      return 'ok';
    }
  }

  // Build a Copy-for-Figma button. slug → the page; state (optional) → convert THAT state's page.html;
  // mini → the compact per-state variant. src/name are baked into data-attrs the delegated handler reads.
  function figmaBtn(slug, state, mini){
    const n = byId[slug]; if(!n) return '';
    const src = state ? ('pages/' + slug + '/states/' + state + '/page.html') : (n.pageHtml || ('pages/' + slug + '/page.html'));
    const name = state ? (dlabel(n) + ' › ' + state) : dlabel(n);
    return '<button type="button" class="figbtn' + (mini ? ' mini' : '') + '" data-figma-src="' + esc(src) + '"'
      + ' data-figma-slug="' + esc(slug) + '"' + (state ? ' data-figma-state="' + esc(state) + '"' : '')
      + ' data-figma-name="' + esc(name) + '">' + FIG_LABEL + '</button>';
  }
  function setFigBtn(btn, text, cls){ btn.textContent = text; btn.className = 'figbtn' + (btn.classList.contains('mini') ? ' mini' : '') + (cls ? ' ' + cls : ''); }
  function figSuccess(btn){
    // (figmaCache is intentionally kept — an instant same-page repeat copy skips re-conversion, §4·5)
    setFigBtn(btn, FIG_LABEL, '');
    btn.disabled = false;
    toast('Copied — paste into Figma (⌘V). It lands as editable layers.');
    // F3 — record the exit in the ledger (server mode only; file:// copies work but are logged silently).
    if (serverMode){ const slug = btn.getAttribute('data-figma-slug'), state = btn.getAttribute('data-figma-state') || null;
      if (slug) api('/api/figma-copy', state ? { slug, state } : { slug }); }
  }
  function figRearm(btn){   // F2·3: payload is cached; the NEXT click (a fresh gesture) writes instantly
    setFigBtn(btn, 'Ready — click to copy', 'armed'); btn.disabled = false;
    toast('Keep this tab focused while copying.');
  }
  function figFail(btn){
    setFigBtn(btn, FIG_LABEL, ''); btn.disabled = false; figmaCache = null;
    toast('The copy didn\'t complete. Try again — and if pasting into Figma stays broken, Figma may have changed its format; check the kit repo for an update.', true);
  }

  // Single delegated handler for EVERY Copy-for-Figma button, anywhere it renders.
  async function onFigmaClick(btn){
    if (btn.disabled) return;
    const src = btn.getAttribute('data-figma-src'), name = btn.getAttribute('data-figma-name') || 'page';
    if(!src) return;
    // Phase 2 — a payload for THIS target is already cached (a prior re-arm, or a repeat copy): if we're
    // focused, write it instantly (no re-convert); if still unfocused, re-arm again.
    if (figmaCache && figmaCache.key === src){
      if (document.hasFocus()){ btn.disabled = true;
        try { const r = await attemptWrite(figmaCache); r === 'ok' ? figSuccess(btn) : figRearm(btn); }
        catch(_){ figFail(btn); }
      } else { figRearm(btn); }
      return;
    }
    // Phase 1 — convert (4–13s on real pages). Honest progress; block double-clicks; never freeze silently.
    setFigBtn(btn, 'Converting for Figma…', ''); btn.disabled = true;
    toast('big pages take ~10 seconds', true);
    try {
      const payload = await convertSnapshot(src, name);
      figmaCache = { key: src, item: payload.item, html: payload.html };
      toast('', false); const t=document.getElementById('toast'); if(t) t.style.display='none';
      if (document.hasFocus()){
        const r = await attemptWrite(figmaCache);
        r === 'ok' ? figSuccess(btn) : figRearm(btn);
      } else {
        figRearm(btn);   // converted, but focus was lost mid-conversion — re-arm for a fresh-gesture write
      }
    } catch(e){ console.error('[figma]', e); figFail(btn); }
  }
  document.addEventListener('click', e=>{ const b = e.target.closest && e.target.closest('[data-figma-src]'); if (b){ e.preventDefault(); onFigmaClick(b); } });
  // Cache invalidates on navigation (a different page/state means the cached payload is stale).
  addEventListener('hashchange', ()=>{ figmaCache = null; });

  const capbtn = document.getElementById('capbtn');
  function syncCapBtn(){ capbtn.style.display = selected.size?'block':'none';
    capbtn.textContent = serverMode ? `Unlock ${selected.size} selected` : `Copy capture command (${selected.size})`; }
  capbtn.onclick = ()=>runCapture([...selected], capbtn);

  // server chrome (pill removed in v2 shell; guarded for safety)
  const sp=document.getElementById('server-pill');
  if (serverMode && sp){ sp.textContent='live · can unlock'; sp.classList.add('on'); }
  else if(sp) sp.textContent='static view';
  // F1 — "+ Capture again" opens a two-item menu (re-capture · guided). Renders in BOTH modes; the
  // guided item POSTs /api/guided/start in server mode and copies the command on file://. No third item.
  (function setupCaptureMenu(){
    const rb=document.getElementById('recapbtn'), menu=document.getElementById('recapmenu');
    if(!rb||!menu) return;
    rb.style.display='block'; rb.setAttribute('aria-haspopup','menu'); rb.setAttribute('aria-expanded','false');
    menu.innerHTML =
      `<button type="button" class="mi" role="menuitem" data-mi="recap"><b>Re-capture — refresh what's here</b></button>`+
      `<div class="midiv"></div>`+
      `<button type="button" class="mi" role="menuitem" data-mi="guided"><b>Guided capture — you drive, the kit records</b>`+
        `<span class="ex">A browser window opens on your logged-in profile. Go anywhere — the pill tells you what's new; every capture lands here.</span></button>`;
    const close=()=>{ menu.classList.remove('open'); menu.setAttribute('aria-hidden','true'); rb.setAttribute('aria-expanded','false'); };
    const open=()=>{ menu.classList.add('open'); menu.setAttribute('aria-hidden','false'); rb.setAttribute('aria-expanded','true');
      const r=rb.getBoundingClientRect(), w=menu.offsetWidth;
      menu.style.top=(r.bottom+8)+'px'; menu.style.left=Math.max(8, Math.min(r.right-w, innerWidth-w-8))+'px';
      const first=menu.querySelector('.mi'); if(first) first.focus(); };
    rb.onclick=(e)=>{ e.stopPropagation(); menu.classList.contains('open')?close():open(); };
    menu.addEventListener('click', e=>{ const b=e.target.closest('[data-mi]'); if(!b) return; const which=b.dataset.mi; close();
      if(which==='recap'){ if(serverMode){ mountOnboard(); showWizard(STATUS && STATUS.product); } else copyPrompt(PROMPTS.recaptureCheck()); }
      else if(which==='guided'){ launchGuided(); } });
    document.addEventListener('click', e=>{ if(!menu.contains(e.target) && e.target!==rb) close(); });
    document.addEventListener('keydown', e=>{ if(e.key==='Escape') close(); });
  })();
  // Resume a guided session already running on the server (kill-resilience across a dashboard reload).
  if (serverMode && STATUS && STATUS.guided && STATUS.guided.running){ guidedLive={ running:true, count:STATUS.guided.captures||0, lastCapture:STATUS.guided.lastCapture, capturing:!!STATUS.guided.capturing }; guidedStream(); }
  // FB1: "End session" on the live ledger entry (re-rendered often, so delegate).
  document.addEventListener('click', e=>{ if(e.target.closest && e.target.closest('[data-guided-end]')){ e.preventDefault(); endGuided(); } });
  syncCapBtn();

  // ═════════ READINESS CHIP + BREAKDOWN ═════════
  function renderReadiness(){
    const R = DASH.readiness; const chip=document.getElementById('readychip');
    if(!R || !chip) return;
    const ring=document.getElementById('ready-ring'), lab=document.getElementById('ready-label'), pop=document.getElementById('readypop');
    const full = R.score>=100;
    if(ring) ring.style.setProperty('--pct', R.score);
    // (v2.5.1 F5·5) the ring sweeps 0→value ONCE per load — a readiness score is a thing that was earned,
    // and the sweep says so. Guarded on a window flag, so a later re-render just sets the value.
    if(ring && !window.__rswept){ window.__rswept=true; ring.classList.add('sweep');
      ring.addEventListener('animationend', ()=>ring.classList.remove('sweep'), {once:true}); }
    chip.classList.toggle('quiet', full);
    // OPEN WORDING (flagged): ship "100% context ready" — the "context complete" alternative is a P3 call (PRD §2, ux-copy open q)
    lab.textContent = R.score + '% context ready';
    // F5: lead the popover with the top missing component ("next +N%: ‹label›")
    const gaps = R.components.filter(c=>c.earned < c.max).sort((a,b)=>(b.max-b.earned)-(a.max-a.earned));
    const top = gaps[0];
    const whisper = (!full && top) ? `<div class="rnext">next +${Math.round(top.max-top.earned)}%: ${esc(top.label.toLowerCase())}</div>` : '';
    // F3 — when states are the top gap, the whisper gains a real action: launch guided capture (the one
    // path that reaches button-only states), beside a copy-prompt chip for the URL-reachable case.
    const statesTop = (!full && top && top.key==='states');
    const action = statesTop
      ? `<div class="ract"><button type="button" class="gobtn" id="ready-guided">Launch guided capture</button>${pchip('Copy the add-a-state prompt', PROMPTS.addState(), true)}</div>` : '';
    pop.innerHTML = `<h4>Context readiness — ${R.score}%</h4>
      ${whisper}${action}
      <div class="pnote">A composite of how ready this library is as AI context — not surface coverage. <span class="ai" title="heuristic v1 weighting">heuristic</span></div>
      ${R.components.map(c=>`<div class="rcomp"><div class="rlab"><span>${esc(c.label)}</span><b>${c.earned} / ${c.max}</b></div>
        <div class="rbar"><i style="width:${Math.round(100*c.earned/Math.max(c.max,1))}%"></i></div>
        <div class="rdet">${esc(c.detail)}</div></div>`).join('')}`;
    chip.onclick=(e)=>{ e.stopPropagation(); pop.classList.toggle('open'); };
    document.addEventListener('click', e=>{ if(!pop.contains(e.target) && e.target!==chip) pop.classList.remove('open'); });
    const rg=document.getElementById('ready-guided'); if(rg) rg.onclick=(e)=>{ e.stopPropagation(); pop.classList.remove('open'); launchGuided(); };
  }

  // ═════════ HOME (atlas + ledger) + JOURNAL + PAGE DOC ═════════
  function fmtDate(iso){ if(!iso) return ''; try{ return new Date(iso).toLocaleDateString(undefined,{month:'short',day:'numeric'}); }catch{ return String(iso).slice(0,10); } }
  function fmtTime(iso){ try{ return new Date(iso).toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}); }catch{ return ''; } }
  function firstSlug(){ return (DATA.nodes.find(n=>n.kind!=='template')||DATA.nodes[0]||{}).id||'<slug>'; }

  function ledgerEntry(ev, compact, newest){
    const when = ev.dateOnly ? fmtDate(ev.at) : [fmtDate(ev.at), fmtTime(ev.at)].filter(Boolean).join(' · ');
    let link='';
    if(ev.link){ if(ev.link.page) link=`<button class="elink" data-goto="page/${esc(ev.link.page)}">open the page</button>`;
      else if(ev.link.tab){ const lbl=ev.link.tab==='map'?'open the map':ev.link.tab==='design'?'open Design language':'see what it wrote'; link=`<button class="elink" data-goto="${esc(ev.link.tab)}">${lbl}</button>`; } }
    let thumbs='';
    if(!compact && ev.kind==='capture'){ const t=DATA.nodes.filter(n=>n.screenshot).slice(0,5).map(n=>`<img src="${esc(n.screenshot)}" loading="lazy" alt="">`).join(''); if(t) thumbs=`<div class="thumbs">${t}</div>`; }
    // guided/hygiene events carry per-item detail lines (F4). Plain text only — a hygiene finding can
    // name a since-pruned page, so these are never links. Compact rail trims to 3; journal shows all.
    let dlines='';
    if(ev.detailLines && ev.detailLines.length){ const shown = compact ? ev.detailLines.slice(0,3) : ev.detailLines;
      const extra = (compact && ev.detailLines.length>3) ? `<li>…and ${ev.detailLines.length-3} more</li>` : '';
      dlines = `<ul class="edlines">${shown.map(l=>`<li>${esc(l)}</li>`).join('')}${extra}</ul>`; }
    // On the describe-run card, when new pages are waiting (e.g. after a guided session), offer the
    // top-up action right here too — not just in the next-slot hero.
    let chip='';
    if(ev.kind==='describe'){ const pend=DASH.pendingDescriptions||0;
      if(pend>0) chip=`<div class="chiprow" style="margin-top:8px">${pchip(`Describe the ${pend} new page${pend===1?'':'s'}`, PROMPTS.describeLibrary())}</div>`; }
    return `<div class="ent${newest?' newest':''}" data-actor="${esc(ev.actor)}"><div class="emeta">${esc(when)} · ${esc(ev.actor)}</div>
      <span class="etitle">${esc(ev.title)}</span>${ev.detail?`<div class="edetail">${esc(ev.detail)}</div>`:''}${dlines}${thumbs}${chip}${link}</div>`;
  }

  function nextSlot(){
    const R=DASH.readiness, pend=DASH.pendingDescriptions||0, I=DASH.identity;
    // F5 live loop: while a guided session runs, the next-slot IS the in-progress entry (SSE-updated).
    if(guidedLive && guidedLive.running){
      const cap = guidedLive.capturing;
      const title = cap ? `Capturing this page… · ${guidedLive.count} saved` : `Guided capture in progress — ${guidedLive.count} captured · the window is yours`;
      const detail = cap
        ? `Snapshotting the page you're on — big pages take a few seconds. The pill in the browser says “Capturing…” too.`
        : `Drive to any state in the browser window and click 📸 Capture. When you're done, ${IS_MAC?'press <b>⌘Q</b> to quit the browser':'fully quit the browser'} — just closing the window may leave it running.`;
      return `<div class="ent hero live" id="guided-live"><div class="emeta"><span class="livedot${cap?' hot':''}"></span>now · you</div>
        <span class="etitle">${title}</span>
        <div class="edetail">${detail}</div>
        ${serverMode?`<div class="chiprow"><button type="button" class="gobtn ghost" data-guided-end ${cap?'disabled title="Wait for this page to finish saving…"':''}>${cap?'Saving…':'End session &amp; save'}</button></div>`:''}</div>`;
    }
    if(R && R.score>=100)
      return `<div class="ent hero quiet"><div class="emeta">next · nothing waiting</div>
        <div class="edetail">Your library is complete and current. When your product ships something new, check for changes here — the ledger will tell you what moved.</div>
        <div class="chiprow">${pchip('Check for changes', PROMPTS.recaptureCheck())}</div></div>`;
    if(pend>0){
      // Context-aware: first-run (AI has never read the library) vs top-up (it has, but new pages —
      // e.g. from a guided session — are waiting). Same prompt fills only the pending ones either way.
      const everRead = (I.described||0) > 0;
      if(!everRead)
        return `<div class="ent hero"><div class="emeta">next · one move unlocks the rest</div>
          <span class="etitle">Give your AI this toolkit</span>
          <div class="edetail">One prompt, pasted into your AI chat — it reads all ${I.downloaded} pages, fills the captions, and this ledger records the run. A couple of minutes.</div>
          <div class="chiprow">${pchip('Copy the prompt', PROMPTS.describeLibrary())}</div></div>`;
      return `<div class="ent hero"><div class="emeta">next · new pages waiting</div>
        <span class="etitle">Let your AI read your ${pend} new page${pend===1?'':'s'}</span>
        <div class="edetail">You've captured ${pend} page${pend===1?'':'s'} since your AI last read the library. One prompt and it describes just the new one${pend===1?'':'s'} — this ledger records the run.</div>
        <div class="chiprow">${pchip('Copy the describe prompt', PROMPTS.describeLibrary())}</div></div>`;
    }
    return `<div class="ent hero"><div class="emeta">next · your AI knows your product now</div>
      <span class="etitle">Make your first thing</span>
      <div class="edetail">A wireframe on a real page, or a question answered from the library.</div>
      <div class="chiprow">${pchip('Copy a wireframe prompt', PROMPTS.wireframe(firstSlug()))}${pchip('Ask a question', PROMPTS.askQuestion(), true)}</div></div>`;
  }

  // ═════════ F4 (hygiene-speaks-designer) — the hygiene ledger card ═════════
  // Locked copy lives in prds/hygiene-speaks-designer.md §F4 (verbatim, also appended to ux-copy.md).
  // Source of truth: DASH.overview.hygiene — the SAME live runHygiene() findings (with F1's stable keys
  // + acknowledged flags) build-index.js computes every rebuild, never the historical hygiene.json snapshot.
  function pageLabelOf(slug){ const n = byId[slug]; return n ? dlabel(n) : slug; }
  // ‹A›/‹B› are page display labels, never slugs — the slug rides on the title attr for anyone who needs it.
  function pgspan(slug){ return `<span title="${esc(slug)}">${esc(pageLabelOf(slug))}</span>`; }
  function targetSpan(target){ const t = String(target||''); const i = t.indexOf(' › ');
    return i<0 ? pgspan(t) : `${pgspan(t.slice(0,i))} › ${esc(t.slice(i+3))}`; }
  function targetPlain(target){ const t = String(target||''); const i = t.indexOf(' › ');
    return i<0 ? pageLabelOf(t) : `${pageLabelOf(t.slice(0,i))} › ${t.slice(i+3)}`; }
  function andListHtml(items){ return items.length<2 ? (items[0]||'') : items.slice(0,-1).join(', ')+' and '+items[items.length-1]; }

  function hygieneFindingsAll(){
    const h = DASH.overview && DASH.overview.hygiene;
    if (!h || h.error) return [];
    return [...(h.duplicates||[]), ...(h.orphans||[]), ...(h.identicalStates||[]), ...(h.quality||[])];
  }
  function hygieneUnackedWarnCount(){ return hygieneFindingsAll().filter(x=>!x.acknowledged && x.severity==='warn').length; }

  // One row per UNACKED WARNING: {line (HTML), primary:{label,act,...data}, secondary?:{...}}. Info-level
  // and acknowledged findings never reach here — they collapse into the footer / are excluded (F1/F4).
  function hygRow(it){
    const A = pgspan;
    if (it.kind==='duplicate-content'){
      const names = it.pages.map(A);
      const line = names.length===2 ? `${names[0]} and ${names[1]} are the same capture twice.` : `${andListHtml(names)} are the same capture, more than once.`;
      return { line, primary:{ label:'Fold into one', act:'fold', key:it.key, rep:it.repSlug, members:it.members },
        secondary:{ label:'Keep both', act:'ack', key:it.key } };
    }
    if (it.kind==='same-template'){
      if (it.matchesRep && it.pages.length===1)
        return { line: `${A(it.pages[0])} uses the same layout as ${A(it.repSlug)} — one example can stand for both.`,
          primary:{ label:'Fold into one example', act:'fold', key:it.key, rep:it.repSlug, members:it.members, pattern:it.pattern },
          secondary:{ label:'Keep both', act:'ack', key:it.key } };
      const names = (it.matchesRep ? [...it.pages, it.repSlug] : it.pages).map(A);
      return { line: `${andListHtml(names)} share one layout — one example can stand for all of them.`,
        primary:{ label:'Fold into one example', act:'fold', key:it.key, rep:it.repSlug, members:it.members, pattern:it.pattern },
        secondary:{ label:'Keep them all', act:'ack', key:it.key } };
    }
    if (it.kind==='orphan')
      return { line: `Nothing links to ${A(it.page)} — the map can't show how you reach it.`,
        primary:{ label:'Say how you got there', act:'reached-by', key:it.key, slug:it.page } };
    if (it.kind==='identical-state'){
      if (it.variant==='vs-sibling')
        return { line: `“${esc(it.state)}” and “${esc(it.sibling)}” on ${A(it.page)} are the same view captured twice.`,
          primary:{ label:'Re-capture it', act:'recapture-state', key:it.key, slug:it.page },
          secondary:{ label:'Keep both', act:'ack', key:it.key } };
      return { line: `The state “${esc(it.state)}” on ${A(it.page)} looks identical to the page itself — the click may not have changed anything.`,
        primary:{ label:'Re-capture it', act:'recapture-state', key:it.key, slug:it.page },
        secondary:{ label:"It's fine — keep it", act:'ack', key:it.key } };
    }
    if (it.kind==='quality'){
      const slug = String(it.target||'').split(' › ')[0];
      const T = targetSpan(it.target);
      const byQ = {
        'near-empty':         { line:`${T} came back nearly empty — it may have been captured mid-load.`, sec:'It really looks like this' },
        'blob-images':        { line:`Some images on ${T} were live-only and didn't survive the capture.`, sec:'Keep as is' },
        'missing-screenshot': { line:`${T} has no screenshot.`, sec:null },
        'mid-render':         { line:`${T} may have been captured while still loading.`, sec:'Keep as is' },
      };
      const m = byQ[it.subKind]; if (!m) return null; // live-only-media is info-only, never a warning row
      const row = { line:m.line, primary:{ label:'Re-capture', act:'recapture-page', key:it.key, slug } };
      if (m.sec) row.secondary = { label:m.sec, act:'ack', key:it.key };
      return row;
    }
    return null;
  }
  // Info-level footer line — plain text, no buttons; a finding can name a since-pruned page, never a link.
  function hygInfoLine(it){
    if (it.kind==='duplicate-content' || it.kind==='same-template') return `${(it.pages||[]).map(pageLabelOf).join(', ')} — ${it.issue}`;
    if (it.kind==='orphan') return `${pageLabelOf(it.page)} — ${it.issue}`;
    if (it.kind==='identical-state') return `${pageLabelOf(it.page)} › ${it.state} — ${it.issue}`;
    if (it.kind==='quality') return `${targetPlain(it.target)} — ${it.issue}`;
    return it.issue || '';
  }
  // "Copy the fix prompt" (tertiary, every warning) — a precise, self-contained instruction for the
  // designer's AI, page URLs/slugs included: the machine surface when the button can't act live.
  function hygFixPrompt(it){
    if (!it) return '';
    const urlOf = (s) => { const n = byId[s]; return n ? pageUrl(n) : s; };
    if (it.kind==='duplicate-content')
      return `In this design-context library, ${it.pages.join(' and ')} (${it.pages.map(urlOf).join(', ')}) capture identical content (contentHash ${it.contentHash}). Fold them into one: run \`node -e "require('./tools/build-index.js')"\` after adding {rep:\"${it.repSlug}\", members:${JSON.stringify(it.members)}} to design-context/annotations.json's hygiene.folds (or POST /api/hygiene/fold on the running dashboard server), then run \`node tools/build-index.js\`.`;
    if (it.kind==='same-template')
      return `In this design-context library, ${it.pages.join(', ')} (pattern \`${it.pattern}\`) share the same layout as representative \`${it.repSlug}\`. Fold ${it.members.join(', ')} into ${it.repSlug}: add {rep:\"${it.repSlug}\", members:${JSON.stringify(it.members)}, pattern:\"${it.pattern}\"} to design-context/annotations.json's hygiene.folds (or POST /api/hygiene/fold on the running dashboard server), then run \`node tools/build-index.js\`.`;
    if (it.kind==='orphan')
      return `In this design-context library, \`${it.page}\` (${it.route}) has no inbound link from any captured page. If you know how a person reaches it, set design-context/annotations.json → pages[\"${it.page}\"].reachedBy = \"<how you get there>\" (or POST /api/reached-by {slug:\"${it.page}\", note}), then run \`node tools/build-index.js\`. Otherwise link it from its logical parent page.`;
    if (it.kind==='identical-state')
      return `In this design-context library, page \`${it.page}\`'s state "${it.state}" is ${it.variant==='vs-sibling'?`identical to sibling state "${it.sibling}"`:'identical to the base page'} — the captured interaction likely didn't change the view. Re-capture it: \`node tools/capture.js --guided --url "${urlOf(it.page)}"\`, driving to the real "${it.state}" state.`;
    if (it.kind==='quality'){
      const slug = String(it.target||'').split(' › ')[0];
      return `In this design-context library, ${it.target} has a capture-quality issue: ${it.issue}. Re-capture it: \`node tools/capture.js --urls "${urlOf(slug)}"\`, or if the capture is actually correct, note why in design-context/annotations.json.`;
    }
    return it.issue || '';
  }
  function hygBtnHtml(b, primary){
    const attrs = Object.entries(b).filter(([k])=>k!=='label'&&k!=='act')
      .map(([k,v])=>`data-hyg-${k}="${esc(Array.isArray(v)?v.join(','):v)}"`).join(' ');
    return `<button type="button" class="btn${primary?' primary':''}" data-hyg-act="${esc(b.act)}" ${attrs}>${esc(b.label)}</button>`;
  }
  function hygieneCardHtml(){
    const unacked = hygieneFindingsAll().filter(x=>!x.acknowledged);
    const rows = unacked.filter(x=>x.severity==='warn').map(it=>({it,row:hygRow(it)})).filter(x=>x.row);
    const infos = unacked.filter(x=>x.severity!=='warn');
    const N = rows.length;
    const title = N>0 ? `Worth a look — ${N} thing${N===1?'':'s'} in the library` : 'Library check — all clean';
    const body = rows.map(({it,row})=>{
      let noterow = '';
      if (serverMode && row.primary.act==='reached-by')
        noterow = `<div class="hygnoterow" data-hyg-noterow="${esc(it.key)}"><input type="text" placeholder="e.g. from the account menu" data-hyg-note="${esc(it.key)}">
          <button type="button" class="btn primary" data-hyg-act="reached-by-confirm" data-hyg-key="${esc(it.key)}" data-hyg-slug="${esc(it.page)}">Done</button></div>`;
      else if (serverMode && row.secondary && row.secondary.act==='ack')
        noterow = `<div class="hygnoterow" data-hyg-noterow="${esc(it.key)}"><input type="text" placeholder="Why keep it? (optional — your AI reads this)" data-hyg-note="${esc(it.key)}">
          <button type="button" class="btn primary" data-hyg-act="ack-confirm" data-hyg-key="${esc(it.key)}">Done</button></div>`;
      return `<div class="hygfinding" data-hyg-finding="${esc(it.key)}">
        <div class="hygline">${row.line}</div>
        <div class="hygbtns">
          ${serverMode ? hygBtnHtml(row.primary, true) : ''}
          ${serverMode && row.secondary ? hygBtnHtml(row.secondary, false) : ''}
          <button type="button" class="lnk" data-hyg-act="fixprompt" data-hyg-key="${esc(it.key)}">Copy the fix prompt</button>
        </div>
        ${noterow}
      </div>`;
    }).join('');
    const footItems = infos.map(it=>`<li>${esc(hygInfoLine(it))}</li>`).join('');
    const foot = infos.length ? `<details class="hygfoot"><summary>${infos.length} more note${infos.length===1?'':'s'} — nothing needed from you</summary><ul>${footItems}</ul></details>` : '';
    const fileHint = serverMode ? '' : `<div class="hygfilehint">Fixes need the kit's server — run <code>tools/start.sh</code></div>`;
    return `<div class="ent hero" id="hygcard"><div class="emeta">the kit</div>
      <span class="etitle">${esc(title)}</span>
      ${body}${foot}${fileHint}
    </div>`;
  }
  function wireHygieneCard(root){
    const card = root.querySelector('#hygcard'); if (!card) return;
    card.addEventListener('click', async (e)=>{
      const b = e.target.closest('[data-hyg-act]'); if (!b) return;
      const act = b.getAttribute('data-hyg-act'), key = b.getAttribute('data-hyg-key');
      if (act==='fixprompt'){ copyPrompt(hygFixPrompt(hygieneFindingsAll().find(x=>x.key===key))); return; }
      if (act==='ack' || act==='reached-by'){
        const row = card.querySelector(`[data-hyg-noterow="${CSS.escape(key)}"]`);
        if (row){ row.classList.add('open'); row.querySelector('input').focus(); }
        return;
      }
      if (act==='ack-confirm'){
        const note = card.querySelector(`input[data-hyg-note="${CSS.escape(key)}"]`).value.trim();
        b.disabled = true; toast('Noting it…', true);
        const r = await api('/api/hygiene/ack', { key, note: note || null });
        if (r.ok) location.reload(); else { toast('Failed: '+r.error); b.disabled = false; }
        return;
      }
      if (act==='reached-by-confirm'){
        const note = card.querySelector(`input[data-hyg-note="${CSS.escape(key)}"]`).value.trim();
        if (!note) return toast('Say how you reach it — a word or two is enough');
        b.disabled = true; toast('Noting it…', true);
        const r = await api('/api/reached-by', { slug: b.getAttribute('data-hyg-slug'), note });
        if (r.ok) location.reload(); else { toast('Failed: '+r.error); b.disabled = false; }
        return;
      }
      if (act==='fold'){
        const rep = b.getAttribute('data-hyg-rep');
        const members = (b.getAttribute('data-hyg-members')||'').split(',').filter(Boolean);
        const pattern = b.getAttribute('data-hyg-pattern') || null;
        b.disabled = true; toast('Folding into one example…', true);
        const r = await api('/api/hygiene/fold', { rep, members, pattern, key });
        if (r.ok) location.reload(); else { toast('Failed: '+r.error); b.disabled = false; }
        return;
      }
      if (act==='recapture-page'){ runCapture([pageUrl(byId[b.getAttribute('data-hyg-slug')])], b); return; }
      if (act==='recapture-state'){ toast("You'll drive — the kit records.", true); launchGuided(pageUrl(byId[b.getAttribute('data-hyg-slug')])); return; }
    });
  }

  function renderHome(){
    // F3 (hygiene-speaks-designer): a folded member drops its own atlas card — the rep's card carries it
    // ("stands for N" via the existing template badge below). byId still holds every node unfiltered, so
    // a direct link to a folded member's page doc (from the rep's "folded into this" list) still resolves.
    const I=DASH.identity, pend=DASH.pendingDescriptions||0, nodes=DATA.nodes.filter(n=>!n.foldedInto);
    const described=nodes.filter(n=>!n.descPending), templates=nodes.filter(n=>n.kind==='template');
    const withStates=nodes.filter(n=>(n.states||[]).some(s=>s.captured));
    const subtitle = pend>0 ? `${I.name} — ${I.downloaded} pages, as they really look` : `${I.name} — ${I.downloaded} pages, all described`;
    const ghostsShown = DATA.frontier.slice().sort((a,b)=>(b.inboundCount||0)-(a.inboundCount||0)).slice(0,2);
    const ghostShownCount = ghostsShown.reduce((s,f)=>s+(f.count||1),0);
    const overflowN = Math.max(0, lockedTotal - ghostShownCount);
    // atlas cards no longer navigate (F1): hover = peek, click = panel; data-card holds the slug
    // (v2.4.1 §2.2) card face = screenshot + one title line + a 2-line description, nothing else.
    // The mono route line moved off the face; it still leads the rail panel and the page doc.
    const cardHtml = (n)=>`<button class="pg" data-card="${esc(n.id)}" title="${esc(n.route||'')}">

    // adaptive filter chips (F5): pre-AI foregrounds Described; post-AI drops the redundant Described=All and adds Without states

    const pad2 = (x)=>String(x).padStart(2,'0');

    if (pend===0) filters.push(`<button class="filt" data-filt="without">Without states (${pad2(nodes.length-withStates.length)})</button>`);
    filters.push(`<button class="filt" data-goto="map">Locked (${pad2(lockedTotal)})</button>`);
    // (v2.4.1 §1) the header BAND: tile + title + full-measure description on one row, then the stats
    // row left-aligned beneath it — label on top, mono value under. Body (filters + atlas) below the rule.
    const fact = (label, value)=>`<div><div class="fl">${esc(label)}</div><div class="fv">${esc(value)}</div></div>`;
    document.getElementById('pane-home').innerHTML = `<div class="homecols">
      <div class="gridwrap">

          </div>

            ${fact('captured · current', fmtDate(I.capturedAt))}

        <div class="hbody">
          <div class="filters">${filters.join('')}</div>
          <div class="atlas" id="atlas">${nodes.map(cardHtml).join('')}${ghostsShown.map(ghostHtml).join('')}${overflow}</div>
        </div>

      <aside class="rail" id="homerail"></aside>

    renderRail();
    const atlas=document.getElementById('atlas');

    // F1 ladder on the atlas: hover/focus = peek, click = in-context panel
    atlas.addEventListener('mouseover', e=>{ const c=e.target.closest('.pg[data-card]'); if(c){ const n=byId[c.dataset.card]; if(n) showPeek(n, e.clientX, e.clientY); } });
    atlas.addEventListener('mousemove', e=>{ if(peekEl.classList.contains('open')) positionPeek(e.clientX, e.clientY); });
    atlas.addEventListener('mouseout', e=>{ if(e.target.closest('.pg[data-card]')) hidePeek(); });
    atlas.querySelectorAll('.pg[data-card]').forEach(c=>{
      c.onclick=()=>{ const n=byId[c.dataset.card]; if(n) selectPage(n); };
      c.addEventListener('focus', ()=>{ const n=byId[c.dataset.card]; const r=c.getBoundingClientRect(); if(n) showPeek(n, r.right-40, r.top); });
      c.addEventListener('blur', hidePeek);
    });
    document.querySelectorAll('#pane-home .filt[data-filt]').forEach(b=>b.onclick=()=>{
      document.querySelectorAll('#pane-home .filt[data-filt]').forEach(x=>x.classList.toggle('on', x===b));
      const f=b.dataset.filt;
      atlas.querySelectorAll('.pg').forEach(c=>{
        if(c.classList.contains('locked')){ c.style.display = f==='all'?'':'none'; return; }

        else if(f==='states') show=n&&(n.states||[]).some(s=>s.captured);
        else if(f==='without') show=n&&!(n.states||[]).some(s=>s.captured);
        c.style.display=show?'':'none'; });
    });
  }

  function journalFeed(filter){

    const match=(a)=> filter==='all' || (filter==='you'&&a==='you') || (filter==='kit'&&a==='the kit') || (filter==='ai'&&a==='your AI');
