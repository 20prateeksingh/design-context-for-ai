  document.getElementById('zfitbtn').onclick=resetView;
  function resetView(){ mapView.zoom=1; mapView.panX=0; mapView.panY=0; applyMapView(); }

  function resize(){ computeLayout(); renderWorld(); applyMapView(); }
  function fit(){ resize(); }
  addEventListener('resize', ()=>{ if(document.getElementById('pane-map').classList.contains('active')) resize(); });

  function openPanel(n){ activeNode=n; const el=document.getElementById('panel-body');
    if (n.locked){
      const urls = n.urls || [n.url];
      el.innerHTML = `<h2>Locked — not downloaded yet</h2>
        <div class="route">${esc(n.pattern||'')}</div>
        <div class="desc">${n.kind==='frontier-group' ? `<b>${n.count}</b> discovered pages share this URL shape.` : 'Discovered during capture, not downloaded.'}
        ${n.via&&n.via.length?`<br><span class="meta">found on: ${n.via.slice(0,4).map(esc).join(', ')}</span>`:''}</div>
        <div class="chiprow" style="margin:10px 0">${pchip("Ask your AI what's worth unlocking", PROMPTS.whatsMissing(), true)}</div>
        <h3>Pick pages to unlock ${n.count>urls.length?`(showing ${urls.length} of ${n.count})`:''}</h3>
        ${urls.map(u=>`<label class="urlrow"><input type="checkbox" data-u="${esc(u)}" ${selected.has(u)?'checked':''}>
          <span class="u">${esc(decodeURIComponent(u).replace(/^https?:\/\/[^/]+/,''))}<small>${esc(u.split('/')[2]||'')}</small></span></label>`).join('')}
        <div style="margin-top:10px"><button class="btn" id="selall">Select all shown</button></div>`;
      el.querySelectorAll('input[data-u]').forEach(cb=>cb.onchange=()=>{ cb.checked?selected.add(cb.dataset.u):selected.delete(cb.dataset.u); n.someSelected=[...selected].some(u=>urls.includes(u)); syncCapBtn(); });
      el.querySelector('#selall').onclick=()=>{ urls.forEach(u=>selected.add(u)); n.someSelected=true; openPanel(n); syncCapBtn(); };
    } else {
      const when = n.capturedAt ? new Date(n.capturedAt).toLocaleString() : '—';
      const depthTxt = n.clickDepth==null ? 'not linked from home' : `${n.clickDepth} click${n.clickDepth===1?'':'s'} from home`;
      el.innerHTML = `<h2>${esc(dlabel(n))}</h2>
        <div class="route">${esc(n.route)}</div>
        ${n.screenshot?`<a href="${esc(n.screenshot)}" target="_blank" aria-label="open full screenshot">${img2(n.screenshot,'pshot')}</a>`:''}
        <div class="meta">downloaded ${when}${n.standsFor?` · stands for <b>${n.standsFor}</b> pages`:''} · linked from ${n.inboundCount||0} · ${depthTxt}</div>
        <div class="desc">${n.descPending?'<span class="meta">— caption dormant, waiting for your AI</span>':esc(n.desc||'')} ${n.descPending?'':'<span class="ai" title="model-written orientation, not extracted fact">ai</span>'}</div>
        <button class="btn primary" id="pnl-expand" style="width:100%;margin-top:12px">Expand ↗ Open the full page doc</button>
        <div class="chiprow" style="margin-top:10px">${pchip('Wireframe on this page', PROMPTS.wireframe(n.id))}${n.descPending ? pchip('Describe this page', PROMPTS.describeLibrary(), true) : pchip('Ask about this page', PROMPTS.askQuestion(), true)}</div>
        <div class="links" style="margin-top:8px;font-size:12px"><a href="${esc(n.pageHtml)}" target="_blank">open HTML</a> · <a href="${esc(n.pageMd)}" target="_blank">screen doc</a></div>
        ${n.notes?`<h3>Designer notes</h3><div class="desc">${esc(n.notes)}</div>`:''}
        <h3>States</h3>
        ${(n.states||[]).map(s=>`<div class="state"><span>${esc(s.name)}</span><span class="tag ${s.captured?'':'pending'}">${s.captured?'captured':'pending'}</span></div>`).join('') || '<div class="meta">none recorded</div>'}
        <div id="stateform" style="margin-top:8px">
          <input id="st-name" placeholder="state name (e.g. empty, error)" aria-label="state name">
          <input id="st-url" placeholder="URL that shows this state" aria-label="state url">
          <button class="btn primary" id="st-add">Add &amp; download state</button>
          <div class="meta" style="margin-top:4px">States you can reach by URL (filters, #modal=…, ?tab=…). Others need the guided pass.</div>
          <button class="guidedlink" id="st-guided" data-url="${esc(pageUrl(n))}">Can't reach it by URL? Guided capture</button>
        </div>`;
      wireThumbs(el);
      el.querySelector('#pnl-expand').onclick=()=>openFullDoc(n.id);
      { const g=el.querySelector('#st-guided'); if(g) g.onclick=()=>launchGuided(g.dataset.url); }
      el.querySelector('#st-add').onclick=async()=>{ const name=el.querySelector('#st-name').value.trim(), url=el.querySelector('#st-url').value.trim();
        if(!name||!url) return toast('Give the state a name and a URL');
        if (serverMode){ toast('Capturing state — watch the browser window…', true);
          const r = await api('/api/state',{slug:n.id,name,url}); r.ok ? location.reload() : toast('Failed: '+r.error); }
        else toast(`Run: node tools/capture.js --state ${n.id}:${name} --url "${url}"`); };
    }
    document.getElementById('panel').classList.add('open');
  }
  window.closePanel = function(){ document.getElementById('panel').classList.remove('open'); activeNode=null; };
  // F1: expand → full doc, recording provenance (and the map node to reopen on return)
  function openFullDoc(slug){ const onMap = document.getElementById('pane-map').classList.contains('active');
    pageOrigin = onMap ? 'map' : 'home'; if (onMap) mapReopen = slug;
    window.closePanel(); location.hash = 'page/' + slug; }

  // ═════════ GUIDED CAPTURE (F1/F2/F3 launch · F5 live loop · file:// degrade) ═════════
  // The full product URL for a page node (map nodes carry route, not the absolute URL).
  function pageUrl(n){ const o=(DATA.origin||'').replace(/\/+$/,''); return o + (n && n.route ? n.route : '/'); }
  // file:// fallback command — prompts-are-the-UI, same shape as v2's cd chip.
  function guidedCmd(startUrl){ return `node tools/capture.js --guided --url "${startUrl || (DATA.origin||'<product URL>')}"`; }
  // Launch a guided session. Server mode → POST; file:// → copy the command (handled at the call site
  // via copyGuidedCmd). Returns silently; the live loop is driven by guidedStream().
  async function launchGuided(startUrl){
    // F1/F3 pass no URL → start at the product's own origin (validation workspaces have no product.json
    // for the server to fall back to). F2 passes the specific page URL.
    const u = startUrl || DATA.origin || '';
    if(!serverMode) return copyGuidedCmd(u);
    const r = await api('/api/guided/start', u?{startUrl:u}:{});
    if(!r.ok){ toast(r.error || 'Another capture is running — finish or stop it first.'); return; }
    guidedLive = { running:true, count:0, lastCapture:null, capturing:false };
    paintGuidedLive();
    guidedStream();
  }
  function copyGuidedCmd(startUrl){ const cmd=guidedCmd(startUrl);
    (navigator.clipboard?navigator.clipboard.writeText(cmd):Promise.reject())
      .then(()=>toast('Command copied — paste it in your terminal (or ask your AI to run it)'))
      .catch(()=>{ try{ prompt('Run this in the terminal:', cmd); }catch(_){} }); }
  // End a running guided session from the dashboard (FB1) — the server SIGTERMs capture.js, which
  // closes its browser cleanly and still writes the session + hygiene artifacts. guided-done reloads us.
  async function endGuided(){
    if(guidedLive && guidedLive.capturing){ toast('A page is still saving — one moment…'); return; }  // CTA is disabled here anyway
    toast('Ending the guided session…', true);
    const r = await api('/api/guided/stop', {});
    if(!r || !r.ok) toast('Could not end the session: ' + ((r&&r.error)||'unknown') + ' — if it says “unknown endpoint”, restart tools/map.js (the server predates this feature).');
    // success path: the guided-done SSE event (or poll) drives the rebuild + reload.
  }
  // Live in-progress entry: sticky toast + (if home is showing) the ledger's next-slot updates.
  function paintGuidedLive(){
    const cnt = guidedLive ? guidedLive.count : 0;
    toast(guidedLive && guidedLive.capturing ? `Capturing this page… · ${cnt} saved so far` : `Guided capture in progress — ${cnt} captured · the window is yours`, true);
    if(document.getElementById('pane-home').classList.contains('active')) renderHome();
  }
  // SSE primary (namespaced "guided"/"guided-done"), polling fallback — mirrors attachStream().
  function guidedStream(){
    let done=false;
    const finish=(d)=>{ if(done) return; done=true; guidedLive=null;
      if(d && d.error){                                   // launch failed (usually a locked profile) — say why, don't reload into nothing
        toast('Guided capture couldn’t start: ' + d.error, true);
        if(document.getElementById('pane-home').classList.contains('active')) renderHome();
        return;
      }
      toast('Guided session ended — rebuilding your library…', true);
      setTimeout(()=>{ location.hash=''; location.reload(); }, 900); };
    const update=(p)=>{ if(!p) return; guidedLive={ running:!!p.running, count:p.captures||0, lastCapture:p.lastCapture, capturing:!!p.capturing };
      if(!p.running) return finish(p); paintGuidedLive(); };
    const poll=async()=>{ for(;;){ if(done) return;
      const s=await fetch('/api/guided/status').then(x=>x.json()).catch(()=>null);
      if(s){ update(s); if(!s.running) return; } await sleep(1200); } };
    if(typeof EventSource==='undefined') return poll();
    let es; try{ es=new EventSource('/api/capture/events'); }catch(_){ return poll(); }
    es.addEventListener('guided', e=>{ let p={}; try{p=JSON.parse(e.data);}catch(_){} update(p); });
    es.addEventListener('guided-done', e=>{ let d={}; try{d=JSON.parse(e.data);}catch(_){} try{es.close();}catch(_){} finish(d); });
    es.onerror=()=>{ if(done) return; try{es.close();}catch(_){} poll(); };
  }

  const capbtn = document.getElementById('capbtn');
  function syncCapBtn(){ capbtn.style.display = selected.size?'block':'none';
    capbtn.textContent = serverMode ? `Unlock ${selected.size} selected` : `Copy capture command (${selected.size})`; }
  capbtn.onclick = async ()=>{
    const urls=[...selected];
    if (serverMode){ capbtn.disabled=true; toast(`Capturing ${urls.length} page(s) — watch the browser window…`, true);
      const r = await api('/api/capture',{urls}); if (r.ok) location.reload(); else { toast('Failed: '+r.error); capbtn.disabled=false; } }
    else { const cmd = `node tools/capture.js --urls "${urls.join(',')}"`;
      try { await navigator.clipboard.writeText(cmd); toast('Command copied — paste it in your terminal (or ask your AI to run it)'); }
      catch(_){ prompt('Run this in the terminal:', cmd); } }
  };

  // server chrome (pill removed in v2 shell; guarded for safety)
  const sp=document.getElementById('server-pill');
  if (serverMode && sp){ sp.textContent='live · can unlock'; sp.classList.add('on'); }
  else if(sp) sp.textContent='static view';
  // F1 — "+ Capture again" opens a two-item menu (re-capture · guided). Renders in BOTH modes; the
  // guided item POSTs /api/guided/start in server mode and copies the command on file://. No third item.
  (function setupCaptureMenu(){
    const rb=document.getElementById('recapbtn'), menu=document.getElementById('recapmenu');
    if(!rb||!menu) return;
    rb.style.display='block'; rb.setAttribute('aria-haspopup','menu'); rb.setAttribute('aria-expanded','false');
    menu.innerHTML =
      `<button type="button" class="mi" role="menuitem" data-mi="recap"><b>Re-capture — refresh what's here</b></button>`+
      `<div class="midiv"></div>`+
      `<button type="button" class="mi" role="menuitem" data-mi="guided"><b>Guided capture — you drive, the kit records</b>`+
        `<span class="ex">A browser window opens on your logged-in profile. Go anywhere — the pill tells you what's new; every capture lands here.</span></button>`;
    const close=()=>{ menu.classList.remove('open'); menu.setAttribute('aria-hidden','true'); rb.setAttribute('aria-expanded','false'); };
    const open=()=>{ menu.classList.add('open'); menu.setAttribute('aria-hidden','false'); rb.setAttribute('aria-expanded','true');
      const r=rb.getBoundingClientRect(), w=menu.offsetWidth;
      menu.style.top=(r.bottom+8)+'px'; menu.style.left=Math.max(8, Math.min(r.right-w, innerWidth-w-8))+'px';
      const first=menu.querySelector('.mi'); if(first) first.focus(); };
    rb.onclick=(e)=>{ e.stopPropagation(); menu.classList.contains('open')?close():open(); };
    menu.addEventListener('click', e=>{ const b=e.target.closest('[data-mi]'); if(!b) return; const which=b.dataset.mi; close();
      if(which==='recap'){ if(serverMode){ mountOnboard(); showWizard(STATUS && STATUS.product); } else copyPrompt(PROMPTS.recaptureCheck()); }
      else if(which==='guided'){ launchGuided(); } });
    document.addEventListener('click', e=>{ if(!menu.contains(e.target) && e.target!==rb) close(); });
    document.addEventListener('keydown', e=>{ if(e.key==='Escape') close(); });
  })();
  // Resume a guided session already running on the server (kill-resilience across a dashboard reload).
  if (serverMode && STATUS && STATUS.guided && STATUS.guided.running){ guidedLive={ running:true, count:STATUS.guided.captures||0, lastCapture:STATUS.guided.lastCapture, capturing:!!STATUS.guided.capturing }; guidedStream(); }
  // FB1: "End session" on the live ledger entry (re-rendered often, so delegate).
  document.addEventListener('click', e=>{ if(e.target.closest && e.target.closest('[data-guided-end]')){ e.preventDefault(); endGuided(); } });
  syncCapBtn();

  // ═════════ READINESS CHIP + BREAKDOWN ═════════
  function renderReadiness(){
    const R = DASH.readiness; const chip=document.getElementById('readychip');
    if(!R || !chip) return;
    const ring=document.getElementById('ready-ring'), lab=document.getElementById('ready-label'), pop=document.getElementById('readypop');
    const full = R.score>=100;
    if(ring) ring.style.setProperty('--pct', R.score);
    chip.classList.toggle('quiet', full);
    // OPEN WORDING (flagged): ship "100% context ready" — the "context complete" alternative is a P3 call (PRD §2, ux-copy open q)
    lab.textContent = R.score + '% context ready';
    // F5: lead the popover with the top missing component ("next +N%: ‹label›")
    const gaps = R.components.filter(c=>c.earned < c.max).sort((a,b)=>(b.max-b.earned)-(a.max-a.earned));
    const top = gaps[0];
    const whisper = (!full && top) ? `<div class="rnext">next +${Math.round(top.max-top.earned)}%: ${esc(top.label.toLowerCase())}</div>` : '';
    // F3 — when states are the top gap, the whisper gains a real action: launch guided capture (the one
    // path that reaches button-only states), beside a copy-prompt chip for the URL-reachable case.
    const statesTop = (!full && top && top.key==='states');
    const action = statesTop
      ? `<div class="ract"><button type="button" class="gobtn" id="ready-guided">Launch guided capture</button>${pchip('Copy the add-a-state prompt', PROMPTS.addState(), true)}</div>` : '';
    pop.innerHTML = `<h4>Context readiness — ${R.score}%</h4>
      ${whisper}${action}
      <div class="pnote">A composite of how ready this library is as AI context — not surface coverage. <span class="ai" title="heuristic v1 weighting">heuristic</span></div>
      ${R.components.map(c=>`<div class="rcomp"><div class="rlab"><span>${esc(c.label)}</span><b>${c.earned} / ${c.max}</b></div>
        <div class="rbar"><i style="width:${Math.round(100*c.earned/Math.max(c.max,1))}%"></i></div>
        <div class="rdet">${esc(c.detail)}</div></div>`).join('')}`;
    chip.onclick=(e)=>{ e.stopPropagation(); pop.classList.toggle('open'); };
    document.addEventListener('click', e=>{ if(!pop.contains(e.target) && e.target!==chip) pop.classList.remove('open'); });
    const rg=document.getElementById('ready-guided'); if(rg) rg.onclick=(e)=>{ e.stopPropagation(); pop.classList.remove('open'); launchGuided(); };
  }

  // ═════════ HOME (atlas + ledger) + JOURNAL + PAGE DOC ═════════
  function fmtDate(iso){ if(!iso) return ''; try{ return new Date(iso).toLocaleDateString(undefined,{month:'short',day:'numeric'}); }catch{ return String(iso).slice(0,10); } }
  function fmtTime(iso){ try{ return new Date(iso).toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}); }catch{ return ''; } }
  function firstSlug(){ return (DATA.nodes.find(n=>n.kind!=='template')||DATA.nodes[0]||{}).id||'<slug>'; }

  function ledgerEntry(ev, compact){
    const when = ev.dateOnly ? fmtDate(ev.at) : [fmtDate(ev.at), fmtTime(ev.at)].filter(Boolean).join(' · ');
    let link='';
    if(ev.link){ if(ev.link.page) link=`<button class="elink" data-goto="page/${esc(ev.link.page)}">open the page</button>`;
      else if(ev.link.tab){ const lbl=ev.link.tab==='map'?'open the map':ev.link.tab==='design'?'open Design language':'see what it wrote'; link=`<button class="elink" data-goto="${esc(ev.link.tab)}">${lbl}</button>`; } }
    let thumbs='';
    if(!compact && ev.kind==='capture'){ const t=DATA.nodes.filter(n=>n.screenshot).slice(0,5).map(n=>`<img src="${esc(n.screenshot)}" loading="lazy" alt="">`).join(''); if(t) thumbs=`<div class="thumbs">${t}</div>`; }
    // guided/hygiene events carry per-item detail lines (F4). Plain text only — a hygiene finding can
    // name a since-pruned page, so these are never links. Compact rail trims to 3; journal shows all.
    let dlines='';
    if(ev.detailLines && ev.detailLines.length){ const shown = compact ? ev.detailLines.slice(0,3) : ev.detailLines;
      const extra = (compact && ev.detailLines.length>3) ? `<li>…and ${ev.detailLines.length-3} more</li>` : '';
      dlines = `<ul class="edlines">${shown.map(l=>`<li>${esc(l)}</li>`).join('')}${extra}</ul>`; }
    // On the describe-run card, when new pages are waiting (e.g. after a guided session), offer the
    // top-up action right here too — not just in the next-slot hero.
    let chip='';
    if(ev.kind==='describe'){ const pend=DASH.pendingDescriptions||0;
      if(pend>0) chip=`<div class="chiprow" style="margin-top:8px">${pchip(`Describe the ${pend} new page${pend===1?'':'s'}`, PROMPTS.describeLibrary())}</div>`; }
    return `<div class="ent" data-actor="${esc(ev.actor)}"><div class="emeta">${esc(when)} · ${esc(ev.actor)}</div>
      <span class="etitle">${esc(ev.title)}</span>${ev.detail?`<div class="edetail">${esc(ev.detail)}</div>`:''}${dlines}${thumbs}${chip}${link}</div>`;
  }

  function nextSlot(){
    const R=DASH.readiness, pend=DASH.pendingDescriptions||0, I=DASH.identity;
    // F5 live loop: while a guided session runs, the next-slot IS the in-progress entry (SSE-updated).
    if(guidedLive && guidedLive.running){
      const cap = guidedLive.capturing;
      const title = cap ? `Capturing this page… · ${guidedLive.count} saved` : `Guided capture in progress — ${guidedLive.count} captured · the window is yours`;
      const detail = cap
        ? `Snapshotting the page you're on — big pages take a few seconds. The pill in the browser says “Capturing…” too.`
        : `Drive to any state in the browser window and click 📸 Capture. When you're done, ${IS_MAC?'press <b>⌘Q</b> to quit the browser':'fully quit the browser'} — just closing the window may leave it running.`;
      return `<div class="ent hero live" id="guided-live"><div class="emeta"><span class="livedot${cap?' hot':''}"></span>now · you</div>
        <span class="etitle">${title}</span>
        <div class="edetail">${detail}</div>
        ${serverMode?`<div class="chiprow"><button type="button" class="gobtn ghost" data-guided-end ${cap?'disabled title="Wait for this page to finish saving…"':''}>${cap?'Saving…':'End session &amp; save'}</button></div>`:''}</div>`;
    }
    if(R && R.score>=100)
      return `<div class="ent hero quiet"><div class="emeta">next · nothing waiting</div>
        <div class="edetail">Your library is complete and current. When your product ships something new, check for changes here — the ledger will tell you what moved.</div>
        <div class="chiprow">${pchip('Check for changes', PROMPTS.recaptureCheck())}</div></div>`;
    if(pend>0){
      // Context-aware: first-run (AI has never read the library) vs top-up (it has, but new pages —
      // e.g. from a guided session — are waiting). Same prompt fills only the pending ones either way.
      const everRead = (I.described||0) > 0;
      if(!everRead)
        return `<div class="ent hero"><div class="emeta">next · one move unlocks the rest</div>
          <span class="etitle">Give your AI this toolkit</span>
          <div class="edetail">One prompt, pasted into your AI chat — it reads all ${I.downloaded} pages, fills the captions, and this ledger records the run. A couple of minutes.</div>
          <div class="chiprow">${pchip('Copy the prompt', PROMPTS.describeLibrary())}</div></div>`;
      return `<div class="ent hero"><div class="emeta">next · new pages waiting</div>
        <span class="etitle">Let your AI read your ${pend} new page${pend===1?'':'s'}</span>
        <div class="edetail">You've captured ${pend} page${pend===1?'':'s'} since your AI last read the library. One prompt and it describes just the new one${pend===1?'':'s'} — this ledger records the run.</div>
        <div class="chiprow">${pchip('Copy the describe prompt', PROMPTS.describeLibrary())}</div></div>`;
    }
    return `<div class="ent hero"><div class="emeta">next · your AI knows your product now</div>
      <span class="etitle">Make your first thing</span>
      <div class="edetail">A wireframe on a real page, or a question answered from the library.</div>
      <div class="chiprow">${pchip('Copy a wireframe prompt', PROMPTS.wireframe(firstSlug()))}${pchip('Ask a question', PROMPTS.askQuestion(), true)}</div></div>`;
  }

  function ledgerRail(){
    const evs = DASH.events.slice().reverse().slice(0,5);
    return `<aside class="rail">
      <div class="railh">The ledger — everything that happens here</div>
      <div class="led">
        ${nextSlot()}
        ${evs.map(e=>ledgerEntry(e,true)).join('')}
        <div class="ent future"><div class="emeta">someday · the kit</div><span class="etitle">Drift checks land here</span><div class="edetail">"3 pages changed — review side by side"</div></div>
      </div>
      <div class="railfoot">every capture, read, and design run is appended · <button class="elink" data-goto="journal">full journal</button></div>
    </aside>`;
  }

  function renderHome(){
    const I=DASH.identity, pend=DASH.pendingDescriptions||0, nodes=DATA.nodes;
    const described=nodes.filter(n=>!n.descPending), templates=nodes.filter(n=>n.kind==='template');
    const withStates=nodes.filter(n=>(n.states||[]).some(s=>s.captured));
    const subtitle = pend>0 ? `${I.name} — ${I.downloaded} pages, as they really look` : `${I.name} — ${I.downloaded} pages, all described`;
    const ghostsShown = DATA.frontier.slice().sort((a,b)=>(b.inboundCount||0)-(a.inboundCount||0)).slice(0,2);
    const ghostShownCount = ghostsShown.reduce((s,f)=>s+(f.count||1),0);
    const overflowN = Math.max(0, lockedTotal - ghostShownCount);
    // atlas cards no longer navigate (F1): hover = peek, click = panel; data-card holds the slug
    const cardHtml = (n)=>`<button class="pg" data-card="${esc(n.id)}">
        ${n.kind==='template'?`<span class="count">stands for ${n.standsFor}</span>`:''}
        ${img2(n.screenshot,'shot')}
        <span class="m"><span class="nm">${esc(dlabel(n))}</span><span class="rt">${esc(n.route||'')}</span>
        <span class="cap${n.descPending?' dorm':''}">${n.descPending?'— caption dormant, waiting for your AI':esc(n.desc||'')}</span></span></button>`;
    const ghostHtml = (f)=>`<button class="pg locked" data-goto="map"><span class="shot">not downloaded yet</span>
        <span class="m"><span class="nm">${esc(f.pattern||f.label||'locked')}</span><span class="rt">linked from ${f.inboundCount||f.count||1} pages</span>
        <span class="unlock">Unlock</span></span></button>`;
    const overflow = overflowN>0 ? `<button class="pg locked" data-goto="map"><span class="shot">…and ${overflowN} more on the map</span>
        <span class="m"><span class="nm">Everything else</span><span class="rt">the map holds them</span><span class="unlock">Open the map</span></span></button>` : '';
    const logo = I.logo ? `<img class="logo" src="${esc(I.logo)}" alt="">` : monogram('logo', I.name);
    // adaptive filter chips (F5): pre-AI foregrounds Described; post-AI drops the redundant Described=All and adds Without states
    const filters = [`<button class="filt on" data-filt="all">All ${nodes.length}</button>`,
      `<button class="filt" data-filt="templates">Templates ${templates.length}</button>`];
    if (pend>0) filters.push(`<button class="filt" data-filt="described">Described ${described.length}</button>`);
    filters.push(`<button class="filt" data-filt="states">With states ${withStates.length}</button>`);
    if (pend===0) filters.push(`<button class="filt" data-filt="without">Without states ${nodes.length-withStates.length}</button>`);
    filters.push(`<button class="filt" data-goto="map">Locked ${lockedTotal}</button>`);
    document.getElementById('pane-home').innerHTML = `<div class="home">
      <div class="ident">${logo}
        <div class="who"><b>${esc(subtitle)}</b>
          ${I.description?`<span class="desc"><span>${esc(I.description.text)}</span><span class="ai" title="observed from the captured page">meta description · observed</span></span>`:''}</div>
        <div class="facts">
          <div><div class="fv">${I.found}</div><div class="fl">found</div></div>
          <div><div class="fv">${I.downloaded}</div><div class="fl">downloaded</div></div>
          <div><div class="fv">${I.described}/${I.describable}</div><div class="fl">described</div></div>
          <div><div class="fv">${fmtDate(I.capturedAt)}</div><div class="fl">captured · current</div></div>
        </div>
      </div>
      <div class="homecols">
        <div class="gridwrap">
          <div class="filters">${filters.join('')}</div>
          <div class="atlas" id="atlas">${nodes.map(cardHtml).join('')}${ghostsShown.map(ghostHtml).join('')}${overflow}</div>
        </div>
        ${ledgerRail()}
      </div>
    </div>`;
    const atlas=document.getElementById('atlas');
    wireThumbs(atlas);
    // F1 ladder on the atlas: hover/focus = peek, click = in-context panel
    atlas.addEventListener('mouseover', e=>{ const c=e.target.closest('.pg[data-card]'); if(c){ const n=byId[c.dataset.card]; if(n) showPeek(n, e.clientX, e.clientY); } });
    atlas.addEventListener('mousemove', e=>{ if(peekEl.classList.contains('open')) positionPeek(e.clientX, e.clientY); });
    atlas.addEventListener('mouseout', e=>{ if(e.target.closest('.pg[data-card]')) hidePeek(); });
    atlas.querySelectorAll('.pg[data-card]').forEach(c=>{
      c.onclick=()=>{ const n=byId[c.dataset.card]; if(n) openPanel(n); };
      c.addEventListener('focus', ()=>{ const n=byId[c.dataset.card]; const r=c.getBoundingClientRect(); if(n) showPeek(n, r.right-40, r.top); });
      c.addEventListener('blur', hidePeek);
    });
    document.querySelectorAll('#pane-home .filt[data-filt]').forEach(b=>b.onclick=()=>{
      document.querySelectorAll('#pane-home .filt[data-filt]').forEach(x=>x.classList.toggle('on', x===b));
      const f=b.dataset.filt;
      atlas.querySelectorAll('.pg').forEach(c=>{
        if(c.classList.contains('locked')){ c.style.display = f==='all'?'':'none'; return; }
        const n=byId[c.dataset.card]; let show=true;
        if(f==='templates') show=n&&n.kind==='template';
        else if(f==='described') show=n&&!n.descPending;
        else if(f==='states') show=n&&(n.states||[]).some(s=>s.captured);
        else if(f==='without') show=n&&!(n.states||[]).some(s=>s.captured);
        c.style.display=show?'':'none'; });
    });
  }

  function journalFeed(filter){
    const evs=DASH.events.slice().reverse();
    const match=(a)=> filter==='all' || (filter==='you'&&/you/i.test(a)) || (filter==='kit'&&a==='the kit') || (filter==='ai'&&/your AI/i.test(a));
    let html=nextSlot(), lastDay='';
    for(const e of evs){ if(!match(e.actor)) continue; const day=fmtDate(e.at); if(day&&day!==lastDay){ html+=`<div class="jday">${esc(day)}</div>`; lastDay=day; } html+=ledgerEntry(e,false); }
    html+=`<div class="ent future"><div class="emeta">someday · the kit</div><span class="etitle">Re-capture &amp; drift checks land here too</span><div class="edetail">"3 pages changed since your last accepted capture — review side by side" — same feed, same grammar.</div></div>`;
    return `<section class="led">${html}</section>`;
  }
  function renderJournal(){
    document.getElementById('pane-journal').innerHTML=`<div class="jwrap">
      <div class="jhead"><div><h1>The journal — everything that happened to this library</h1>
        <p>appended automatically from the library's own metadata · nothing here is editable</p></div>
        <div class="jfilters">
          <button class="filt on" data-jf="all">All</button><button class="filt" data-jf="you">You</button>
          <button class="filt" data-jf="kit">The kit</button><button class="filt" data-jf="ai">Your AI</button></div></div>
      <div id="jfeed">${journalFeed('all')}</div></div>`;
    document.querySelectorAll('#pane-journal .filt[data-jf]').forEach(b=>b.onclick=()=>{
      document.querySelectorAll('#pane-journal .filt[data-jf]').forEach(x=>x.classList.toggle('on',x===b));
      document.getElementById('jfeed').innerHTML=journalFeed(b.dataset.jf); });
  }

  function renderPageDoc(slug){
    const el=document.getElementById('pane-page'); const n=byId[slug];
    if(!n || n.locked){ el.innerHTML=`<div class="pgdoc"><div class="crumb"><button class="lnk" data-goto="home">Home</button></div><div class="card">That page isn't in the library.</div></div>`; return; }
    const states=n.states||[];
    const known=['empty','error','filtered','filled','sorted']; const missing=known.filter(k=>!states.some(s=>(s.name||'').includes(k)));
    const leadsTo=(n.linksTo||[]).slice(0,8), reachedFrom=(n.linkedFrom||[]).slice(0,8);
    const moreFrom=Math.max(0,(n.linkedFrom||[]).length-reachedFrom.length);
    const chip=(id)=>`<button class="lc" data-goto="page/${esc(id)}">${esc(byId[id]?dlabel(byId[id]):id)}</button>`;
    const hist=[];
    DASH.events.forEach(e=>{ if(e.link&&e.link.page===slug) hist.push({t:e.title,at:e.at,actor:e.actor}); });
    if(!n.descPending) hist.push({t:'Described', at:null, actor:'your AI'});
    hist.push({t:'Captured', at:n.capturedAt, actor:'the kit'});
    hist.sort((a,b)=>((b.at||'') < (a.at||'') ? -1 : (b.at||'')>(a.at||'')?1:0));
    // F1 return affordance — provenance-aware (arrived from map vs home vs a cold deep-link)
    const backTo = pageOrigin==='map' ? 'map' : 'home';
    const backLabel = pageOrigin==='map' ? '← Back to map' : '← Back to home';
    el.innerHTML=`<div class="pgdoc">
      <div class="retbar"><button class="retbtn" id="pg-back">${backLabel}</button>
        <span class="crumb" style="margin:0"><button class="lnk" data-goto="home">Home</button> / ${esc(n.section||'')} / ${esc(dlabel(n))}</span></div>
      <div class="dhd"><h1>${esc(dlabel(n))}</h1><span class="rt">${esc(n.route||'')} · captured ${fmtDate(n.capturedAt)} · current</span>
        <div class="acts">${pchip('Wireframe on this page',PROMPTS.wireframe(slug))}${pchip('Ask about this page',PROMPTS.askQuestion(),true)}<a class="pchip ghost" href="${esc(n.pageHtml)}" target="_blank">Open real HTML</a></div></div>
      <div class="dcols">
        <div class="dleft">
          ${n.screenshot?`<div class="shotwrap skel"><a href="${esc(n.screenshot)}" target="_blank"><img class="dshot capped fade" data-src="${esc(n.screenshot)}" alt=""></a></div><button class="shot-expand" id="shot-exp">expand full length</button>`:'<span class="dshot hatch" style="height:400px;display:block"></span>'}
          <h3>States</h3>
          <div class="strip">
            ${states.length?states.map((s,i)=>`<span class="stt${i===0?' on':''}">${s.captured?img2('pages/'+esc(slug)+'/states/'+esc(s.name)+'/screenshot.png','stt-shot'):'<span class="ph"></span>'}${esc(s.name)}</span>`).join(''):''}
            <span class="stt add"><span class="ph">+ add a state by URL</span>${esc(missing.slice(0,3).join(' · ')||'more')}</span>
            <button class="stt guided" id="pg-guided" data-url="${esc(pageUrl(n))}">Can't reach it by URL? Guided capture</button>
          </div>
        </div>
        <div class="dright">
          <div class="card"><h3 style="margin-top:0">What this page is <span class="ai" title="model-written orientation">ai</span></h3>
            <div style="font-size:13px;color:${n.descPending?'var(--dim)':'var(--txt)'}">${n.descPending?'— not described yet. Copy the describe prompt on Home to fill this in.':esc(n.desc||'')}</div></div>
          <div class="card"><h3 style="margin-top:0">Observed <span class="ai" title="extracted from the DOM">dom</span></h3>
            <div class="kv"><span>Linked from</span><span>${n.inboundCount||0} pages</span></div>
            <div class="kv"><span>Links out</span><span>${(n.linksTo||[]).length}</span></div>
            <div class="kv"><span>Clicks from home</span><span>${n.clickDepth==null?'not linked from home':n.clickDepth}</span></div>
            ${n.standsFor?`<div class="kv"><span>Layout template</span><span>stands for ${n.standsFor}</span></div>`:''}</div>
          <div class="card"><h3 style="margin-top:0">Leads to <span class="ai" title="from the DOM">dom</span></h3>
            <div class="lchips">${leadsTo.map(chip).join('')||'<span class="edetail">—</span>'}</div>
            <h3>Reached from</h3>
            <div class="lchips">${reachedFrom.map(chip).join('')}${moreFrom?`<button class="lc" data-goto="map">…${moreFrom} more on the map</button>`:''}${reachedFrom.length?'':'<span class="edetail">—</span>'}</div></div>
          <div class="card"><h3 style="margin-top:0">This page's history <span class="ai" title="derived from the journal">journal</span></h3>
            <div class="hist">${hist.map(h=>`<div class="hi">${esc(h.t)}<small>${[h.at?fmtDate(h.at):'',h.actor].filter(Boolean).join(' · ')}</small></div>`).join('')}</div></div>
        </div>
      </div>
    </div>`;
    wireThumbs(el);
    const bk=el.querySelector('#pg-back'); if(bk) bk.onclick=()=>{ location.hash = backTo; };
    { const g=el.querySelector('#pg-guided'); if(g) g.onclick=()=>launchGuided(g.dataset.url); }
    const exp=el.querySelector('#shot-exp'); if(exp) exp.onclick=()=>{ const s=el.querySelector('.dshot'); if(!s) return;
      const capped=s.classList.toggle('capped'); exp.textContent = capped?'expand full length':'collapse'; };
  }

  // ═════════ ROUTING ═════════
  function showPane(name){
    document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('active', p.id==='pane-'+name));
    // F1 provenance: on the page doc, keep the tab we arrived from lit (map/home); direct deep-link → home
    const activeTab = name==='page' ? (pageOrigin==='map'?'map':'home') : name;
    document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active', x.dataset.tab===activeTab));
    const jp=document.getElementById('journalpill'); if(jp) jp.classList.toggle('on', name==='journal');
    if(name==='map'){ resize(); if(!window.__fitted){ fit(); window.__fitted=true; }
      // F1 restore: reopen the panel we expanded from + reapply camera on return
      if(mapReopen){ const nn=byId[mapReopen]; mapReopen=null; applyMapView(); if(nn) openPanel(nn); } }
    const sp=document.querySelector('.pane.active.scrollpane'); if(sp) sp.scrollTop=0;
  }
  function route(){
    const h=(location.hash||'').replace(/^#/,'');
    if(h.indexOf('page/')===0){ renderPageDoc(decodeURIComponent(h.slice(5))); return showPane('page'); }
    if(h==='journal'){ renderJournal(); return showPane('journal'); }
    if(h==='map'||h==='design'||h==='useit'){ return showPane(h); }
    renderHome(); showPane('home');
  }

  // ═════════ DESIGN LANGUAGE TAB (tokens; Components section added in renderDesignExtras) ═════════
  (function renderTokens(){
    const T = DASH.tokens, el = document.getElementById('pane-design');
    const lum = h => { const n = parseInt(h.slice(1),16); return (0.299*(n>>16&255)+0.587*(n>>8&255)+0.114*(n&255)); };
    const sw = c => `<div class="sw"><div class="c" style="background:${esc(c.value)};${lum(c.value)>235?'border-bottom:1px solid var(--line);':''}"></div>
      <div class="i"><b>${esc(c.value)}</b>×${c.count.toLocaleString()} · ${c.pages}p${c.alpha?' · α':''}</div></div>`;
    const spacing = T.spacing, radius = T.radius;
    el.innerHTML = `
      <div style="display:flex;align-items:flex-start;gap:14px;margin-bottom:14px">
        <div><h2 style="font-size:19px">${esc(DASH.identity.name)}'s visual language — as it is actually used</h2>
        <p style="font-size:12px;color:var(--dim);margin-top:3px">every value below was measured across the ${DASH.identity.downloaded} captured pages <span class="ai">observed · heuristic</span></p></div>
        <div style="margin-left:auto">${pchip('Audit the visual language', PROMPTS.auditTokens())}</div>
      </div>
      <div class="provenance">Everything below is <code>method: heuristic</code> — values <b>observed</b> on the captured pages, aggregated and clustered by statistics.
        They are evidence of how the product is styled today, <b>not</b> its authored design tokens. Filter: seen on 2+ pages
        (${(T.colors.droppedSinglePage||0)+(T.typography.droppedSinglePage||0)+(T.shadows.droppedSinglePage||0)} single-page values kept in <a href="tokens.json" target="_blank">tokens.json</a>).</div>
      <h3>Color — ${T.colors.top.length} recurring values</h3>
      <div class="swatches">${T.colors.top.map(sw).join('')}</div>
      <div class="grid2 secgap">
        <div class="card">
          <h3 style="margin-top:0">Type ramp — size / weight / family</h3>
          ${T.typography.ramp.map(t=>`<div class="typerow">
            <span class="sample" style="font-size:${Math.min(t.size,34)}px;font-weight:${esc(t.weight)};line-height:1.1">Ag</span>
            <span class="m">${esc(t.value)}</span><span class="m">×${t.count.toLocaleString()} · ${t.pages}p</span></div>`).join('')}
          <div class="m" style="font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-top:8px">samples rendered in a system font; family names are as observed</div>
        </div>
        <div>
          <div class="card">
            <h3 style="margin-top:0">Spacing ladder ${spacing.baseUnit?`— base unit <span style="color:var(--accent);font-family:var(--mono)">${spacing.baseUnit}px</span> (${Math.round(spacing.baseUnitShare*100)}% of values fit)`:''}</h3>
            ${spacing.steps.slice(0,16).map(s=>`<div class="bar"><div class="rect" style="width:${Math.min(s.px*3,280)}px"></div><span class="m">${esc(s.value)} ×${s.count.toLocaleString()} · ${s.pages}p</span></div>`).join('')}
          </div>
          <div class="card" style="margin-top:12px">
            <h3 style="margin-top:0">Corner radius ${radius.baseUnit?`— base ${radius.baseUnit}px`:''}</h3>
            <div class="radrow">${radius.steps.slice(0,8).map(r=>`<div class="rad"><div class="sq" style="border-radius:${Math.min(r.px,26)}px"></div><div class="m">${esc(r.value)}<br>×${r.count.toLocaleString()}</div></div>`).join('')}</div>
          </div>
        </div>
      </div>
      <h3 class="secgap">Shadows — ${T.shadows.top.length} recurring</h3>
      <div class="shrow">${T.shadows.top.map(s=>`<div><div class="sh" style="box-shadow:${esc(s.value)}"></div><div class="m">${esc(short(s.value,80))} ×${s.count.toLocaleString()}</div></div>`).join('')}</div>
      <h3 class="secgap">Components — the product's repeating parts <span class="ai">${DASH.patternsPresent?'':'coming'}</span></h3>
      ${DASH.patternsPresent
        ? `<div class="card"><div class="meta">Mined components are in <a href="patterns.json" target="_blank">patterns.json</a>.</div></div>`
        : `<div class="dormcard"><h3>Not mined yet</h3>
            <p>The kit can analyze the captured HTML for repeating components — the real buttons, cards, and rows this product is built from — so new designs reuse them instead of approximating. This section fills in when that runs.</p>
            ${pchip('Learn what pattern mining will do', "Explain what 'pattern mining' would add to this design-context library: analyzing the captured page.html files for repeating components (buttons, cards, rows) so new designs reuse the product's real parts. Describe what the Components section would then show. Don't run anything yet — just explain.", true)}
            <div class="comps"><i></i><i></i><i></i><i></i></div></div>`}`;
  })();

  // ═════════ USE-IT TAB ═════════
  (function renderUseIt(){
    const el = document.getElementById('pane-useit');
    const wsPath = (serverMode && STATUS && STATUS.workspacePath) ? STATUS.workspacePath : null;
    const firstSlug = (DATA.nodes.find(n=>n.kind!=='template') || DATA.nodes[0] || {}).id || '<slug>';
    const cdCmd = wsPath ? `cd "${wsPath}" && claude` : 'Open your AI coding tool in this workspace folder.';
    const pageOpts = DATA.nodes.map(n=>`<option value="${esc(n.id)}">${esc(short(n.label||n.id,44))}</option>`).join('');

    // Assemble a self-contained context bundle for a chat-only AI (no file access), client-side.
    async function buildBundle(slug){
      const M=DATA, O=DASH.overview, T=DASH.tokens, L=[];
      L.push(`# Design context — ${M.product}`);
      L.push(`Origin: ${M.origin} · captured ${(M.generatedAt||'').slice(0,10)} · ${M.nodes.length} pages captured, ~${O.standsForTotal} represented.`);
      L.push('', "## Pages (the product's own navigation)");
      O.nav.forEach(n=>L.push(`- **${n.label||n.slug}** (\`${n.route}\`)${n.desc?` — ${n.desc}`:''}`));
      if (O.templates.length){ L.push('', '## Repeating layouts (one example stands for many)');
        O.templates.forEach(t=>L.push(`- \`${t.pattern}\` — 1 of ${t.standsFor}${t.desc?` — ${t.desc}`:''}`)); }
      L.push('', '## Observed design tokens (method: heuristic — how it looks today, not authored tokens)');
      const cols=(T.colors&&T.colors.top||[]).slice(0,10).map(c=>c.value).join(', '); if(cols) L.push(`- Colors: ${cols}`);
      const ty=(T.typography&&T.typography.ramp||[]).slice(0,5).map(t=>t.value).join(' · '); if(ty) L.push(`- Type: ${ty}`);
      if(T.spacing&&T.spacing.baseUnit) L.push(`- Spacing base unit: ${T.spacing.baseUnit}px`);
      let omittedDoc=false;
      if (slug){
        if (serverMode){ try { const md=await fetch(`pages/${slug}/page.md`).then(r=>r.text());
            L.push('', `## Full screen doc — ${slug}`, md.trim()); } catch(_){ omittedDoc=true; } }
        else omittedDoc=true;
      }
      L.push('', '---',
        'You are helping a designer. The above is a captured snapshot of a real product: everything was extracted from the live site, except page descriptions (labeled method: ai — model-written orientation). Do not invent pages, routes, or features not listed here; build on what exists. Ask the designer which page to work on.');
      let text=L.join('\n'), capped=false; const CAP=15000;
      if (text.length>CAP){ text=text.slice(0,CAP)+'\n\n[bundle truncated at 15k chars]'; capped=true; }
      let note = 'Bundle copied — product, pages, templates, and tokens included.';
      if (slug && omittedDoc) note = "Bundle copied. The chosen page's full doc was omitted — it needs the live server (you're viewing a static file).";
      else if (slug) note = 'Bundle copied — includes the full screen doc for ' + slug + '.';
      if (capped) note += ' Truncated to ~15k chars.';
      return { text, note };
    }

    el.innerHTML = `<div class="useit">
      <h2>Use it — what to do with your design context</h2>
      <p class="lead">your AI has read this library · answers and designs will be grounded in it, not generic</p>
      <div class="create">
        <div class="t"><span class="kick">The reason this library exists</span>
          <h3>Design something new — in ${esc(DASH.identity.name)}'s own language</h3>
          <p>A new page or flow that borrows the real components, patterns, and grammar of the ${DASH.identity.downloaded} pages here — it lands in <code>wireframes/new/</code>, the library stays untouched.</p></div>
        ${pchip('Copy the design-new prompt', PROMPTS.designNew())}
      </div>
      <div class="sensitivity">Captured logged-in? The library holds your <b>real account data</b> (orders, addresses). Share the folder or bundles accordingly — and <code>profiles/</code> (your live browser session) must never leave this machine.</div>
      <div class="mode">
        <span class="badge">recommended</span>
        <h3>With Claude Code</h3>
        <p>Open Claude Code in this folder — it reads this workspace's instructions automatically and knows every page here.</p>
        <div class="mono-cmd">${esc(cdCmd)}</div>
        <div class="chiprow" style="margin-top:10px">
          ${pchip('Describe the pages', PROMPTS.describeLibrary())}
          ${pchip('First wireframe', PROMPTS.wireframe(firstSlug), true)}
          ${pchip('Add a state', PROMPTS.addState(), true)}
          ${pchip('Guided capture', PROMPTS.guided(), true)}
          ${pchip("What's missing?", PROMPTS.whatsMissing(), true)}
          ${pchip('Re-capture check', PROMPTS.recaptureCheck(), true)}
        </div>
      </div>
      <div class="mode">
        <h3>With another AI coding tool</h3>
        <p>Cursor, Windsurf, and similar read files too. Point them at <code>AGENTS.md</code>, then paste this to get started.</p>
        <div class="chiprow">${pchip('Bootstrap prompt', PROMPTS.bootstrap())}</div>
      </div>
      <div class="mode">
        <h3>With a chat-only AI</h3>
        <p>No file access (claude.ai, ChatGPT in the browser)? Copy a self-contained context bundle, paste it in, then ask your question.</p>
        <div class="bundle-row">
          <button class="pchip" id="bundle-btn">Copy context bundle</button>
          <select id="bundle-page"><option value="">— optionally include one page's full doc —</option>${pageOpts}</select>
        </div>
        <div class="hint" id="bundle-note" style="margin-top:8px"></div>
      </div>
      <div class="mode">
        <h3>Terminal / by hand</h3>
        <p>The whole kit is five commands:</p>
        <div class="mono-cmd">tools/start.sh                                    # deps + server + this dashboard
node tools/capture.js --urls "&lt;url1&gt;,&lt;url2&gt;"         # download specific frontier pages
node tools/capture.js --state &lt;slug&gt;:&lt;name&gt; --url "&lt;url&gt;"  # capture a page state
node tools/capture.js --guided --url "&lt;startUrl&gt;"        # you drive; snapshot button-only states/modals
node tools/build-index.js                         # rebuild the consumption layer
node tools/shot.js &lt;file.html&gt; [out.png] [--full]   # preview any local HTML</div>
        <p style="margin-top:10px">Any <code>pages/&lt;slug&gt;/page.html</code> opens in your browser and is editable — it's your design baseline.</p>
      </div>
    </div>`;
    const btn = document.getElementById('bundle-btn');
    btn.onclick = async ()=>{ btn.disabled=true;
      const sel = document.getElementById('bundle-page').value;
      const { text, note } = await buildBundle(sel);
      copyPrompt(text); document.getElementById('bundle-note').textContent = note; btn.disabled=false; };
  })();

  // readiness chip + initial route (honors #map / #page/<slug> deep links from onboarding or shared URLs)
  renderReadiness();
  addEventListener('hashchange', route);
  route();
}
</script>
</body>
</html>
