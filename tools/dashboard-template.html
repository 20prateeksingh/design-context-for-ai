  // ═════════ ROUTING ═════════
  function showPane(name){
    document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('active', p.id==='pane-'+name));
    // F1 provenance: on the page doc, keep the tab we arrived from lit (map/home); direct deep-link → home
    const activeTab = name==='page' ? (pageOrigin==='map'?'map':'home') : name;
    document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active', x.dataset.tab===activeTab));
    const jp=document.getElementById('journalpill'); if(jp) jp.classList.toggle('on', name==='journal');
    // (v2.5.1 F5·1) the reveal replays on every entry to the map — including a tab switch back — and the
    // class goes on BEFORE resize() so the discs it rebuilds are born with their stagger already attached.
    if(name==='map'){ startMaterialize(); resize(); if(!window.__fitted){ fit(); window.__fitted=true; }
      renderRail(); // F4·1: the map rail defaults to the ledger on every entry
      // F1 restore: reopen the rail panel we expanded from + reapply camera on return (F4·5). v2.4.2 F4:
      // stacked, the camera still restores but the rail must NOT swap — there is no rail-swap below the
      // breakpoint, in either direction.
      if(mapReopen){ const nn=byId[mapReopen]; mapReopen=null; applyMapView(); if(nn && !isStacked()) openPanel(nn); } }
    // v2.6 F2.4: the bento can only be measured once its pane is on screen (a hidden pane has no
    // geometry), so the balance decision is (re)taken on every reveal.
    if(name==='design' && window.__bentoBalance) window.__bentoBalance();
    const sp=document.querySelector('.pane.active.scrollpane'); if(sp) sp.scrollTop=0;
  }
  let lastPane=null;
  function route(){
    const h=(location.hash||'').replace(/^#/,'');
    const name = h.indexOf('page/')===0 ? 'page' : (h==='journal'||h==='map'||h==='design'||h==='useit') ? h : 'home';
    // F4·4: a tab switch resets the rail to the ledger — selection never follows across tabs. The page
    // doc is exempt both ways so "← Back to map" can restore the rail panel (F4·5, via mapReopen).
    if(name!=='page' && lastPane!=='page' && name!==lastPane){ railSel=null; activeNode=null; }
    lastPane=name;
    if(name==='page'){ renderPageDoc(decodeURIComponent(h.slice(5))); return showPane('page'); }
    if(name==='journal'){ renderJournal(); return showPane('journal'); }
    if(name==='map'||name==='design'||name==='useit'){ return showPane(name); }
    // showPane FIRST: renderHome() renders the rail through railTarget(), which reads which pane is
    // active — with the order reversed, a map→home switch painted the ledger into the map's rail and
    // left Home's empty. (Latent since v2.4; the v2.4.1 rail surface makes the empty column obvious.)
    showPane('home'); renderHome();
  }

  // ═════════ DESIGN LANGUAGE TAB (tokens) ═════════
  // Everything on this tab renders OBSERVED data (tokens.json). Nothing here invents a value: the
  // swatch fills, the treemap areas, the radius previews and the shadow tiles are all the product's
  // own measurements, painted at 1:1. The chrome around them is tokens (v2.4 §1).
  (function renderTokens(){
    const T = DASH.tokens, el = document.getElementById('pane-design');
    const lum = h => { const n = parseInt(h.slice(1),16); return (0.299*(n>>16&255)+0.587*(n>>8&255)+0.114*(n&255)); };
    // F6 (v2.4): color cards are live — click (or Enter/Space) copies the hex. The swatch block renders
    // an OBSERVED product color (data); near-black swatches get a --line seam so they read on --panel.
    const sw = c => `<div class="sw" tabindex="0" role="button" data-hex="${esc(c.value)}" aria-label="copy ${esc(c.value)}"><span class="swcpy" aria-hidden="true">⧉</span><div class="c" style="background:${esc(c.value)};${lum(c.value)<48?'border-bottom:1px solid var(--line);':''}"></div>
      <div class="i"><b>${esc(c.value)}</b>×${c.count.toLocaleString()} · ${c.pages}p${c.alpha?' · α':''}</div></div>`;
    const spacing = T.spacing, radius = T.radius;
    el.innerHTML = `
      <div style="display:flex;align-items:flex-start;gap:14px;margin-bottom:14px">
        <div><h2 style="font-size:19px">${esc(DASH.identity.name)}'s visual language — as it is actually used</h2>
        <p style="font-size:12px;color:var(--dim);margin-top:3px">every value below was measured across the ${DASH.identity.downloaded} captured pages <span class="ai">observed · heuristic</span></p></div>
        <div style="margin-left:auto">${pchip('Audit the visual language', PROMPTS.auditTokens())}</div>
      </div>
      <div class="provenance">Everything below is <code>method: heuristic</code> — values <b>observed</b> on the captured pages, aggregated and clustered by statistics.
        They are evidence of how the product is styled today, <b>not</b> its authored design tokens. Filter: seen on 2+ pages
        (${(T.colors.droppedSinglePage||0)+(T.typography.droppedSinglePage||0)+(T.shadows.droppedSinglePage||0)} single-page values kept in <a href="tokens.json" target="_blank">tokens.json</a>).</div>
      <h3>Color — ${T.colors.top.length} recurring values</h3>
      <div class="filters cviews" role="tablist" aria-label="color view">
        <button class="filt on" data-cview="palette" role="tab" aria-selected="true">Palette</button>
        <button class="filt" data-cview="proportions" role="tab" aria-selected="false">Proportions</button>
      </div>
      <div id="cv-palette" role="tabpanel">
        <div class="swatches">${T.colors.top.map(sw).join('')}</div>
      </div>
      <div id="cv-proportions" role="tabpanel" hidden>
        <div class="tmap" id="tmap"></div>
        <div class="tmfoot">area = how often each color appears across ${DASH.identity.downloaded} captured pages · observed</div>
      </div>
      <div class="bento secgap">
        <div class="card natural">
          <h3 style="margin-top:0">Type ramp — size / weight / family</h3>
          ${T.typography.ramp.map(t=>`<div class="typerow">
            <span class="sample" style="font-size:${Math.min(t.size,34)}px;font-weight:${esc(t.weight)};line-height:1.1">Ag</span>
            <span class="m">${esc(t.value)}</span><span class="m">×${t.count.toLocaleString()} · ${t.pages}p</span></div>`).join('')}
          ${T.typography.ramp.length?'':'<div class="bnone">No repeating type sizes observed yet.</div>'}
          <div class="foot">samples rendered in a system font; family names are as observed</div>
        </div>
        <div class="bcol">
          <div class="card c-space">
            <h3 style="margin-top:0">Spacing ladder ${spacing.baseUnit?`— base unit <span style="color:var(--warn);font-family:var(--mono)">${spacing.baseUnit}px</span> (${Math.round(spacing.baseUnitShare*100)}% of values fit)`:''}</h3>
            ${spacing.steps.slice(0,16).map(s=>`<div class="bar"><div class="rect" style="width:${Math.min(s.px*3,280)}px"></div><span class="m">${esc(s.value)} ×${s.count.toLocaleString()} · ${s.pages}p</span></div>`).join('')}
            ${spacing.steps.length?'':'<div class="bnone">No repeating spacing values observed yet.</div>'}
          </div>
          <div class="card c-rad">
            <h3 style="margin-top:0">Corner radius ${radius.baseUnit?`— base ${radius.baseUnit}px`:''}</h3>
            <div class="radgrid">${radius.steps.map(r=>`<div class="rad" title="${esc(r.value)} — ×${r.count.toLocaleString()} on ${r.pages} pages"><div class="sq" style="border-radius:${esc(r.value)}"></div><div class="m"><b>${esc(r.value)}</b>×${r.count.toLocaleString()}</div></div>`).join('')}</div>
            ${radius.steps.length?'':'<div class="bnone">No repeating corner radii observed yet.</div>'}
          </div>
          <div class="card c-sh">
            <h3 style="margin-top:0">Shadows — ${T.shadows.top.length} recurring</h3>
            <div class="shgrid">${T.shadows.top.map(s=>`<div><div class="sh" style="box-shadow:${esc(s.value)}"></div><div class="m" title="${esc(s.value)}">${esc(short(s.value,44))} ×${s.count.toLocaleString()}</div></div>`).join('')}</div>
            ${T.shadows.top.length?'':'<div class="bnone">No repeating shadows observed yet.</div>'}
          </div>
          ${DASH.patternsPresent
            ? `<div class="card"><h3 style="margin-top:0">Components — the product's repeating parts</h3>
                <div class="meta">Mined components are in <a href="patterns.json" target="_blank">patterns.json</a>.</div></div>`
            : `<div class="compslot">
                <div class="cmeta">someday</div>
                <div class="ctitle">Components</div>
                <div class="cdetail">repeating patterns mined from your pages will land here</div>
                <div style="margin-top:8px">${pchip('Learn what pattern mining will do', "Explain what 'pattern mining' would add to this design-context library: analyzing the captured page.html files for repeating components (buttons, cards, rows) so new designs reuse the product's real parts. Describe what the Components section would then show. Don't run anything yet — just explain.", true)}</div>
              </div>`}
        </div>
      </div>`;

    // F6 — click / Enter / Space on a color card copies its hex. Works in server AND file:// modes:
    // navigator.clipboard first, hidden-textarea execCommand fallback (both trace to the click gesture).
    function fallbackCopyHex(hex, done){
      try { const ta=document.createElement('textarea'); ta.value=hex;
        ta.style.cssText='position:fixed;left:-9999px;top:0'; ta.setAttribute('aria-hidden','true');
        document.body.appendChild(ta); ta.select();
        const ok=document.execCommand('copy'); ta.remove();
        ok ? done() : toast('Your browser blocked the copy — the value is ' + hex);
      } catch(_){ toast('Your browser blocked the copy — the value is ' + hex); }
    }
    function copyHex(hex){
      const done=()=>toast('Copied ' + hex);
      if (navigator.clipboard && navigator.clipboard.writeText)
        navigator.clipboard.writeText(hex).then(done).catch(()=>fallbackCopyHex(hex, done));
      else fallbackCopyHex(hex, done);
    }
    // Parity (v2.6 F3.3): copy works from EITHER view. The treemap tiles are real <button>s, so the
    // browser turns Enter/Space into a click for them — the keydown handler stays scoped to .sw (the
    // div-with-role cards), or a tile would copy twice per keypress.
    el.addEventListener('click', e=>{ const c=e.target.closest && e.target.closest('[data-hex]'); if(c) copyHex(c.getAttribute('data-hex')); });
    el.addEventListener('keydown', e=>{ if(e.key!=='Enter' && e.key!==' ') return;
      const c=e.target.closest && e.target.closest('.sw[data-hex]'); if(c){ e.preventDefault(); copyHex(c.getAttribute('data-hex')); } });

    // ── F3: Proportions — a squarified treemap of the SAME data the palette cards show ──────────────
    // Neutrals dominate every real product; that is the honest picture, so nothing is filtered out.
    // Deterministic by construction: the input is sorted (count desc → hex asc → opaque before alpha),
    // squarify() has no randomness, and the layout is a pure function of (counts, rect).
    const TM = T.colors.top.slice().sort((a,b)=>
      b.count-a.count || (a.value<b.value?-1:a.value>b.value?1:0) || ((a.alpha?1:0)-(b.alpha?1:0)));
    const TMSUM = TM.reduce((s,c)=>s+c.count,0);

    // Bruls / Huizing / van Wijk (1999). Strips run along the shorter side of the remaining rect; a
    // strip closes when adding the next value would make its worst aspect ratio worse.
    function worstAR(areas, side){
      let s=0, mx=0, mn=Infinity;
      for(const a of areas){ s+=a; if(a>mx)mx=a; if(a<mn)mn=a; }
      if(!(s>0) || !(mn>0)) return Infinity;
      const w2=side*side, s2=s*s;
      return Math.max(w2*mx/s2, s2/(w2*mn));
    }
    function squarify(items, X, Y, W, H){
      const out=[]; let rest=items.slice(), x=X, y=Y, w=W, h=H;
      let remaining=rest.reduce((a,i)=>a+i.count,0);
      if(!(remaining>0)) return out;
      while(rest.length && w>1e-6 && h>1e-6){
        const scale=(w*h)/remaining, vertical=(w>=h), side=vertical?h:w;
        let row=[], best=Infinity;
        while(rest.length){
          const trial=row.concat([rest[0]]);
          const r=worstAR(trial.map(i=>i.count*scale), side);
          if(row.length && r>best) break;
          row=trial; best=r; rest.shift();
        }
        const rowSum=row.reduce((a,i)=>a+i.count,0), thick=(rowSum*scale)/side;
        let off = vertical ? y : x;
        row.forEach(it=>{
          const len = side*(it.count/rowSum);
          out.push(vertical ? {it,x:x,y:off,w:thick,h:len} : {it,x:off,y:y,w:len,h:thick});
          off+=len;
        });
        if(vertical){ x+=thick; w-=thick; } else { y+=thick; h-=thick; }
        remaining-=rowSum;
      }
      return out;
    }

    // Label ink: whichever of --txt / --bg clears 4.5:1 ON THAT SWATCH — read off the tokens
    // themselves, not off copies of their hex values (v2.4 §1). ~4% of observed swatches sit in the
    // mid-grey band where NEITHER clears; those take the pill (see .tmt .l.pill).
    const srgb = v => { v/=255; return v<=0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055,2.4); };
    function relLum(hex){
      let s=(hex||'').trim().replace('#','');
      if(s.length===3) s=s[0]+s[0]+s[1]+s[1]+s[2]+s[2];
      const n=parseInt(s.slice(0,6),16); if(!isFinite(n)) return 0;
      return 0.2126*srgb(n>>16&255)+0.7152*srgb(n>>8&255)+0.0722*srgb(n&255);
    }
    const ratio = (a,b)=>(Math.max(a,b)+0.05)/(Math.min(a,b)+0.05);
    const rootCS = getComputedStyle(document.documentElement);
    const L_TXT = relLum(rootCS.getPropertyValue('--txt')), L_BG = relLum(rootCS.getPropertyValue('--bg'));
    const MONO  = (rootCS.getPropertyValue('--mono')||'monospace').trim();
    const measure = document.createElement('canvas').getContext('2d');
    const pc = v => (v*100).toFixed(4)+'%';

    function layoutTreemap(){
      const box = document.getElementById('tmap'); if(!box) return;
      const W = box.clientWidth, H = box.clientHeight;
      if(!(W>2 && H>2) || !TM.length || !(TMSUM>0)){ if(!TM.length) box.innerHTML=''; return; }
      measure.font = '10.5px ' + MONO;
      box.innerHTML = squarify(TM, 0, 0, W, H).map(c=>{
        const it=c.it, share=100*it.count/TMSUM;
        const pctTxt = (share>=0.1 ? share.toFixed(1) : share.toFixed(2)) + '%';
        const lTxt = ratio(relLum(it.value), L_TXT), lBg = ratio(relLum(it.value), L_BG);
        const pill = Math.max(lTxt, lBg) < 4.5;
        const ink  = pill ? 'var(--txt)' : (lTxt >= lBg ? 'var(--txt)' : 'var(--bg)');
        const padX = pill ? 18 : 12, padY = pill ? 10 : 8;
        const wHex = measure.measureText(it.value).width, wPct = measure.measureText(pctTxt).width;
        const showHex = (wHex + padX) <= c.w && (15 + padY) <= c.h;
        const showPct = showHex && (Math.max(wHex,wPct) + padX) <= c.w && (29 + padY) <= c.h;
        const label = showHex
          ? `<span class="l${pill?' pill':''}" style="color:${ink}">${esc(it.value)}${showPct?`<br><i>${pctTxt}</i>`:''}</span>` : '';
        const geom = `left:${pc(c.x/W)};top:${pc(c.y/H)};width:${pc(c.w/W)};height:${pc(c.h/H)}`;
        return `<button type="button" class="tmt" data-hex="${esc(it.value)}"
          title="${esc(it.value)} · ${pctTxt} of observed color use — ×${it.count.toLocaleString()} on ${it.pages} pages"
          aria-label="copy ${esc(it.value)}, ${pctTxt} of observed color use"
          style="${geom};background:${esc(it.value)}">${label}</button>`;
      }).join('');
    }

    // The switcher. Per-session state — a class on the buttons and `hidden` on the panels, nothing
    // written anywhere. The treemap can only be measured once its panel is on screen, so it lays out
    // on reveal (and on resize while revealed — squarified layout depends on the rect's aspect).
    const cvBtns = el.querySelectorAll('.cviews .filt[data-cview]');
    const cvPanes = { palette: el.querySelector('#cv-palette'), proportions: el.querySelector('#cv-proportions') };
    function showColorView(name){
      cvBtns.forEach(b=>{ const on = b.dataset.cview===name;
        b.classList.toggle('on', on); b.setAttribute('aria-selected', on?'true':'false'); });
      Object.keys(cvPanes).forEach(k=>{ if(cvPanes[k]) cvPanes[k].hidden = (k!==name); });
      if(name==='proportions') layoutTreemap();
    }
    cvBtns.forEach(b=>b.addEventListener('click', ()=>showColorView(b.dataset.cview)));

    // (F2.4) Bento balance. Which column is taller depends on the product's own data — a 24-row ramp
    // beats four sparse tenants, a 10-row ramp loses to them — so the decision is measured, not
    // guessed from a row count. The ramp stretches ONLY if its rows can swallow the difference inside
    // the 54px cap; otherwise it stays natural and the column just ends. Pure function of the
    // rendered layout, idempotent, so re-running it (reveal, resize) can't oscillate.
    const RAMP_ROW_MAX = 54;
    function balanceBento(){
      const bento = el.querySelector('.bento'); if(!bento) return;
      const ramp = bento.firstElementChild, right = bento.lastElementChild;
      if(!ramp || !right) return;
      ramp.classList.add('natural');                       // measure both columns at rest
      const rows = ramp.querySelectorAll('.typerow');
      if(!rows.length || !bento.getBoundingClientRect().height) return;
      // rows are NOT uniform (a 27px sample makes a taller band than a 14px one), so headroom is the
      // sum of what each row can still take before it hits the cap — which is exactly what flexbox
      // will redistribute, since a row that hits its max-height freezes and passes the rest along.
      let headroom = 0;
      rows.forEach(r=>{ headroom += Math.max(0, RAMP_ROW_MAX - r.getBoundingClientRect().height); });
      const slack = right.getBoundingClientRect().height - ramp.getBoundingClientRect().height;
      if(slack > 0 && slack <= headroom) ramp.classList.remove('natural');
    }
    window.__bentoBalance = balanceBento;
    balanceBento();

    let tmRz=null;
    window.addEventListener('resize', ()=>{
      clearTimeout(tmRz); tmRz=setTimeout(()=>{ balanceBento();
        if(cvPanes.proportions && !cvPanes.proportions.hidden) layoutTreemap(); }, 120); });
  })();

  // ═════════ USE-IT TAB ═════════
  (function renderUseIt(){
    const el = document.getElementById('pane-useit');
    const wsPath = (serverMode && STATUS && STATUS.workspacePath) ? STATUS.workspacePath : null;
    const firstSlug = (DATA.nodes.find(n=>n.kind!=='template') || DATA.nodes[0] || {}).id || '<slug>';
    const cdCmd = wsPath ? `cd "${wsPath}" && claude` : 'Open your AI coding tool in this workspace folder.';
    const pageOpts = DATA.nodes.map(n=>`<option value="${esc(n.id)}">${esc(short(n.displayLabel||n.label||n.id,44))}</option>`).join('');

    // Assemble a self-contained context bundle for a chat-only AI (no file access), client-side.
    async function buildBundle(slug){
      const M=DATA, O=DASH.overview, T=DASH.tokens, L=[];
      L.push(`# Design context — ${M.product}`);
      L.push(`Origin: ${M.origin} · captured ${(M.generatedAt||'').slice(0,10)} · ${M.nodes.length} pages captured, ~${O.standsForTotal} represented.`);
      L.push('', "## Pages (the product's own navigation)");
      O.nav.forEach(n=>L.push(`- **${n.displayLabel||n.label||n.slug}** (\`${n.route}\`)${n.desc?` — ${n.desc}`:''}`));
      if (O.templates.length){ L.push('', '## Repeating layouts (one example stands for many)');
        O.templates.forEach(t=>L.push(`- \`${t.pattern}\` — 1 of ${t.standsFor}${t.desc?` — ${t.desc}`:''}`)); }
      L.push('', '## Observed design tokens (method: heuristic — how it looks today, not authored tokens)');
      const cols=(T.colors&&T.colors.top||[]).slice(0,10).map(c=>c.value).join(', '); if(cols) L.push(`- Colors: ${cols}`);
      const ty=(T.typography&&T.typography.ramp||[]).slice(0,5).map(t=>t.value).join(' · '); if(ty) L.push(`- Type: ${ty}`);
      if(T.spacing&&T.spacing.baseUnit) L.push(`- Spacing base unit: ${T.spacing.baseUnit}px`);
      let omittedDoc=false;
      if (slug){
        if (serverMode){ try { const md=await fetch(`pages/${slug}/page.md`).then(r=>r.text());
            L.push('', `## Full screen doc — ${slug}`, md.trim()); } catch(_){ omittedDoc=true; } }
        else omittedDoc=true;
      }
      L.push('', '---',
        'You are helping a designer. The above is a captured snapshot of a real product: everything was extracted from the live site, except page descriptions (labeled method: ai — model-written orientation). Do not invent pages, routes, or features not listed here; build on what exists. Ask the designer which page to work on.');
      let text=L.join('\n'), capped=false; const CAP=15000;
      if (text.length>CAP){ text=text.slice(0,CAP)+'\n\n[bundle truncated at 15k chars]'; capped=true; }
      let note = 'Bundle copied — product, pages, templates, and tokens included.';
      if (slug && omittedDoc) note = "Bundle copied. The chosen page's full doc was omitted — it needs the live server (you're viewing a static file).";
      else if (slug) note = 'Bundle copied — includes the full screen doc for ' + slug + '.';
      if (capped) note += ' Truncated to ~15k chars.';
      return { text, note };
    }

    el.innerHTML = `<div class="useit">
      <h2>Use it — what to do with your design context</h2>
      <p class="lead">your AI has read this library · answers and designs will be grounded in it, not generic</p>
      <div class="create">
        <div class="t"><span class="kick">The reason this library exists</span>
          <h3>Design something new — in ${esc(DASH.identity.name)}'s own language</h3>
          <p>A new page or flow that borrows the real components, patterns, and grammar of the ${DASH.identity.downloaded} pages here — it lands in <code>wireframes/new/</code>, the library stays untouched.</p></div>
        ${pchip('Copy the design-new prompt', PROMPTS.designNew())}
      </div>
      <div class="sensitivity">Captured logged-in? The library holds your <b>real account data</b> (orders, addresses). Share the folder or bundles accordingly — and <code>profiles/</code> (your live browser session) must never leave this machine.</div>
      <div class="mode">
        <span class="badge">new</span>
        <h3>Take any page straight into Figma</h3>
        <p>On any page — the Home atlas panel, the Map panel, or a page doc (and each captured state) — click <b>⧉ Copy for Figma</b> and paste into your Figma file (⌘V). It lands as editable auto-layout layers — arrange or restyle freely; your library stays untouched. No plugin, no Dev Mode, no network.</p>
        <div class="chiprow">${pchip('How to copy for Figma', PROMPTS.figma(), true)}</div>
      </div>
      <div class="mode">
        <span class="badge">recommended</span>
        <h3>With Claude Code</h3>
        <p>Open Claude Code in this folder — it reads this workspace's instructions automatically and knows every page here.</p>
        <div class="mono-cmd">${esc(cdCmd)}</div>
        <div class="chiprow" style="margin-top:10px">
          ${pchip('Describe the pages', PROMPTS.describeLibrary())}
          ${pchip('First wireframe', PROMPTS.wireframe(firstSlug), true)}
          ${pchip('Add a state', PROMPTS.addState(), true)}
          ${pchip('Guided capture', PROMPTS.guided(), true)}
          ${pchip("What's missing?", PROMPTS.whatsMissing(), true)}
          ${pchip('Re-capture check', PROMPTS.recaptureCheck(), true)}
        </div>
      </div>
      <div class="mode">
        <h3>With another AI coding tool</h3>
        <p>Cursor, Windsurf, and similar read files too. Point them at <code>AGENTS.md</code>, then paste this to get started.</p>
        <div class="chiprow">${pchip('Bootstrap prompt', PROMPTS.bootstrap())}</div>
      </div>
      <div class="mode">
        <h3>With a chat-only AI</h3>
        <p>No file access (claude.ai, ChatGPT in the browser)? Copy a self-contained context bundle, paste it in, then ask your question.</p>
        <div class="bundle-row">
          <button class="pchip" id="bundle-btn">Copy context bundle</button>
          <select id="bundle-page"><option value="">— optionally include one page's full doc —</option>${pageOpts}</select>
        </div>
        <div class="hint" id="bundle-note" style="margin-top:8px"></div>
      </div>
      <div class="mode">
        <h3>Terminal / by hand</h3>
        <p>The whole kit is five commands:</p>
        <div class="mono-cmd">tools/start.sh                                    # deps + server + this dashboard
node tools/capture.js --urls "&lt;url1&gt;,&lt;url2&gt;"         # download specific frontier pages
node tools/capture.js --state &lt;slug&gt;:&lt;name&gt; --url "&lt;url&gt;"  # capture a page state
node tools/capture.js --guided --url "&lt;startUrl&gt;"        # you drive; snapshot button-only states/modals
node tools/build-index.js                         # rebuild the consumption layer
node tools/shot.js &lt;file.html&gt; [out.png] [--full]   # preview any local HTML</div>
        <p style="margin-top:10px">Any <code>pages/&lt;slug&gt;/page.html</code> opens in your browser and is editable — it's your design baseline.</p>
      </div>
    </div>`;
    const btn = document.getElementById('bundle-btn');
    btn.onclick = async ()=>{ btn.disabled=true;
      const sel = document.getElementById('bundle-page').value;
      const { text, note } = await buildBundle(sel);
      copyPrompt(text); document.getElementById('bundle-note').textContent = note; btn.disabled=false; };
  })();

  // readiness chip + initial route (honors #map / #page/<slug> deep links from onboarding or shared URLs)
  renderReadiness();
  addEventListener('hashchange', route);
  route();
}
</script>
</body>
