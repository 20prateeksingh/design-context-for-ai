<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design Context Dashboard</title>
<style>
  /* Design system: light · elegant · minimal (Prateek 2026-07-19). ui-ux-pro-max palette direction
     (knowledge blue/indigo + violet accent + clean white) on a minimal treatment — its "Liquid Glass"
     style pick was rejected for its own perf/contrast warnings. System font stacks (no CDN). */
  :root { --bg:#F8FAFC; --panel:#FFFFFF; --card:#FFFFFF; --line:#E6EAF1; --txt:#101828; --dim:#667085;
          --primary:#4F46E5; --primary-strong:#4338CA; --accent:#B45309; --ok:#15803D; --bad:#B91C1C; --tpl:#7C3AED;
          --mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
          --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; }
  body { background:var(--bg); color:var(--txt); font:14px/1.55 var(--sans); overflow:hidden; }
  button { font:inherit; cursor:pointer; }
  a { color:var(--primary-strong); text-decoration:none; }
  a:hover { text-decoration:underline; }
  :focus-visible { outline:2px solid var(--primary); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce){ *,*::before,*::after{ transition:none!important; animation:none!important; } }

  /* ── shell ── */
  #shell { position:fixed; top:0; left:0; right:0; height:52px; display:flex; align-items:center; gap:10px;
           padding:0 16px; background:var(--panel); border-bottom:1px solid var(--line); z-index:20; }
  #shell h1 { font-size:14px; font-weight:650; margin-right:8px; white-space:nowrap; }
  #shell h1 .mono { font-family:var(--mono); color:var(--dim); font-weight:400; font-size:12px; }
  .tabs { display:flex; gap:2px; background:#EEF1F6; border:1px solid var(--line); border-radius:9px; padding:3px; }
  .tab { display:flex; align-items:center; gap:7px; border:0; background:none; color:var(--dim); font-size:13px;
         font-weight:550; padding:5px 13px; border-radius:6px; transition:background .2s,color .2s; }
  .tab svg { width:14px; height:14px; }
  .tab.active { background:var(--card); color:var(--txt); box-shadow:0 1px 2px rgba(16,24,40,.08); }
  .tab:hover:not(.active) { color:var(--txt); }
  .spacer { flex:1; }
  .pill { font-size:12px; font-family:var(--mono); color:var(--dim); background:var(--bg); border:1px solid var(--line);
          border-radius:20px; padding:3px 10px; white-space:nowrap; }
  .pill b { color:var(--txt); }
  #server-pill.on { color:var(--ok); border-color:#BBE3C8; }
  #capbtn { font-size:13px; font-weight:600; background:var(--primary); color:#fff; border:0;
            border-radius:8px; padding:7px 14px; display:none; transition:background .2s; }
  #capbtn:hover { background:var(--primary-strong); }
  #capbtn:disabled { opacity:.5; cursor:wait; }
  #recapbtn { font-size:12px; font-weight:600; background:#F5F7FA; color:var(--txt); border:1px solid var(--line);
              border-radius:8px; padding:6px 11px; display:none; transition:border-color .2s; }
  #recapbtn:hover { border-color:var(--primary); }
  /* onboarding: the tabs and their chrome don't exist yet — hide until the library does */
  #shell.onboarding .tabs, #shell.onboarding .pill, #shell.onboarding .rchip, #shell.onboarding #capbtn, #shell.onboarding #recapbtn { display:none; }
  #shell.onboarding #readypop { display:none; }

  /* ── tab panes ── */
  .pane { position:fixed; inset:52px 0 0 0; display:none; }
  .pane.active { display:block; }
  .scrollpane { overflow-y:auto; padding:22px clamp(16px,4vw,44px) 60px; }

  /* ── map pane: M22 orbital under fog ── */
  #pane-map { background:#FCFDFE; overflow:hidden; }
  #mapworld { position:absolute; inset:0; }
  #maplines { position:absolute; inset:0; z-index:1; pointer-events:none; }
  .mapring { position:absolute; border:1.5px dashed var(--line); border-radius:50%; transform:translate(-50%,-50%); pointer-events:none; z-index:1; }
  .maprlbl { position:absolute; transform:translate(-50%,-50%); font-size:9.5px; color:#C0C6D2; text-transform:uppercase; letter-spacing:.6px; background:#FCFDFE; padding:0 5px; pointer-events:none; z-index:2; }
  .maphomelbl { position:absolute; transform:translate(-50%,0); text-align:center; font-size:12px; font-weight:650; color:var(--txt); z-index:3; pointer-events:none; white-space:nowrap; }
  .maphomelbl small { display:block; font-weight:400; font-size:9.5px; color:var(--dim); }
  .mapnode { position:absolute; transform:translate(-50%,-50%); border-radius:50%; border:2.5px solid var(--primary);
             background:var(--card) center/cover no-repeat; z-index:3; padding:0; cursor:pointer; box-shadow:0 1px 3px rgba(16,24,40,.12); }
  .mapnode:hover { box-shadow:0 0 0 4px rgba(79,70,229,.18); }
  .mapnode.tpl { border-color:var(--tpl); }
  .mapnode.dorm { border-color:#C9CDD6; }
  .mapnode .st { position:absolute; top:-2px; right:-2px; width:10px; height:10px; border-radius:50%; background:var(--ok); border:2px solid var(--panel); }
  .mapnlbl { position:absolute; transform:translate(-50%,0); text-align:center; font-size:10px; color:var(--txt); z-index:3; pointer-events:none;
             background:rgba(252,253,254,.82); border-radius:4px; padding:0 3px; white-space:nowrap; }
  .mapnlbl small { color:var(--dim); font-size:9px; }
  .mapghost { position:absolute; transform:translate(-50%,-50%); z-index:5; text-align:center; cursor:pointer; background:none; border:0; padding:0; }
  .mapghost .gc { display:block; margin:0 auto; border:2px dashed #AEB4C0; border-radius:50%; background:rgba(252,252,253,.7); }
  .mapghost b { font-size:9.5px; color:#8A909C; display:block; margin-top:3px; font-weight:600; }
  .mapghost small { font-size:8px; color:#AEB4C0; display:block; }
  .mapfog { position:absolute; inset:0; z-index:4; pointer-events:none; }
  .mapdistrict { position:absolute; transform:translate(-50%,-50%); z-index:6; background:rgba(255,255,255,.97); border:1px solid var(--line);
                 border-radius:10px; padding:8px 12px; min-width:150px; box-shadow:0 2px 10px rgba(16,24,40,.07); pointer-events:none; }
  .mapdistrict h4 { font-size:10px; text-transform:uppercase; letter-spacing:.6px; color:var(--dim); margin-bottom:2px; }
  .mapdistrict p { font-size:9.5px; color:var(--dim); }
  .mapdistrict .bar { height:4px; background:var(--bg); border:1px solid var(--line); border-radius:2px; margin-top:5px; overflow:hidden; }
  .mapdistrict .bar i { display:block; height:100%; background:var(--dim); }
  #mapnote { position:absolute; top:14px; left:16px; font-size:10.5px; color:var(--dim); font-style:italic; z-index:7; max-width:44%; }
  #mapstats { position:absolute; left:16px; bottom:14px; background:rgba(255,255,255,.97); border:1px solid var(--line); border-radius:10px;
              padding:9px 14px; font-size:11px; color:var(--dim); z-index:7; max-width:62%; }
  #mapstats b { color:var(--txt); }
  #maplegend { position:absolute; top:14px; right:16px; background:rgba(255,255,255,.97); border:1px solid var(--line); border-radius:10px;
               padding:10px 12px; font-size:10.5px; color:var(--dim); display:flex; flex-direction:column; gap:6px; z-index:7; }
  .lg { display:flex; gap:7px; align-items:center; }
  .lg i { flex:none; display:inline-block; }

  /* ── detail panel (map) ── */
  #panel { position:fixed; top:52px; right:0; bottom:0; width:364px; background:var(--panel); border-left:1px solid var(--line);
           padding:16px; overflow-y:auto; transform:translateX(100%); transition:transform .2s ease; z-index:22; }
  #panel.open { transform:none; }
  #panel .close { position:absolute; top:10px; right:12px; background:none; border:0; color:var(--dim); font-size:18px; }
  #panel img { width:100%; border-radius:8px; border:1px solid var(--line); margin:10px 0; }
  #panel h2 { font-size:16px; margin:2px 24px 2px 0; }
  #panel .route { font-family:var(--mono); font-size:12px; color:var(--dim); word-break:break-all; }
  #panel .desc { font-size:13px; margin:10px 0; }
  #panel .meta { font-size:12px; color:var(--dim); }
  #panel h3, .scrollpane h3 { font-size:11.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--dim); margin:18px 0 8px; font-weight:650; }
  .state { display:flex; justify-content:space-between; align-items:center; font-size:13px; padding:5px 8px;
           background:#F5F7FA; border:1px solid var(--line); border-radius:6px; margin-bottom:5px; }
  .state .tag { font-size:11px; color:var(--ok); font-family:var(--mono); }
  .state .tag.pending { color:var(--accent); }
  .urlrow { display:flex; gap:8px; align-items:flex-start; font-size:12px; padding:4px 0; border-bottom:1px solid var(--line); cursor:pointer; }
  .urlrow input { margin-top:3px; }
  .urlrow .u { word-break:break-all; font-family:var(--mono); font-size:11.5px; }
  .urlrow .u small { color:var(--dim); display:block; font-family:var(--sans); }
  .btn { font-size:12px; font-weight:600; background:#F5F7FA; color:var(--txt); border:1px solid var(--line);
         border-radius:6px; padding:5px 10px; transition:border-color .2s; }
  .btn:hover { border-color:var(--primary); }
  .btn.primary { background:var(--primary); color:#fff; border:0; }
  .btn.primary:hover { background:var(--primary-strong); }
  #stateform input { width:100%; margin-bottom:6px; background:#FFFFFF; border:1px solid var(--line); color:var(--txt);
                     border-radius:6px; padding:6px 8px; font-size:13px; }
  #toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:#101828; color:#fff; border:1px solid #101828;
           border-radius:8px; padding:9px 16px; font-size:13px; display:none; z-index:30; max-width:80vw; }

  /* ── overview + tokens ── */
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
  .kpi { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; box-shadow:0 1px 2px rgba(16,24,40,.04); }
  .kpi .n { font-family:var(--mono); font-size:26px; font-weight:650; line-height:1.15; }
  .kpi .l { font-size:11.5px; color:var(--dim); margin-top:2px; }
  .kpi.blue .n { color:var(--primary); } .kpi.amber .n { color:var(--accent); }
  .kpi.purple .n { color:var(--tpl); } .kpi.green .n { color:var(--ok); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; box-shadow:0 1px 2px rgba(16,24,40,.04); }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; align-items:start; }
  @media (max-width:900px){ .grid2 { grid-template-columns:1fr; } }
  table.digest { width:100%; border-collapse:collapse; font-size:13px; }
  table.digest td { padding:7px 8px; border-top:1px solid var(--line); vertical-align:top; }
  table.digest tr:hover td { background:rgba(79,70,229,.04); }
  td.r { font-family:var(--mono); font-size:11.5px; color:var(--dim); white-space:nowrap; }
  .ai { font-size:9.5px; font-family:var(--mono); color:var(--dim); border:1px dashed var(--line); border-radius:4px; padding:0 4px; vertical-align:1px; }
  .tplcards { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:12px; }
  .tplcard { background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; transition:border-color .2s; }
  .tplcard:hover { border-color:var(--primary); }
  .tplcard img { width:100%; height:110px; object-fit:cover; object-position:top; display:block; border-bottom:1px solid var(--line); }
  .tplcard .b { padding:9px 11px; }
  .tplcard .p { font-family:var(--mono); font-size:11px; color:var(--dim); word-break:break-all; }
  .tplcard .sf { font-size:11.5px; color:var(--tpl); font-family:var(--mono); margin-top:3px; }
  .hrow { display:flex; gap:8px; align-items:baseline; font-size:13px; padding:5px 0; border-top:1px solid var(--line); }
  .chip { font-size:10.5px; font-family:var(--mono); border-radius:20px; padding:1px 8px; white-space:nowrap; }
  .chip.warn { background:rgba(180,83,9,.09); color:var(--accent); }
  .chip.bad { background:rgba(185,28,28,.08); color:var(--bad); }
  .chip.ok { background:rgba(21,128,61,.09); color:var(--ok); }
  .provenance { border:1px dashed var(--line); border-radius:8px; padding:8px 12px; font-size:12px; color:var(--dim); margin:6px 0 14px; }
  .provenance code { font-family:var(--mono); color:var(--accent); }
  .swatches { display:grid; grid-template-columns:repeat(auto-fill,minmax(118px,1fr)); gap:8px; }
  .sw { background:var(--card); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .sw .c { height:44px; }
  .sw .i { padding:6px 8px; font-family:var(--mono); font-size:10.5px; color:var(--dim); }
  .sw .i b { color:var(--txt); display:block; font-weight:550; }
  .typerow { display:flex; align-items:baseline; gap:14px; padding:8px 0; border-top:1px solid var(--line); overflow:hidden; }
  .typerow .sample { white-space:nowrap; }
  .typerow .m { font-family:var(--mono); font-size:11px; color:var(--dim); white-space:nowrap; }
  .bar { display:flex; align-items:center; gap:10px; padding:4px 0; }
  .bar .rect { height:14px; background:var(--primary); border-radius:3px; opacity:.75; }
  .bar .m { font-family:var(--mono); font-size:11px; color:var(--dim); white-space:nowrap; }
  .radrow { display:flex; gap:14px; flex-wrap:wrap; }
  .rad { text-align:center; }
  .rad .sq { width:52px; height:52px; background:var(--card); border:2px solid var(--primary); margin-bottom:4px; }
  .rad .m { font-family:var(--mono); font-size:10.5px; color:var(--dim); }
  .shrow { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:14px; }
  .sh { background:#FFFFFF; border:1px solid var(--line); border-radius:10px; height:64px; }
  .sh + .m { font-family:var(--mono); font-size:9.5px; color:var(--dim); word-break:break-all; margin-top:5px; }
  .secgap { margin-top:26px; }

  /* ── onboarding (wizard · login wait · live progress · completion) ── */
  .ob { max-width:560px; margin:6vh auto 40px; }
  .ob h2 { font-size:22px; font-weight:680; margin-bottom:6px; }
  .ob .sub { color:var(--dim); font-size:14px; margin-bottom:20px; }
  .fld { display:block; margin-top:18px; }
  .fld > span { display:block; font-size:13px; font-weight:600; margin-bottom:6px; }
  .ob input[type=text], .ob select { width:100%; background:#fff; border:1px solid var(--line); border-radius:8px;
                                      padding:10px 12px; font:inherit; color:var(--txt); }
  .ob input:focus, .ob select:focus { border-color:var(--primary); outline:none; }
  .hint { font-size:12px; color:var(--dim); margin-top:6px; }
  .ob code { font-family:var(--mono); font-size:11.5px; background:#EEF1F6; border-radius:4px; padding:0 4px; }
  .seg { display:flex; gap:8px; }
  .segbtn { flex:1; background:#fff; border:1px solid var(--line); border-radius:8px; padding:10px; font-weight:550; color:var(--txt); }
  .segbtn.on { border-color:var(--primary); background:rgba(79,70,229,.06); color:var(--primary-strong); }
  .expect { margin-top:12px; font-size:13px; color:var(--dim); background:var(--panel); border:1px solid var(--line);
            border-left:3px solid var(--primary); border-radius:8px; padding:10px 12px; }
  .err { color:var(--bad); font-size:13px; margin-top:12px; min-height:1px; }
  .btn.big { display:block; width:100%; padding:12px; font-size:15px; margin-top:22px; }
  .phase { max-width:520px; margin:13vh auto; text-align:center; }
  .phase h2 { font-size:20px; margin-bottom:8px; }
  .phase p { color:var(--dim); }
  .spin { width:26px; height:26px; border:3px solid var(--line); border-top-color:var(--primary); border-radius:50%;
          margin:22px auto; animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce){ .spin { animation:none; } }
  .prog { max-width:760px; margin:5vh auto 40px; }
  .prog h2 { font-size:21px; font-weight:680; }
  .prog .counters { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; margin:16px 0; }
  .oblog { background:#0E1220; color:#D7DCE8; font-family:var(--mono); font-size:12px; line-height:1.5; border-radius:10px;
           padding:12px 14px; height:44vh; overflow-y:auto; white-space:pre-wrap; word-break:break-word; }
  .ok-note { background:rgba(21,128,61,.06); border:1px solid #BBE3C8; border-radius:10px; padding:14px 16px; margin-top:16px; font-size:14px; }

  /* ── prompt chips ("prompts are the UI") + Use-it tab ── */
  .pchip { display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; background:var(--primary);
           color:#fff; border:0; border-radius:8px; padding:7px 12px; margin:0 8px 8px 0; transition:background .2s; text-align:left; }
  .pchip:hover { background:var(--primary-strong); }
  .pchip svg { width:13px; height:13px; flex:none; }
  .pchip.ghost { background:#F5F7FA; color:var(--txt); border:1px solid var(--line); }
  .pchip.ghost:hover { background:#fff; border-color:var(--primary); }
  .chiprow { display:flex; flex-wrap:wrap; align-items:center; }
  .useit { max-width:820px; margin:0 auto; }
  .useit h2 { font-size:20px; font-weight:680; margin-bottom:4px; }
  .useit .lead { color:var(--dim); margin-bottom:18px; }
  .mode { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin-bottom:14px; box-shadow:0 1px 2px rgba(16,24,40,.04); }
  .mode .badge { display:inline-block; font-size:10.5px; font-family:var(--mono); color:var(--primary-strong); background:rgba(79,70,229,.08); border-radius:20px; padding:2px 9px; margin-bottom:8px; }
  .mode h3 { font-size:15px; margin:0 0 4px; text-transform:none; letter-spacing:0; color:var(--txt); font-weight:650; }
  .mode p { font-size:13px; color:var(--dim); margin-bottom:10px; }
  .mono-cmd { font-family:var(--mono); font-size:12px; background:#0E1220; color:#D7DCE8; border-radius:8px; padding:10px 12px;
              margin:4px 0; overflow-x:auto; white-space:pre; line-height:1.7; }
  .sensitivity { border:1px solid #F0D399; background:rgba(180,83,9,.06); border-radius:10px; padding:12px 14px; font-size:13px; color:#7A4A08; margin-bottom:16px; }
  .sensitivity code { font-family:var(--mono); background:rgba(180,83,9,.12); border-radius:4px; padding:0 4px; }
  .bundle-row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .bundle-row select { background:#fff; border:1px solid var(--line); border-radius:8px; padding:8px 10px; font:inherit; color:var(--txt); max-width:100%; }
  .mode code { font-family:var(--mono); font-size:12px; background:#EEF1F6; border-radius:4px; padding:0 4px; }

  /* ── dashboard v2 ── */
  .hatch { background:repeating-linear-gradient(45deg,#EEF1F6,#EEF1F6 6px,#F8FAFC 6px,#F8FAFC 12px); }

  /* readiness chip + breakdown popover */
  .rchip { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--txt); background:var(--bg);
           border:1px solid var(--line); border-radius:20px; padding:3px 12px 3px 5px; white-space:nowrap; }
  .rchip:hover { border-color:var(--primary); }
  .rring { width:20px; height:20px; border-radius:50%; flex:none; position:relative;
           background:conic-gradient(var(--primary) calc(var(--pct,0)*1%), var(--line) 0); }
  .rring::after { content:""; position:absolute; inset:3px; background:var(--panel); border-radius:50%; }
  .rchip.quiet .rring { background:conic-gradient(var(--ok) calc(var(--pct,0)*1%), var(--line) 0); }
  #readypop { position:absolute; top:48px; right:14px; width:308px; background:var(--panel); border:1px solid var(--line);
              border-radius:12px; box-shadow:0 12px 34px rgba(16,24,40,.16); padding:14px 16px; z-index:40; display:none; }
  #readypop.open { display:block; }
  #readypop h4 { font-size:13px; margin-bottom:2px; }
  #readypop .rnext { font-size:12px; font-weight:600; color:var(--primary-strong); background:rgba(79,70,229,.08); border-radius:6px; padding:5px 8px; margin:6px 0 8px; }
  #readypop .pnote { font-size:11px; color:var(--dim); margin-bottom:10px; }
  .rcomp { margin:9px 0; }
  .rcomp .rlab { display:flex; justify-content:space-between; font-size:12px; margin-bottom:3px; }
  .rcomp .rlab b { font-family:var(--mono); color:var(--dim); font-weight:500; }
  .rcomp .rbar { height:6px; background:var(--bg); border:1px solid var(--line); border-radius:4px; overflow:hidden; }
  .rcomp .rbar i { display:block; height:100%; background:var(--primary); }
  .rcomp .rdet { font-size:10.5px; color:var(--dim); margin-top:3px; }
  /* readiness action row (F3) */
  #readypop .ract { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:2px 0 10px; }
  #readypop .ract .gobtn { font-size:12px; font-weight:600; background:var(--primary); color:#fff; border:0; border-radius:8px; padding:7px 12px; cursor:pointer; }
  #readypop .ract .gobtn:hover { background:var(--primary-strong); }
  /* generic primary/ghost action buttons reused in the ledger (End session) */

<script>
const DASH = /*__DASHDATA__*/null;
const DATA = DASH ? DASH.map : null;
const esc = s => (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const short = (s,n=24) => { s = s||''; return s.length>n ? s.slice(0,n-1)+'…' : s; };
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const IS_MAC = /Mac|iPhone|iPad/i.test((navigator.platform||'') + ' ' + (navigator.userAgent||''));
let serverMode=false, STATUS=null;

function api(p,body){ return fetch(p,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)})
  .then(r=>r.json()).catch(e=>({ok:false,error:String(e)})); }
function toast(msg, sticky){ const t=document.getElementById('toast'); t.textContent=msg; t.style.display='block';
  clearTimeout(t._h); if(!sticky) t._h=setTimeout(()=>t.style.display='none', 6000); }

// ═════════════════════════ PROMPTS (the UI) ══════════════════════════════════
// Canonical wordings — the single source of truth is prds/use-it-layer.md Appendix A.
// Change one, review both. Copied text is PLAIN markdown; real workspace paths baked in.
const PROMPTS = {
  describeLibrary: () => "Open this folder's design context. Read `design-context/registry.json`, then for every page whose `page.md` still says '(not yet described)', write the screen doc between its ai:begin/ai:end markers per `skills/capture-product/SKILL.md` §5 — grounded only in that page's `content.md`, `screenshot.png`, and `meta.json`. Never invent features; never edit anything outside the markers. Then run `node tools/build-index.js`.",
  wireframe: (slug) => "Read `design-context/pages/" + slug + "/page.md` and look at its `screenshot.png`. I want to explore: ‹describe your change›. Per `skills/wireframe-on-snapshot/SKILL.md`: work on COPIES in `wireframes/" + slug + "/round-1/` (never edit `design-context/`), keep the product's real shell, make 2–3 genuinely different approaches, new elements visibly lo-fi, then render previews with `node tools/shot.js`.",
  whatsMissing: () => "Read `design-context/registry.json` — especially `frontier` (discovered-but-not-downloaded pages) and each page's `states`. Tell me, as my design partner: which locked pages and which missing states matter most for understanding this product, and why. Don't capture anything yet — recommend.",
  addState: () => "I can reach a page state via URL. Run `node tools/capture.js --state <slug>:<state-name> --url \"<the url>\"` and confirm it landed under `design-context/pages/<slug>/states/`.",
  // A.9 (ux-copy.md — verbatim) — guided capture: human-driven, button-only states/modals
  guided: () => "Run `node tools/capture.js --guided --url ‹where to start›`. A browser window opens on my logged-in profile — I'll drive. Watch the folder: each capture lands under `design-context/pages/…` with `method: guided`. When I close the window, run `node tools/build-index.js` and tell me what the hygiene check found.",
  auditTokens: () => "Read `design-context/tokens.json`. These are OBSERVED values (method: heuristic), not authored tokens. As a design-systems reviewer: where is this product consistent, where is it drifting (near-duplicate colors, off-scale spacing), and what would you consolidate first?",
  recaptureCheck: () => "The product may have changed. Re-run `node tools/capture.js --config design-context/product.json`, then compare `contentHash` changes in `design-context/registry.json` and tell me which pages changed and whether their descriptions need updating.",
  bootstrap: () => "You're in a designer's workspace. Read `AGENTS.md` first and follow its five rules. Then read `design-context/INDEX.md` to learn this product, and ask me what I want to work on.",
  // A.8 (ux-copy.md — verbatim, thin-library degrade clause included)
  designNew: () => "Read `design-context/registry.json`, `tokens.json`, and the pages most like what I'm making. I want to design something NEW: ‹describe it›. Build it in this product's own language — reuse its real patterns, spacing, and components; work in `wireframes/new/‹concept›/round-1/`, never in `design-context/`. If the library is too thin to know this product's grammar for some part, say so plainly and mark that part as an assumption — never invent house style. Render previews with `node tools/shot.js`.",
  askQuestion: () => "Read `design-context/registry.json` and `INDEX.md` to learn this product. I have a question about it: ‹your question›. Answer only from what's in the library — the captured pages, their descriptions, and the observed tokens. If the answer isn't in the library, say so plainly rather than guessing.",
};
const COPY_SVG = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5.5" y="5.5" width="8.5" height="8.5" rx="1.5"/><path d="M3.4 10.5H3A1.5 1.5 0 0 1 1.5 9V3A1.5 1.5 0 0 1 3 1.5h6A1.5 1.5 0 0 1 10.5 3v.4"/></svg>';
function pchip(label, text, ghost){ return `<button type="button" class="pchip${ghost?' ghost':''}" data-prompt="${esc(text)}">${COPY_SVG}${esc(label)}</button>`; }
function copyPrompt(text){ if(!text) return;
  (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject())
    .then(()=>toast('Copied — paste it into your AI chat.'))
    .catch(()=>{ toast('Your browser blocked the copy — the prompt is shown below to copy by hand.'); try{ prompt('Copy this prompt:', text); }catch(_){} }); }
// one delegated handler for every chip, anywhere (works during onboarding completion too)
document.addEventListener('click', e=>{ const b = e.target.closest && e.target.closest('[data-prompt]'); if (b) copyPrompt(b.getAttribute('data-prompt')); });
// delegated in-dashboard navigation: any [data-goto] sets the hash → route() (below) reacts
document.addEventListener('click', e=>{ const g = e.target.closest && e.target.closest('[data-goto]'); if (g && !g.hasAttribute('data-prompt')){ e.preventDefault(); if (window.closePanel) window.closePanel(); location.hash = g.getAttribute('data-goto'); } });

// ═════════════════════════ ONBOARDING ════════════════════════════════════════
// wizard → (login-page capture → login window) → live capture → completion.
// State lives on the server (product.json + the capture job); this view drives it.
const OB = { url:'', loggedIn:true, productType:'saas' };
const TYPES = [
  { k:'saas',      label:'SaaS / web app',          copy:'App screens + one example of each repeating page. Some flows (wizards, modals) need a later guided pass.' },
  { k:'ecommerce', label:'E-commerce / marketplace', copy:'Thousands of product pages share one layout — we capture one of each kind and count the rest.' },
  { k:'content',   label:'Content / media',          copy:'Article/video pages collapse to templates; live widgets freeze as captured.' },
  { k:'docs',      label:'Docs / knowledge base',    copy:'Mostly one page template — expect a big “stands for N” number.' },
  { k:'marketing', label:'Marketing site',           copy:'Usually captures completely in one pass.' },
  { k:'notsure',   label:'Not sure',                 copy:'We’ll use balanced defaults — you can refine later from the map.' },
];
let capCount=0, skipCount=0, navCount=0, tplCount=0;

function mountOnboard(){
  document.getElementById('shell').classList.add('onboarding');
  document.querySelectorAll('.pane').forEach(p=>p.classList.remove('active'));
  const el = document.getElementById('pane-onboard');
  el.classList.add('active','scrollpane');
}
function obEl(){ return document.getElementById('pane-onboard'); }

function showWizard(prefill){
  const p = prefill || (STATUS && STATUS.product) || {};
  OB.url = p.url || OB.url || '';
  OB.loggedIn = (p.loggedIn != null) ? !!p.loggedIn : OB.loggedIn;
  OB.productType = p.productType || OB.productType || 'saas';
  obEl().innerHTML = `<div class="ob">
    <h2>Set up your design context</h2>
    <p class="sub">Point the kit at the product you design for. Three answers, then watch it capture — you won’t touch the terminal.</p>
    <div class="fld"><span>Do you sign in to use it?</span>
      <div class="seg" id="w-seg">
        <button type="button" class="segbtn" data-v="yes">Yes, I sign in</button>
        <button type="button" class="segbtn" data-v="no">No, it’s public</button>
      </div></div>
    <label class="fld"><span id="w-url-label">Product URL</span>
      <input type="text" id="w-url" value="${esc(OB.url)}" placeholder="https://app.example.com" autocomplete="off" spellcheck="false"></label>
    <div class="hint" id="w-url-hint"></div>
    <label class="fld"><span>What kind of product is it?</span>
      <select id="w-type">${TYPES.map(t=>`<option value="${t.k}">${esc(t.label)}</option>`).join('')}</select></label>
    <div class="expect" id="w-expect"></div>
    <div class="err" id="w-err"></div>
    <button class="btn primary big" id="w-start">Start capture</button>
  </div>`;
  // Frame the URL question by the sign-in answer: signed-in products want the address you land on
  // AFTER login (that's what triggers the login redirect and IS the real app), not a marketing homepage.
  const paintUrl = ()=>{
    const lbl = document.getElementById('w-url-label'), hint = document.getElementById('w-url-hint');
    if (OB.loggedIn){
      lbl.textContent = 'The address you sign in to';
      hint.innerHTML = 'Use the page you land on <b>after</b> signing in — e.g. <code>app.example.com</code> or <code>example.com/dashboard</code>. A plain homepage (like <code>github.com</code>) often won’t reach your login; the app URL will.';
    } else {
      lbl.textContent = 'Product URL';
      hint.textContent = 'The address of the product you design for.';
    }
  };
  const seg = document.getElementById('w-seg');
  const paintSeg = ()=>seg.querySelectorAll('.segbtn').forEach(b=>b.classList.toggle('on', (b.dataset.v==='yes')===OB.loggedIn));
  seg.querySelectorAll('.segbtn').forEach(b=>b.onclick=()=>{ OB.loggedIn = b.dataset.v==='yes'; paintSeg(); paintUrl(); });
  paintSeg(); paintUrl();
  const sel = document.getElementById('w-type'); sel.value = OB.productType;
  const paintExpect = ()=>{ const t = TYPES.find(x=>x.k===sel.value)||TYPES[0]; document.getElementById('w-expect').textContent = t.copy; };
  sel.onchange = ()=>{ OB.productType = sel.value; paintExpect(); };  // type no longer overrides the sign-in answer
  paintExpect();
  document.getElementById('w-start').onclick = startFlow;
}

function showPhase(title, sub){
  obEl().innerHTML = `<div class="phase"><h2>${esc(title)}</h2><div class="spin"></div><p>${esc(sub)}</p></div>`;
}

function showLoginWait(){
  obEl().innerHTML = `<div class="phase">
    <h2>Log in to your product</h2><div class="spin"></div>
    <p>A browser window just opened. <b>Log in the way you always do</b> — your password stays in that window, never here.
       When you’re in, <b>close the window</b> and I’ll continue automatically.</p>
    <button class="btn" id="ob-manual" style="display:none;margin-top:16px">I’m logged in — continue</button>
  </div>`;
  const b = document.getElementById('ob-manual');
  if (b) b.onclick = ()=>{ if (window.__loginContinue) window.__loginContinue(); };
}

function showProgress(resuming){
  obEl().innerHTML = `<div class="prog">
    <h2>${resuming?'Capture in progress':'Capturing your product'}</h2>
    <p style="color:var(--dim)">Read-only — it follows links, never clicks, submits, or types on your product. It lands one page at a time.
       You can close this tab; the capture keeps running and you’ll see progress again when you reopen.</p>
    <div class="counters">
      <div class="kpi blue"><div class="n" id="c-cap">0</div><div class="l">pages captured</div></div>
      <div class="kpi purple"><div class="n" id="c-tpl">0</div><div class="l">templates collapsed</div></div>
      <div class="kpi amber"><div class="n" id="c-skip">0</div><div class="l">skipped</div></div>
      <div class="kpi"><div class="n" id="c-nav">—</div><div class="l">nav pages found</div></div>
    </div>
    <div class="oblog" id="ob-log"></div>
  </div>`;
}

function resetCounters(){ capCount=0; skipCount=0; navCount=0; tplCount=0; updateCounters(); }
function updateCounters(){ const set=(id,v)=>{ const e=document.getElementById(id); if(e) e.textContent=v; };
  set('c-cap',capCount); set('c-tpl',tplCount); set('c-skip',skipCount); set('c-nav', navCount||'—'); }
function feed(line){
  const el=document.getElementById('ob-log'); if(el){ el.textContent += line+'\n'; el.scrollTop=el.scrollHeight; }
  let m;
  if ((m=line.match(/Nav discovery[^:]*:\s*(\d+)\s*candidate/i))) navCount=+m[1];
  if (/✓ \(/.test(line)) capCount++;
  if (/skipped \(/.test(line)) skipCount++;
  if (/capturing 1 of|⧉ \//.test(line)) tplCount++;
  updateCounters();
}

async function startFlow(){
  const url = document.getElementById('w-url').value.trim();
  const errEl = document.getElementById('w-err');
  if (!/^https?:\/\//i.test(url)) { errEl.textContent = 'Enter a URL that starts with http:// or https://'; return; }
  errEl.textContent=''; OB.url=url;
  const r = await api('/api/onboard', { url, loggedIn:OB.loggedIn, productType:OB.productType });
  if (!r.ok) { errEl.textContent = 'Could not save: ' + (r.error||''); return; }
  try {
    if (OB.loggedIn) { await runLoginPageCapture(); await runLogin(); }
    await runMainCapture();
  } catch (e) { toast('Onboarding error: ' + e.message); }
}

async function waitCaptureDone(){
  for (;;){ const s = await fetch('/api/capture/log?since=0').then(x=>x.json()).catch(()=>null);
    if (s && !s.running) return s; await sleep(700); }
}

async function runLoginPageCapture(){
  showPhase('Capturing your sign-in page', 'A throwaway browser grabs the page a signed-out visitor sees — before you log in. It never touches your session and disappears once you’re in. This is the only chance to capture it.');
  const r = await api('/api/capture/start', { mode:'login-page' });
  if (r.ok) await waitCaptureDone();   // non-fatal if it can't: continue to login
}

function runLogin(){
  return new Promise(async (resolve)=>{
    let resolved=false; const fin=()=>{ if(resolved) return; resolved=true; resolve(); };
    window.__loginContinue = fin;
    showLoginWait();
    await api('/api/login/start', { url:OB.url });
    const started = Date.now();
    const tick = async ()=>{
      if (resolved) return;
      const s = await fetch('/api/login/status').then(x=>x.json()).catch(()=>null);
      if (s && s.started && !s.running) return fin();
      if (Date.now()-started > 60000){ const b=document.getElementById('ob-manual'); if(b) b.style.display='inline-block'; }
      setTimeout(tick, 1500);
    };
    tick();
  });
}

async function runMainCapture(){
  const r = await api('/api/capture/start', { mode:'full' });
  showProgress(false);
  if (!r.ok){
    const s = await fetch('/api/status').then(x=>x.json()).catch(()=>null);
    if (!(s && s.capture && s.capture.running)){
      obEl().innerHTML = `<div class="ob"><h2>Couldn’t start the capture</h2>
        <p class="sub">${esc(r.error||'unknown error')}</p>
        <button class="btn primary big" id="ob-retry">Back to setup</button></div>`;
      document.getElementById('ob-retry').onclick=()=>showWizard(OB); return;
    }
  }
  attachStream();
}

// SSE primary, polling fallback (PRD risk mitigation). `since` counts lines already shown so a
// mid-stream SSE drop resumes cleanly from the server's ring buffer.
function attachStream(){
  resetCounters();
  let done=false, since=0;
  const finish = (info)=>{ if(done) return; done=true; onCaptureDone(info||{}); };
  const startPoll = async ()=>{
    for(;;){ if(done) return;
      const s = await fetch('/api/capture/log?since='+since).then(x=>x.json()).catch(()=>null);
      if (s){ (s.lines||[]).forEach(feed); since = s.next; if(!s.running) return finish({code:s.code}); }
      await sleep(800);
    }
  };
  if (typeof EventSource === 'undefined') return startPoll();
  let es;
  try { es = new EventSource('/api/capture/events'); }
  catch(_){ return startPoll(); }
  es.addEventListener('line', e=>{ feed(e.data); since++; });
  es.addEventListener('done', e=>{ let info={}; try{ info=JSON.parse(e.data); }catch(_){} try{es.close();}catch(_){} finish(info); });
  es.onerror = ()=>{ if(done) return; try{es.close();}catch(_){} startPoll(); };
}

async function onCaptureDone(info){
  const logText = (document.getElementById('ob-log')||{}).textContent || '';
  if (info && info.code && info.code !== 0 && capCount === 0){
    obEl().innerHTML = `<div class="prog"><h2>Capture didn’t complete</h2>
      <p style="color:var(--dim)">It stopped before saving any pages — usually a login that didn’t take, or a site that blocked the browser. The full log is below.</p>
      <div class="oblog" id="ob-log2" style="height:38vh"></div>
      <button class="btn primary big" id="ob-retry">Back to setup</button></div>`;
    document.getElementById('ob-log2').textContent = logText;
    document.getElementById('ob-retry').onclick=()=>showWizard(OB);
    return;
  }
  let host='your product'; try { host = new URL(OB.url || (STATUS&&STATUS.product&&STATUS.product.url) || '').host || host; } catch(_){}
  // a real page slug for the wireframe starter (registry.json now exists — build-index ran at capture end)
  let firstSlug='<slug>';
  try { const reg = await fetch('/registry.json').then(r=>r.json()); const ks = Object.keys(reg.pages||{}); if (ks.length) firstSlug = ks[0]; } catch(_){}
  // capped count comes from the manifest (authoritative) — the log-parsed counters don't track it,
  // and omitting it is how the completion screen used to imply a fuller picture than it captured.
  let cappedCount=0;
  try { const m = await fetch('/manifest.json').then(r=>r.json()); cappedCount = m.capped||0; } catch(_){}
  const sub = [];
  if (tplCount) sub.push(`${tplCount} repeating layout${tplCount===1?'':'s'} collapsed to one example each.`);
  if (skipCount) sub.push(`${skipCount} skipped (the Overview tab says why).`);
  if (cappedCount){ const one = cappedCount===1;
    sub.push(`${cappedCount} more page${one?'':'s'} ${one?'was':'were'} discovered but not downloaded — a cap keeps this first pass small. Find ${one?'it':'them'} on the map's frontier (step 2) and unlock anything that matters.`); }
  obEl().innerHTML = `<div class="ob">
    <h2>Captured ${capCount} page${capCount===1?'':'s'} of ${esc(host)} ✓</h2>
    <p class="sub">${sub.length?sub.join(' ')+' ':''}Your product is now design context your AI tools can read. Three moves to start:</p>
    <div class="ok-note" style="padding:16px">
      <div style="margin-bottom:6px"><b>1 · Describe your pages</b> — an AI writes a guide for each captured page.</div>
      <div class="chiprow" style="margin-bottom:14px">${pchip('Copy the describe prompt', PROMPTS.describeLibrary())}</div>
      <div style="margin-bottom:6px"><b>2 · Explore the map</b> — grey nodes are pages found but not downloaded; click to unlock.</div>
      <div class="chiprow" style="margin-bottom:14px"><button class="pchip ghost" id="ob-map">Open the map</button></div>
      <div style="margin-bottom:6px"><b>3 · First wireframe</b> — design on a copy of a real captured page.</div>
      <div class="chiprow">${pchip('Copy the wireframe prompt', PROMPTS.wireframe(firstSlug), true)}</div>
    </div>
    <button class="btn primary big" id="ob-open">Go to dashboard</button>
  </div>`;
  // NB: the completion screen is served at path "/", so changing only the hash won't reload —
  // set the hash then reload() so boot() re-runs and initDashboard honors #map.
  document.getElementById('ob-map').onclick = ()=>{ location.hash='map'; location.reload(); };
  document.getElementById('ob-open').onclick = ()=>{ location.hash=''; location.reload(); };
}

// ═════════════════════════ BOOT ══════════════════════════════════════════════
(async function boot(){
  try { STATUS = await (await fetch('/api/status')).json(); serverMode = true; } catch(_){ serverMode = false; }
  if (serverMode && STATUS.capture && STATUS.capture.running){ mountOnboard(); showProgress(true); attachStream(); return; } // kill-resilience resume
  if (serverMode && STATUS.firstRun){ mountOnboard(); showWizard(); return; }
  if (DASH) initDashboard();
  else document.getElementById('pane-home').innerHTML =
    '<div class="card" style="max-width:520px;margin:8vh auto">No library captured yet. Run <code>tools/start.sh</code> and follow the on-screen setup.</div>';
})();

// ═════════════════════════ DASHBOARD (map · overview · tokens) ════════════════
// Everything below runs only when a captured library exists.
function initDashboard(){
  // ── tabs + journal pill → hash-based routing (route()/showPane() are hoisted, defined below) ──
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{ location.hash = t.dataset.tab; });
  { const jp=document.getElementById('journalpill'); if(jp) jp.onclick=()=>{ location.hash='journal'; }; }

  // ── v2.1 shared infra: display labels · skeletons/thumbnails · monogram · peek · provenance/camera ──
  const dlabel = n => (n && (n.displayLabel || n.label || n.id)) || '';
  let pageOrigin = 'home';                     // provenance for the page-doc return affordance (F1)
  let mapView = { zoom:1, panX:0, panY:0 };    // persisted map camera (F1 restore · F2 zoom/pan)
  let mapReopen = null;                        // node id whose panel to reopen on return to map
  let guidedLive = null;                       // guided-capture live state (F5): {running,count,lastCapture}

  // thumbnail: skeleton wrapper + fade-in on decode; monogram on error for logos (F5)
  function img2(src, cls, alt){ return src
    ? `<span class="${cls} skel imgwrap"><img class="fadeimg fade" data-src="${esc(src)}" alt="${esc(alt||'')}"></span>`
    : `<span class="${cls} skel"></span>`; }
  function wireThumbs(root){ (root||document).querySelectorAll('img.fade[data-src]:not([data-wired])').forEach(img=>{
    img.setAttribute('data-wired','1'); const wrap=img.parentNode;
    const done=()=>{ img.classList.add('in'); if(wrap&&wrap.classList) wrap.classList.remove('skel'); };
    img.onload=done; img.onerror=()=>{ if(wrap&&wrap.classList) wrap.classList.remove('skel'); img.remove(); };
    img.src=img.getAttribute('data-src'); if(img.complete && img.naturalWidth) done(); }); }
  function monogram(cls, name){ return `<span class="${cls} mono-logo">${esc(((name||DATA.product||'?').trim()[0]||'?'))}</span>`; }

  // peek (F1): one component for atlas + map. #peek is a body-level portal (fixed), never clipped.
  const peekEl = document.getElementById('peek'); let peekHideT=null;
  function showPeek(n, cx, cy){ if(!n){ return; } clearTimeout(peekHideT);
    peekEl.innerHTML = n.locked
      ? `<div class="pk-b"><div class="pk-nm">${esc(short(n.pattern||n.label||'locked',40))}</div>
          <div class="pk-rt">${esc(n.pattern||'')}</div><div class="pk-desc dorm">not downloaded yet</div>
          <div class="pk-foot"><span>linked from ${n.inboundCount||n.count||1} pages</span><span class="pk-hint">click to unlock</span></div></div>`
      : `${img2(n.screenshot,'pk-shot')}
          <div class="pk-b"><div class="pk-nm">${esc(dlabel(n))}</div><div class="pk-rt">${esc(n.route||'')}</div>
          <div class="pk-desc${n.descPending?' dorm':''}">${n.descPending?'caption dormant, waiting for your AI':esc(short(n.desc||'',120))}</div>
          <div class="pk-foot"><span>linked from ${n.inboundCount||0} pages</span><span class="pk-hint">click to inspect</span></div></div>`;
    peekEl.classList.add('open'); peekEl.setAttribute('aria-hidden','false'); wireThumbs(peekEl); positionPeek(cx,cy); }
  function positionPeek(cx, cy){ const w=peekEl.offsetWidth||252, h=peekEl.offsetHeight||170;
    let x=cx+16, y=cy+16; if(x+w>innerWidth-8) x=cx-w-16; if(x<8) x=8;
    if(y+h>innerHeight-8) y=Math.max(8, cy-h-16); if(y<8) y=8; peekEl.style.left=x+'px'; peekEl.style.top=y+'px'; }
  function hidePeek(){ clearTimeout(peekHideT); peekHideT=setTimeout(()=>{ peekEl.classList.remove('open'); peekEl.setAttribute('aria-hidden','true'); }, 60); }

  // ═════════ MAP TAB — M22 orbital under fog (v2.1: zero-overlap · zoom · regions) ═════════
  // Honesty invariant: every spatial encoding is MEASURED — ring = clicks-from-home (clickDepth),
  // node size = inbound links (observed), bearing = the page's nav section. Only fog is decorative.
  // Zero-overlap: discs relaxed deterministically; labels placed by a measured screen-space collision pass.
  const nodes = [], byId = {};
  DATA.nodes.forEach(n=>{ const o = {...n, locked:false}; nodes.push(o); byId[o.id]=o; });
  DATA.frontier.forEach(f=>{ const o = {...f, locked:true}; nodes.push(o); byId[o.id]=o; });
  const edges = DATA.edges.filter(e=>byId[e.a]&&byId[e.b]);
  const adj = {}; nodes.forEach(n=>adj[n.id]=new Set());
  edges.forEach(e=>{ adj[e.a].add(e.b); adj[e.b].add(e.a); });
  document.getElementById('title').innerHTML = esc(DATA.product) + ' <span class="mono">design context</span>';
  document.title = DATA.product + ' — design context';
  const lockedTotal = DATA.frontier.reduce((s,f)=>s+(f.count||1),0);
  const root = nodes.find(n=>!n.locked && (n.id===DATA.rootSlug || n.route==='/')) || nodes.find(n=>!n.locked) || nodes[0];

  const selected = new Set(); let activeNode = null;
  const world=document.getElementById('mapworld'), fogEl=document.getElementById('mapfog'), linesEl=document.getElementById('maplines'),
        labelsEl=document.getElementById('maplabels'), dcardEl=document.getElementById('mapdcard');
  const capNodes = nodes.filter(n=>!n.locked && n!==root);
  const maxIn = Math.max(1, root.inboundCount||0, ...capNodes.map(n=>n.inboundCount||0), ...DATA.frontier.map(f=>f.inboundCount||0));
  const secList0 = (DATA.sections||[]).filter(s=>s!=='Home');
  const secList = secList0.length ? secList0 : ['Other'];
  const bearing = {}; secList.forEach((s,i)=> bearing[s] = -Math.PI/2 + (i/secList.length)*2*Math.PI);
  const bearingOf = (s)=> bearing[s]!=null ? bearing[s] : 0;

  // ---- layout state (world coords, home at 0,0) ----
  let VW=0, VH=0, minD=0, maxDepth=1, ringR1=0, ringRmax=0, nullR=0, ghostR=0;
  const P = {};                 // id -> {x,y,r,node,ghost}
  let ghostShown=[], deepCount=0, unreachCount=0, regions=[], hotRegion=null;
  const ringRadius = (d)=> maxDepth<=1 ? ringR1 : ringR1 + (d-1)*(ringRmax-ringR1)/(maxDepth-1);
  const sizeOf = (n)=> Math.round(16 + 46*Math.min(1,(n.inboundCount||0)/maxIn));

  function computeLayout(){
    const pane=document.getElementById('pane-map'); const r=pane.getBoundingClientRect();
    VW=r.width; VH=r.height; if(!VW||!VH) return; minD=Math.min(VW,VH);
    for(const k in P) delete P[k];
    const homeD=Math.max(58, minD*0.10); P[root.id]={x:0,y:0,r:homeD/2, node:root};
    maxDepth=Math.max(1, ...capNodes.map(n=> n.clickDepth==null?1:n.clickDepth));
    ringR1=minD*0.22; ringRmax=minD*0.40; nullR=minD*0.45; ghostR=minD*0.56;
    const groups={}; capNodes.forEach(n=>{ const k=(n.section||'Other')+'|'+(n.clickDepth==null?'x':n.clickDepth); (groups[k]=groups[k]||[]).push(n); });
    const gap=2*Math.PI/secList.length;
    Object.values(groups).forEach(g=>{ g.sort((a,b)=>(b.inboundCount||0)-(a.inboundCount||0));
      const w=gap*Math.min(0.92, 0.34+0.10*g.length);
      g.forEach((n,i)=>{ const b=bearingOf(n.section); const off=g.length>1?(i-(g.length-1)/2)*(w/g.length):0;
        const rad=n.clickDepth==null?nullR:ringRadius(n.clickDepth);
        P[n.id]={x:Math.cos(b+off)*rad, y:Math.sin(b+off)*rad, r:sizeOf(n)/2, node:n}; }); });
    const ghosts=DATA.frontier.slice().sort((a,b)=>(b.inboundCount||0)-(a.inboundCount||0));
    ghostShown=ghosts.slice(0, Math.min(ghosts.length,14));
    const gg={}; ghostShown.forEach(f=>{ const k=f.section||'Other'; (gg[k]=gg[k]||[]).push(f); });
    Object.values(gg).forEach(g=>g.forEach((f,i)=>{ const b=bearingOf(f.section)+(i-(g.length-1)/2)*0.18; const rad=ghostR+(i%2)*minD*0.05;
      P[f.id]={x:Math.cos(b)*rad, y:Math.sin(b)*rad, r:(Math.round(12+18*Math.min(1,(f.inboundCount||1)/maxIn)))/2, node:f, ghost:true}; }));
    deepCount=Math.max(0, lockedTotal - ghostShown.reduce((s,f)=>s+(f.count||1),0));
    unreachCount=capNodes.filter(n=>n.clickDepth==null).length;
    relaxDiscs();
    computeRegions();
  }
  // deterministic relaxation — seeded from the radial layout, home fixed; guarantees disc gaps
  function relaxDiscs(){
    const ids=Object.keys(P).filter(id=>id!==root.id);
    const GAP=10, hr=P[root.id].r;
    for(let iter=0; iter<1500; iter++){ let worst=0;
      for(let i=0;i<ids.length;i++){ for(let j=i+1;j<ids.length;j++){
        const a=P[ids[i]], b=P[ids[j]]; let dx=b.x-a.x, dy=b.y-a.y; let d=Math.hypot(dx,dy);
        if(d<0.001){ dx=Math.cos(i*1.7); dy=Math.sin(i*1.7); d=0.001; }   // break exact coincidence deterministically
        const need=a.r+b.r+GAP; if(d<need){ const push=(need-d)/2, ux=dx/d, uy=dy/d;
          a.x-=ux*push; a.y-=uy*push; b.x+=ux*push; b.y+=uy*push; worst=Math.max(worst,need-d); } } }
      for(const id of ids){ const p=P[id]; const d=Math.hypot(p.x,p.y)||0.001; const need=p.r+hr+10;
        if(d<need){ p.x+=p.x/d*(need-d); p.y+=p.y/d*(need-d); } }
      if(worst<0.25) break;
    }
  }
  // districts → regions (rounded bbox behind member nodes); 1-page sections merge into "Everything else"
  function computeRegions(){
    regions=[];
    const bySec={}; capNodes.forEach(n=>{ const s=n.section||'Other'; (bySec[s]=bySec[s]||[]).push(n); });
    const small=[];
    for(const [name,arr] of Object.entries(bySec)){ if(arr.length<=1){ small.push(...arr); continue; } regions.push(makeRegion(name, arr)); }
    if(small.length) regions.push(makeRegion('Everything else', small, small.length));
  }
  function makeRegion(name, arr, smallCount){
    let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9; const pad=30;
    arr.forEach(n=>{ const p=P[n.id]; if(!p) return; minx=Math.min(minx,p.x-p.r); miny=Math.min(miny,p.y-p.r); maxx=Math.max(maxx,p.x+p.r); maxy=Math.max(maxy,p.y+p.r); });
    const dist=(DATA.districts||[]).find(d=>d.name===name);
    const explored = smallCount!=null ? smallCount : (dist?dist.explored:arr.length);
    const fog = smallCount!=null ? 0 : (dist?dist.fog:0);
    const states = arr.filter(n=>(n.states||[]).some(s=>s.captured)).length;
    return { name, x:minx-pad, y:miny-pad, w:(maxx-minx)+pad*2, h:(maxy-miny)+pad*2, cx:(minx+maxx)/2, cy:(miny+maxy)/2, explored, fog, states, merged:smallCount!=null };
  }

  // ---- camera ----
  const toScreen = (p)=> [VW/2 + p.x*mapView.zoom + mapView.panX, VH/2 + p.y*mapView.zoom + mapView.panY];
  function renderWorld(){
    let html='';
    regions.forEach((rg,i)=>{ html+=`<div class="mapregion" data-region="${i}" style="left:${rg.x}px;top:${rg.y}px;width:${rg.w}px;height:${rg.h}px"></div>`; });
    for(let d=1; d<=maxDepth; d++){ const rr=ringRadius(d); html+=`<div class="mapring" style="left:0;top:0;width:${rr*2}px;height:${rr*2}px"></div>`; }
    // discs
    const disc=(id)=>{ const p=P[id]; if(!p) return ''; const n=p.node; const px=Math.round(p.x), py=Math.round(p.y), dia=Math.round(p.r*2);
      if(p.ghost){ return `<button class="mapghost" data-mapid="${esc(n.id)}" title="${esc(n.pattern||n.label||'')}" style="left:${px}px;top:${py}px;transform:translate(-50%,-50%)"><span class="gc" style="width:${dia}px;height:${dia}px"></span></button>`; }
      const isHome=n===root; const small=dia<30 && !isHome; const hasStates=(n.states||[]).some(s=>s.captured);
      const bg = (!small && n.screenshot) ? `background-image:url('${esc(n.screenshot)}')` : '';
      const cls = `mapnode${n.kind==='template'?' tpl':''}${n.descPending?' dorm':''}${small?' mono-disc':''}`;
      return `<button class="${cls}" data-mapid="${esc(n.id)}" title="${esc(dlabel(n))} — from ${n.inboundCount||0}" style="left:${px}px;top:${py}px;transform:translate(-50%,-50%);width:${dia}px;height:${dia}px;${isHome?'border-width:3px;border-color:var(--primary-strong);':''}${bg}">${hasStates?'<span class="st" title="has captured states"></span>':''}</button>`; };
    html+=disc(root.id);
    capNodes.forEach(n=>html+=disc(n.id));
    ghostShown.forEach(f=>html+=disc(f.id));
    world.innerHTML=html;
    world.querySelectorAll('.mapregion').forEach(el=>{ const rg=regions[+el.dataset.region];
      el.addEventListener('mouseenter', ()=>showRegion(rg, el)); el.addEventListener('mouseleave', hideRegion); });
  }
  function applyMapView(){
    world.style.transform=`translate(${(VW/2+mapView.panX)}px, ${(VH/2+mapView.panY)}px) scale(${mapView.zoom})`;
    // fog: screen-space, centered on home, radii scaled with zoom so it tracks the orbits
    const cx=VW/2+mapView.panX, cy=VH/2+mapView.panY, z=mapView.zoom;
    const clear=minD*0.46*z, mid=minD*0.55*z, opaque=minD*0.68*z;
    fogEl.style.background=`radial-gradient(circle at ${cx}px ${cy}px, rgba(240,243,247,0) ${clear}px, rgba(223,229,239,.6) ${mid}px, rgba(216,223,235,.93) ${opaque}px, rgba(214,221,233,1) ${opaque+60}px)`;
    const zl=document.getElementById('zlbl'); if(zl) zl.textContent=Math.round(mapView.zoom*100)+'%';
    placeLabels();
    if(hoverId) drawLinks(hoverId);
    if(hotRegion) positionCard(hotRegion.rg, hotRegion.el);
  }
  const ovl=(a,b)=>{ const ox=Math.min(a.right,b.right)-Math.max(a.left,b.left), oy=Math.min(a.bottom,b.bottom)-Math.max(a.top,b.top); return ox>4 && oy>4; };
  function placeLabels(){
    labelsEl.innerHTML='';
    const z=mapView.zoom, level = z<0.9?'far': z<1.7?'mid':'near';
    const paneRect=document.getElementById('pane-map').getBoundingClientRect();
    const committed=[];
    world.querySelectorAll('.mapnode, .mapghost .gc').forEach(el=>{ const r=el.getBoundingClientRect();
      committed.push({left:r.left-paneRect.left, top:r.top-paneRect.top, right:r.right-paneRect.left, bottom:r.bottom-paneRect.top}); });
    const specs=[];
    { const [sx,sy]=toScreen(P[root.id]); specs.push({pri:0, ax:sx, ay:sy+P[root.id].r*z+3, cls:'maphomelbl', below:true, html:`${esc(dlabel(root))}<small>${root.inboundCount||0} in · ${(root.linksTo||[]).length} out</small>`}); }
    for(let d=1; d<=maxDepth; d++){ const rr=ringRadius(d)*z; const cx=VW/2+mapView.panX, cy=VH/2+mapView.panY;
      specs.push({pri:1, ring:true, cx, cy, rr, cls:'maprlbl', html:`${d} click${d===1?'':'s'}`}); }
    if(unreachCount>0){ const [ax,ay]=toScreen({x:Math.cos(2.0)*nullR, y:Math.sin(2.0)*nullR}); specs.push({pri:1, ax, ay, center:true, cls:'maparclbl', html:`not linked from home — ${unreachCount} pages`}); }
    if(deepCount>0){ const [dx,dy]=toScreen({x:Math.cos(-0.55)*ghostR*1.16, y:Math.sin(-0.55)*ghostR*1.16}); specs.push({pri:1, ax:dx, ay:dy, center:true, cls:'maparclbl', html:`deep fog<small>…${deepCount} more — templates stand for most</small>`}); }
    let set=[];
    if(level==='near') set=capNodes.slice();
    else if(level==='mid'){ const bySec={}; capNodes.forEach(n=>{(bySec[n.section||'Other']=bySec[n.section||'Other']||[]).push(n)});
      Object.values(bySec).forEach(g=>{ g.sort((a,b)=>(b.inboundCount||0)-(a.inboundCount||0)); set.push(...g.slice(0,2)); }); }
    set.sort((a,b)=>(b.inboundCount||0)-(a.inboundCount||0));
    set.forEach(n=>{ const [sx,sy]=toScreen(P[n.id]); specs.push({pri:2+(1-(n.inboundCount||0)/maxIn), ax:sx, ay:sy, dr:P[n.id].r*z, cls:'mapnlbl', below:true, node:n, html:`${esc(short(dlabel(n),18))}<br><small>from ${n.inboundCount||0}</small>`}); });
    if(level==='near') ghostShown.forEach(f=>{ const [sx,sy]=toScreen(P[f.id]); specs.push({pri:3, ax:sx, ay:sy, dr:P[f.id].r*z, cls:'mapghostlbl', below:true, html:`${esc(short(f.pattern||f.label||'',16))}<small>from ${f.inboundCount||f.count||1}</small>`}); });
    specs.sort((a,b)=>a.pri-b.pri);
    const els=specs.map(s=>{ const e=document.createElement('div'); e.className=s.cls; e.style.visibility='hidden'; e.innerHTML=s.html; labelsEl.appendChild(e); return e; });
    const placed=[...committed];
    specs.forEach((s,i)=>{ const e=els[i]; const w=e.offsetWidth, h=e.offsetHeight; let cands=[];
      if(s.ring){ for(const a of [0,-0.35,0.35,-0.7,0.7,Math.PI]) cands.push([s.cx+Math.cos(a)*s.rr - w/2, s.cy+Math.sin(a)*s.rr - h/2]); }
      else if(s.center){ cands=[[s.ax-w/2, s.ay-h/2]]; }
      else { const dr=s.dr||0; cands=[[s.ax-w/2, s.ay+dr+3],[s.ax-w/2, s.ay-dr-3-h],[s.ax+dr+4, s.ay-h/2],[s.ax-dr-4-w, s.ay-h/2],[s.ax-w/2, s.ay+dr+18],[s.ax-w/2, s.ay+dr+34]]; }
      let ok=false;
      for(const [lx,ly] of cands){ const box={left:lx,top:ly,right:lx+w,bottom:ly+h};
        if(box.left<2||box.top<2||box.right>VW-2||box.bottom>VH-2) continue;
        if(placed.some(p=>ovl(p,box))) continue;
        e.style.left=lx+'px'; e.style.top=ly+'px'; e.style.visibility='visible'; placed.push(box); ok=true; break; }
      if(!ok) e.remove();
    });
    // safety net — guarantee 0 overlaps at rest: forward pass keeps higher-priority labels, hides any later clash
    { const paneR=document.getElementById('pane-map').getBoundingClientRect(); const kept=[];
      [...labelsEl.children].forEach(e=>{ if(e.style.visibility==='hidden') return; const r=e.getBoundingClientRect();
        const box={left:r.left-paneR.left,top:r.top-paneR.top,right:r.right-paneR.left,bottom:r.bottom-paneR.top};
        if(committed.some(d=>ovl(d,box)) || kept.some(k=>ovl(k,box))) e.style.visibility='hidden'; else kept.push(box); }); }
    // overlays text
    const explored=capNodes.length+1, known=explored+lockedTotal, pct=known?100*explored/known:0;
    document.getElementById('mapstats').innerHTML=`<b>${pct<1?pct.toFixed(1):Math.round(pct)}% of the known world explored</b> · rings are honest clicks-from-home · every unlock pushes the fog back`;
    document.getElementById('mapnote').textContent='rings = how many clicks from home · hover a page for its real links · drag to pan, scroll to zoom';
    document.getElementById('maplegend').innerHTML=
      `<span class="lg"><i style="width:14px;height:14px;border:2.5px solid var(--primary);border-radius:50%"></i>explored — size = how linked-to</span>
       <span class="lg"><i style="width:11px;height:11px;border:2px solid #C9CDD6;border-radius:50%"></i>explored, dormant caption</span>
       <span class="lg"><i style="width:11px;height:11px;border:2px dashed #AEB4C0;border-radius:50%"></i>ghost in the fog — locked</span>
       <span class="lg" style="border-top:1px solid var(--line);padding-top:5px">hover a region for its district</span>`;
  }

  // ---- regions (hover → highlight + card anchored to territory) ----
  function positionCard(rg, el){ const [sx,sy]=toScreen({x:rg.cx, y:rg.y}); let x=sx, y=sy-8;
    dcardEl.style.left='0'; dcardEl.style.top='0'; const w=dcardEl.offsetWidth||170, h=dcardEl.offsetHeight||64;
    x=Math.max(w/2+6, Math.min(VW-w/2-6, x)); y=Math.max(60, Math.min(VH-h-10, y-h));
    dcardEl.style.left=x+'px'; dcardEl.style.top=y+'px'; dcardEl.style.transform='translate(-50%,0)'; }
  function showRegion(rg, el){ hotRegion={rg,el}; el.classList.add('hot');
    dcardEl.innerHTML=`<h4>${esc(rg.name)}</h4><p>${rg.explored} explored${rg.fog?` · ${rg.fog} in the fog`:''}${rg.states?` · ${rg.states} ${rg.states===1?'page has':'pages have'} states`:''}</p>
      <div class="bar"><i style="width:${rg.explored+rg.fog?Math.round(100*rg.explored/(rg.explored+rg.fog)):100}%"></i></div>`;
    dcardEl.style.display='block'; positionCard(rg, el); }
  function hideRegion(){ if(hotRegion&&hotRegion.el) hotRegion.el.classList.remove('hot'); hotRegion=null; dcardEl.style.display='none'; }

  // ---- hover links + peek + click ----
  let hoverId=null;
  function drawLinks(id){ const n=byId[id]; if(!n||!P[id]){ linesEl.innerHTML=''; return; }
    const seg=(a,b,out)=>{ const A=P[a],B=P[b]; if(!A||!B) return ''; const [x1,y1]=toScreen(A),[x2,y2]=toScreen(B);
      return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${out?'rgba(79,70,229,.55)':'rgba(102,112,133,.4)'}" stroke-width="1.4"/>`; };
    let s=''; (n.linksTo||[]).forEach(t=>s+=seg(id,t,true)); (n.linkedFrom||[]).forEach(t=>s+=seg(t,id,false)); linesEl.innerHTML=s; }
  world.addEventListener('mouseover', e=>{ const b=e.target.closest('[data-mapid]'); if(b){ const n=byId[b.getAttribute('data-mapid')]; if(n){ hoverId=n.id; drawLinks(n.id); showPeek(n, e.clientX, e.clientY); } } });
  world.addEventListener('mousemove', e=>{ if(peekEl.classList.contains('open')) positionPeek(e.clientX, e.clientY); });
  world.addEventListener('mouseout', e=>{ const b=e.target.closest('[data-mapid]'); if(b){ hoverId=null; linesEl.innerHTML=''; hidePeek(); } });
  world.addEventListener('click', e=>{ if(mapDragged) return; const b=e.target.closest('[data-mapid]'); if(b){ const n=byId[b.getAttribute('data-mapid')]; if(n) openPanel(n); } });

  // ---- zoom + pan ----
  const clampZoom=z=>Math.max(0.45, Math.min(3, z));
  function zoomAt(cx, cy, factor){ const z0=mapView.zoom, z1=clampZoom(z0*factor);
    // keep the world point under (cx,cy) fixed
    const wx=(cx - (VW/2+mapView.panX))/z0, wy=(cy - (VH/2+mapView.panY))/z0;
    mapView.zoom=z1; mapView.panX = cx - VW/2 - wx*z1; mapView.panY = cy - VH/2 - wy*z1; applyMapView(); }
  const mapPane=document.getElementById('pane-map');
  mapPane.addEventListener('wheel', e=>{ if(!mapPane.classList.contains('active')) return; e.preventDefault();
    const r=mapPane.getBoundingClientRect(); zoomAt(e.clientX-r.left, e.clientY-r.top, e.deltaY<0?1.12:0.893); }, {passive:false});
  let panning=false, sx0=0, sy0=0, mapDragged=false;
  mapPane.addEventListener('mousedown', e=>{ if(e.target.closest('#mapzoom')) return; panning=true; mapDragged=false; sx0=e.clientX; sy0=e.clientY; world.style.cursor='grabbing'; });
  addEventListener('mousemove', e=>{ if(!panning) return; const dx=e.clientX-sx0, dy=e.clientY-sy0; if(Math.abs(dx)+Math.abs(dy)>3) mapDragged=true;

  document.getElementById('zinbtn').onclick=()=>zoomAt(VW/2, VH/2, 1.2);
